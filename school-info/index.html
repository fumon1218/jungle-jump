<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155bc8"><link rel="manifest" href="manifest.webmanifest"><title>우리학교 한눈에</title><style>
*{box-sizing:border-box}body{font:15px system-ui,'Malgun Gothic',sans-serif;background:#f4f7fc;color:#22334c;margin:0}.wrap{max-width:680px;margin:auto;padding-bottom:95px}header{padding:35px 21px;color:white;background:linear-gradient(120deg,#1556bd,#3891d8);border-radius:0 0 25px 25px}header h1{font-size:27px;margin:5px 0}header p{opacity:.9;font-size:13px}main{padding:0 15px}.card{background:white;border:1px solid #e6edf5;box-shadow:0 6px 28px #153c6210;border-radius:20px;margin:16px 0;padding:18px}.search{margin-top:-13px;position:relative}.row{display:flex;gap:8px}.row input{min-width:0;flex:1}input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #d6e1f0}input{width:100%;font-size:16px}button{background:#155bc8;color:white;border:0;font-weight:700;cursor:pointer}.light{background:#eef5ff;color:#1556a9}.result{display:block;width:100%;text-align:left;background:#f5f9ff;color:#253751;margin:9px 0;border:1px solid #e2ebf7}.result small{display:block;margin-top:5px;color:#677b97}.muted{color:#71839d;font-size:13px;line-height:1.6}.item{padding:13px 3px;border-bottom:1px solid #edf0f5}.item:last-child{border:0}.date{font-size:12px;color:#155bc8;font-weight:bold}.dish{white-space:pre-line;line-height:1.8}.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fact{background:#f6f9fd;padding:12px;border-radius:12px;overflow-wrap:anywhere}.fact small{display:block;color:#70819a;margin-bottom:5px}.bar{display:flex;align-items:center;justify-content:space-between;gap:7px}.bar input{width:165px;font-size:14px;padding:8px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffe;backdrop-filter:blur(12px);border-top:1px solid #e4ebf5;display:flex;justify-content:center;padding:9px 8px calc(9px + env(safe-area-inset-bottom))}.nav-inner{max-width:680px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{background:transparent;color:#70819a;font-size:12px;padding:8px 0}.nav button[aria-selected=true]{background:#e8f2ff;color:#155bc8}.nav span{display:block;font-size:21px}h2{font-size:17px;margin:0 0 12px}.status{font-size:13px;color:#52708d;margin:10px 0}.hide{display:none!important}details{margin:12px 0}summary{color:#2561a5;cursor:pointer}footer{text-align:center;font-size:11px;color:#8191a6;line-height:1.7;margin:20px 0}@media(max-width:355px){.facts{grid-template-columns:1fr}header h1{font-size:23px}}</style></head><body><div class="wrap"><header><div style="font-size:11px;font-weight:700">NEIS SCHOOL PORTAL</div><h1>🏫 우리학교 한눈에</h1><p>학교정보 · 학사일정 · 오늘의 급식</p></header><main><section class="card search"><div class="bar"><h2>학교 찾기</h2><button id="keybtn" class="light" type="button">🔑 API 설정</button></div><form id="form" class="row"><input id="name" placeholder="학교명 입력" aria-label="학교명" required><button>검색</button></form><div id="msg" role="status" class="status"></div><div id="results"></div><details id="settings"><summary>나이스 API 인증키</summary><p class="muted">인증키는 현재 탭의 세션에만 저장됩니다. 정적 웹앱이므로 인증키가 브라우저 네트워크 요청에 노출될 수 있습니다. 비밀 업무용 키는 사용하지 마세요.</p><div class="row"><input id="key" type="password" placeholder="API 인증키" aria-label="API 인증키"><button id="save" type="button" class="light">적용</button></div><p class="muted"><a href="https://open.neis.go.kr" target="_blank" rel="noopener">나이스 개방포털에서 발급</a></p></details></section><section class="card hide" id="panel"><div style="background:#edf5ff;border-radius:13px;padding:14px;margin-bottom:14px"><strong id="school" style="font-size:19px"></strong><div id="address" class="muted"></div></div><div class="bar"><h2 id="title">학교 기본정보</h2><input id="month" type="month" aria-label="조회 연월"></div><div id="detail"></div></section><footer>자료 출처: 교육부 나이스 교육정보 개방포털<br>비공식 공공정보 조회 서비스</footer></main></div><nav class="nav"><div class="nav-inner"><button data-tab="info" aria-selected="true"><span>🏫</span>학교정보</button><button data-tab="schedule" aria-selected="false"><span>📅</span>학사일정</button><button data-tab="meal" aria-selected="false"><span>🍱</span>급식정보</button><button data-tab="stats" aria-selected="false"><span>📊</span>학교현황</button></div></nav><script>
const $=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let key=sessionStorage.getItem('neis-key')||'',school=null,tab='info',counter=0;const d=new Date();$('month').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');$('key').value=key;$('month').hidden=true;if(!key){$('settings').open=true;$('msg').textContent='API 키를 먼저 설정하세요.'}function msg(s){$('msg').textContent=s}function fmt(s){s=String(s||'');return /^\d{8}$/.test(s)?s.slice(0,4)+'.'+s.slice(4,6)+'.'+s.slice(6):esc(s)}function period(){const [y,m]=$('month').value.split('-').map(Number),p=y+String(m).padStart(2,'0');return [p+'01',p+String(new Date(y,m,0).getDate()).padStart(2,'0')]}async function api(ep,params){if(!key)throw Error('API 키를 설정하세요.');const u=new URL('https://open.neis.go.kr/hub/'+ep);Object.entries({...params,KEY:key,Type:'json',pIndex:1,pSize:ep==='schoolInfo'?100:1000}).forEach(([k,v])=>u.searchParams.set(k,v));let r;try{r=await fetch(u,{cache:'no-store'})}catch(e){throw Error('네트워크 또는 API CORS 정책 때문에 직접 조회하지 못했습니다.')}if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(Array.isArray(j[ep]))return j[ep].find(x=>x.row)?.row||[];if(j.RESULT?.CODE==='INFO-200')return [];throw Error(j.RESULT?.MESSAGE||'데이터를 읽을 수 없습니다.')} $('keybtn').onclick=()=>{$('settings').open=true;$('key').focus()};$('save').onclick=()=>{key=$('key').value.trim();key?sessionStorage.setItem('neis-key',key):sessionStorage.removeItem('neis-key');$('settings').open=false;msg(key?'인증키가 설정되었습니다.':'인증키가 삭제되었습니다.')};$('form').onsubmit=async e=>{e.preventDefault();const id=++counter;msg('검색 중…');$('results').replaceChildren();try{const rows=await api('schoolInfo',{SCHUL_NM:$('name').value.trim()});if(id!==counter)return;msg(rows.length+'개 학교 검색');rows.forEach(s=>{const b=document.createElement('button');b.className='result';b.type='button';b.innerHTML='<strong>'+esc(s.SCHUL_NM)+'</strong><small>'+esc(s.ATPT_OFCDC_SC_NM)+' · '+esc(s.ORG_RDNMA)+'</small>';b.onclick=()=>{school=s;$('school').textContent=s.SCHUL_NM;$('address').textContent=s.ORG_RDNMA||'';$('results').replaceChildren();$('panel').classList.remove('hide');msg('학교를 선택했습니다.');render();$('panel').scrollIntoView({behavior:'smooth'})};$('results').append(b)})}catch(e){if(id===counter)msg(e.message)}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));if(!school){msg('먼저 학교를 선택하세요.');return}render()});$('month').onchange=render;function render(){if(!school)return;const id=++counter;$('title').textContent={info:'학교 기본정보',schedule:'학사일정',meal:'급식정보',stats:'학급·학생 현황'}[tab];$('month').hidden=tab==='info';if(tab==='stats'){loadStats(id);return}if(tab==='info'){const cols=[['학교명','SCHUL_NM'],['학교 종류','SCHUL_KND_SC_NM'],['관할 교육청','ATPT_OFCDC_SC_NM'],['설립','FOND_SC_NM'],['주소','ORG_RDNMA'],['전화','ORG_TELNO'],['홈페이지','HMPG_ADRES'],['학교 코드','SD_SCHUL_CODE']];$('detail').innerHTML='<div class="facts">'+cols.map(([n,k])=>'<div class="fact"><small>'+n+'</small>'+esc(school[k]||'정보 없음')+'</div>').join('')+'</div>';return}load(id)}async function load(id){$('detail').innerHTML='<div class="status">자료를 불러오는 중…</div>';const [a,b]=period(),base={ATPT_OFCDC_SC_CODE:school.ATPT_OFCDC_SC_CODE,SD_SCHUL_CODE:school.SD_SCHUL_CODE},cal=tab==='schedule';try{const rows=await api(cal?'SchoolSchedule':'mealServiceDietInfo',cal?{...base,AA_FROM_YMD:a,AA_TO_YMD:b}:{...base,MLSV_FROM_YMD:a,MLSV_TO_YMD:b});if(id!==counter)return;rows.sort((x,y)=>String(x.AA_YMD||x.MLSV_YMD).localeCompare(String(y.AA_YMD||y.MLSV_YMD)));$('detail').innerHTML=rows.length?rows.map(r=>cal?'<article class="item"><div class="date">'+fmt(r.AA_YMD)+'</div><strong>'+esc(r.EVENT_NM)+'</strong><div class="muted">'+esc(r.EVENT_CNTNT||'')+'</div></article>':mealCard(r)).join(''):'<p class="muted">조회 가능한 자료가 없습니다.</p>'}catch(e){if(id===counter)$('detail').textContent=e.message}}

async function loadStats(id){
 $('detail').innerHTML='<p class="status">학급 정보를 조회하는 중…</p>';
 const ay=new Date().getFullYear(),base={ATPT_OFCDC_SC_CODE:school.ATPT_OFCDC_SC_CODE,SD_SCHUL_CODE:school.SD_SCHUL_CODE,AY:ay};
 try{
  const rows=await api('classInfo',base);
  if(id!==counter)return;
  const groups=new Map();
  rows.forEach(r=>{const grade=String(r.GRADE||r.SCHUL_CRSE_SC_NM||'기타');const count=Number(r.CLASS_NM?1:(r.CLASS_CNT||1));groups.set(grade,(groups.get(grade)||0)+count)});
  const total=[...groups.values()].reduce((a,b)=>a+b,0);
  let html='<div class="fact"><small>'+esc(ay)+'학년도 나이스 반정보</small><strong style="font-size:22px">'+(rows.length?total+'개 반':'제공 자료 없음')+'</strong></div>';
  if(rows.length)html+='<div style="margin-top:12px">'+[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko',{numeric:true})).map(([g,c])=>'<div class="item"><strong>'+esc(g)+'학년</strong> · '+c+'개 반</div>').join('')+'</div>';
  html+='<p class="muted">위 학급 수는 나이스 반정보에서 조회된 반 목록 기준입니다. 특수학교의 교육과정별 학급 편성 방식이나 API 제공 범위에 따라 실제 편제 학급 수와 다를 수 있습니다.</p>';
  html+='<h2 style="margin-top:22px">👩‍🎓 학생 현황</h2><p class="muted">전체 학생 수·학년별 학생 수·성별 학생 수는 학교알리미에 공시됩니다. 현재 앱에는 학교알리미 인증키 연동이 없어 수치를 표시하지 않습니다.</p><a href="https://www.schoolinfo.go.kr/" target="_blank" rel="noopener" style="display:block;background:#edf5ff;color:#155bc8;padding:14px;border-radius:12px;text-align:center;font-weight:700;text-decoration:none">학교알리미에서 학생 현황 확인 ↗</a>';
  html+='<h2 style="margin-top:22px">👩‍🏫 교원 현황</h2><p class="muted">직위별 교원 수와 기타 학교정보 공시도 학교알리미에서 확인할 수 있습니다. 나이스 반정보를 교원 수로 환산하지 않습니다.</p>';
  $('detail').innerHTML=html;
 }catch(e){if(id===counter)$('detail').innerHTML='<p class="muted">학급 정보 조회 실패: '+esc(e.message)+'</p><p class="muted">학생 수와 교원 수는 학교알리미에서 별도로 확인할 수 있습니다.</p>'}
}



const mealTypes=[
{test:/돈가스|돈까스|커틀릿|카츠|튀김|치킨|닭강정|탕수육|생선까스/,type:'crispy',title:'바삭한 메인 요리',icon:'🍗'},
{test:/국수|우동|라면|라멘|스파게티|파스타|짜장면|짬뽕|쫄면|냉면|칼국수|떡볶이/,type:'noodle',title:'면·분식',icon:'🍜'},
{test:/카레|덮밥|비빔밥|볶음밥|오므라이스|주먹밥|김밥|유부초밥/,type:'rice',title:'밥 요리',icon:'🍛'},
{test:/국|탕|찌개|전골|스프|수프/,type:'soup',title:'국·찌개',icon:'🍲'},
{test:/샌드위치|햄버거|피자|토스트|핫도그|빵/,type:'bread',title:'빵·간편식',icon:'🥪'},
{test:/사과|바나나|귤|오렌지|포도|수박|배\b|딸기|파인애플|멜론|요거트|요구르트|우유/,type:'fruit',title:'과일·후식',icon:'🍎'}
];
function mealType(dishes){const entries=String(dishes||'').replace(/<br\s*\/?\s*>/gi,'\n').split('\n').map(v=>v.replace(/\([\d.,]+\)/g,'').trim()).filter(Boolean);const main=entries.filter(v=>!/밥$|김치|깍두기|우유|요구르트|배추김치|쌀밥|잡곡밥/.test(v));for(const dish of main){for(const t of mealTypes)if(t.test.test(dish))return t}return {type:'set',title:'한식 급식',icon:'🍱'}}


function mealParts(raw){
 const dishes=String(raw||'').replace(/<br\s*\/?\s*>/gi,'\n').split('\n').map(v=>v.replace(/\((?:\d+[.,]?)+\)/g,'').replace(/\(예\)/g,'').trim()).filter(Boolean);
 const rest=dishes.slice();const take=re=>{const i=rest.findIndex(v=>re.test(v));return i<0?'':rest.splice(i,1)[0]};
 let style='korean';
 if(dishes.some(v=>/국수|칼국수|우동|라면|쌀국수|스파게티|파스타|짜장면|짬뽕|냉면|쫄면/.test(v)))style='noodle';
 else if(dishes.some(v=>/샌드위치|햄버거|피자|핫도그|토스트|식빵|크로와상/.test(v)))style='snack';
 const main=style==='noodle'?take(/국수|칼국수|우동|라면|쌀국수|스파게티|파스타|짜장면|짬뽕|냉면|쫄면/):style==='snack'?take(/샌드위치|햄버거|피자|핫도그|토스트|식빵|크로와상/):'';
 const rice=take(/밥|볶음밥|덮밥|비빔밥|김밥|초밥|리조또/);
 const soup=take(/국|찌개|탕|전골|스프|수프|떡국/);
 const dessert=take(/우유|요구르트|요거트|과일|귤|사과|바나나|포도|딸기|수박|샤인머스캣|머스캣|마카롱|푸딩|주스|음료|파인애플|키위|배$/);
 return {style,main,rice,soup,dessert,sides:rest.slice(0,3)};
}
function mealTraySvg(p){
 const mealKind={korean:'한식형',noodle:'면식형',snack:'간편식형'}[p.style];
 const escSvg=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const food=(x,y,w,h,n)=>{
  if(!n)return '';
  const tone=/김치|깍두기|고추장|떡볶이/.test(n)?'#c5533e':/나물|무침|샐러드|오이|콩나물/.test(n)?'#639c55':/갈비|돼지|돈육|불고기|닭|고기|두부|만두|생선/.test(n)?'#a56c48':/우유/.test(n)?'#e8f5ff':/포도|머스캣|과일|사과|바나나|딸기|귤/.test(n)?'#a2bb60':'#d7ae66';
  if(/우유/.test(n))return '<path d="M '+(x+w*.37)+' '+(y+h*.25)+' l '+(w*.14)+' -5 l '+(w*.14)+' 5 l -3 '+(h*.51)+' h -'+(w*.22)+' Z" fill="#f8fdff" stroke="#b2cde5" stroke-width="1.5"/>';
  return '<ellipse cx="'+(x+w*.5)+'" cy="'+(y+h*.55)+'" rx="'+(w*.29)+'" ry="'+(h*.24)+'" fill="'+tone+'"/><ellipse cx="'+(x+w*.41)+'" cy="'+(y+h*.47)+'" rx="'+(w*.1)+'" ry="'+(h*.07)+'" fill="#fff" opacity=".32"/><path d="M '+(x+w*.32)+' '+(y+h*.56)+' q '+(w*.22)+' -'+(h*.29)+' '+(w*.43)+' 0" fill="none" stroke="#554b34" stroke-opacity=".12" stroke-width="2"/>';
 };
 const well=(x,y,w,h)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="15" fill="url(#well)" stroke="#a7b6c5" stroke-width="2.5"/>';
 const rice=p.rice?'<ellipse cx="112" cy="110" rx="55" ry="38" fill="url(#rice)"/><g fill="#e5e2d8"><ellipse cx="93" cy="100" rx="5" ry="2.5"/><ellipse cx="120" cy="92" rx="5" ry="2.5"/><ellipse cx="129" cy="123" rx="6" ry="2.6"/><ellipse cx="96" cy="125" rx="5" ry="2.5"/></g>':'';
