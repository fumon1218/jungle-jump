  c.toBlob(async blob => {
    if(!blob) return;
    const file = new File([blob], 'jungle-jump-record.png', {type:'image/png'});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'정글 점프 탐험대 기록'}); if(msg) msg.textContent = '기록 카드를 공유했어요.'; return; }
    }catch(e){}
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'jungle-jump-record.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    if(msg) msg.textContent = '기록 카드를 저장했어요.';
  }, 'image/png');
}
function wireCustom(){
  card.querySelectorAll('[data-img]').forEach(el => el.onclick = () => { pickSlot = el.dataset.img; pickImg.click(); });
  document.getElementById('audBtn').onclick = () => pickAud.click();
  card.querySelectorAll('[data-clr]').forEach(el => el.onclick = async () => {
    const k = el.dataset.clr;
    if(k === 'bgm') applyBgm(null); else applyImg(slotObj(k), null);
    try{ await idbSet(k, null); }catch(e){}
    setMsg('기본 상태로 되돌렸어요.'); refreshCustom();
  });
  document.getElementById('pvBtn').onclick = () => {
    if(previewing){ bgmStop(); }
    else if(bgmOk && bgm.src){ previewing = true; bgm.currentTime = 0; bgm.volume = SET.bgm; bgm.play().catch(() => { previewing = false; refreshCustom(); }); }
    refreshCustom();
  };
  document.getElementById('optBg').onchange = e => { autoBg = e.target.checked; };
  document.getElementById('optSize').oninput = e => {
    heroHeight = +e.target.value;
    try{ localStorage.setItem('jungle_hero_h', heroHeight); }catch(e){}
  };
  refreshCustom();
}
function wordHTML(){
  const orb = i => `<span class="orb${S.found[i] ? '' : ' empty'}" style="--h:${HUES[i]}">${WORD[i]}</span>`;
  const idx = [...Array(GOAL).keys()];
  return `<div class="word"><div class="line">${idx.slice(0,LINE1).map(orb).join('')}</div><div class="line">${idx.slice(LINE1).map(orb).join('')}</div></div>`;
}
function itemState(kind, k, it){
  if(equipped(kind) === k) return {label:'착용 중', eq:true};
  if(it.custom) return hero.ok ? {label:'착용하기', act:'equip'} : {label:'꾸미기에서 올리기'};
  if(owns(kind, k)) return {label:'착용하기', act:'equip'};
  if(it.clear) return totalClears() >= it.clear ? {label:'받기', act:'claim'} : {label:`완성 ${it.clear}번 보상`};
  return {label:`🪙 ${it.price}`, act: DEX.coins >= it.price ? 'buy' : null};
}
function wireWardrobe(){
  card.querySelectorAll('.item button[data-act]').forEach(b => b.onclick = () => {
    const kind = b.dataset.kind, k = b.dataset.k, act = b.dataset.act;
    const T = kind === 'skin' ? SKINS : kind === 'trail' ? TRAILS : PETS, it = T[k];
    if(act === 'buy'){ if(DEX.coins < it.price) return; DEX.coins -= it.price; DEX.owned[kind].push(k); seq([784,988,1319], 70, 'triangle', .06); }
    if(act === 'claim'){ DEX.owned[kind].push(k); seq([784,988,1319], 70, 'triangle', .06); }
    if(act) { DEX.equip[kind] = k; saveDex(); }
    const sc = card.scrollTop; showScreen('wardrobe'); card.scrollTop = sc;
  });
}
function hideScreen(){ overlay.classList.remove('show'); document.body.classList.remove('menuopen'); screen = ''; if(typeof doorBtnUpdate === 'function') doorBtnUpdate(); }
function startGame(opts = {}){
  if(overLimit()){ restFrom = null; showScreen('limit'); return; }
  if(isTouch && SET.autoFull !== false) goFull();
  bgmStop(); screen = '';
  stopRainSound();
  if(!DEX.tutorialDone && !opts.daily && !opts.duo && !opts.resume && !opts.testItem && !opts.startStage) opts.tutorial = true;   // 처음이면 연습부터
  if(!opts.resume) clearSave();
  newGame(opts); S.state = 'play'; hideScreen();
  S.banner = {text:opts.testItem ? '아이템 시험 중: ' + ((CUSTOM.find(c => c.id === opts.testItem) || {}).name || '') : S.tutorial ? '연습 구간' : opts.resume ? '이어서 탐험!' : opts.daily ? '오늘의 도전!' : ZONES[S.zoneIdx % ZONES.length].name, t:0};
  if(S.duo) S.toast = {text:`${S.duo.names[S.duo.idx]} 차례예요!`, t:0};
  else if(vit() > 0) S.toast = {text:`⚡ 활력 ${vit()}: 글라이딩 +${vit()*5}% · 점프 조금 더 높이`, t:0};
  if(!S.duo && !opts.resume && (DEX.bonusLives || 0) > 0){
    const n = DEX.bonusLives; S.lives = Math.min(MAX_LIVES, S.lives + n); S.bonusLifeRun = n;
    DEX.bonusLives = 0; saveDex();
    S.toast = {text:`❤️ 안전체험관 보너스! 이번 판만 생명 +${n}`, t:0};
  }
  jumpQueued = 0; Object.keys(keys).forEach(k => keys[k] = false); jumpPointers.clear();
  if(isTouch){ if(!DEX.ctlHintSeen || S.tutorial || ACCS.symbols || ACCS.oneHand){ showCtlHint(); DEX.ctlHintSeen = true; saveDex(); } if(joyId !== null) joyEnd(); }
  tone(1,0.01,'sine',0.0001); // 모바일 오디오 잠금 해제
  bgmPlay(true);
}
function togglePause(){
  if(S.state !== 'play' || screen === 'learn' || screen === 'bag') return;
  S.paused = !S.paused;
  S.paused ? (showScreen('pause'), bgmStop(), stopRainSound()) : (hideScreen(), bgmPlay(false), S.rain && startRainSound());
}
document.getElementById('btnPause').onclick = e => { e.currentTarget.blur(); if(S.state === 'lobby'){ showScreen('title'); return; } togglePause(); };
document.getElementById('btnBag').onclick = e => { e.currentTarget.blur(); if(screen === 'bag') closeBag(); else if(S.state === 'play') openBag(); else if(S.state === 'lobby') showScreen('bag'); };
const btnSound = document.getElementById('btnSound');
btnSound.onclick = e => {
  soundOn = !soundOn; btnSound.style.opacity = soundOn ? 1 : 0.4; e.currentTarget.blur();
  if(!soundOn) bgmStop(); else if(S.state === 'play' && !S.paused) bgmPlay(false);
};
addEventListener('pagehide', () => { if(S) saveProgress(); });
document.addEventListener('visibilitychange', () => { if(document.hidden && S) saveProgress(); if(document.hidden && S.state === 'play' && !S.paused) togglePause(); });

/* ================= 루프 ================= */
let last = performance.now();
let perfN = 0, perfSum = 0, errCount = 0, errShown = 0;
let spokenToast = null, spokenBanner = null, spokenTut = -1, spokenDoor = null;
function symbolsTick(){
  if(!ACCS.symbols || !S) return;
  const clean = t => String(t).replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F]/gu, '').trim();
  if(S.toast && S.toast !== spokenToast){ spokenToast = S.toast; say(clean(S.toast.text), 'ko-KR'); }
  else if(S.banner && S.banner !== spokenBanner){ spokenBanner = S.banner; say(clean(S.banner.text), 'ko-KR'); }
  if(S.tutorial && S.state === 'play' && S.tutStep !== spokenTut && S.tutStep < TUT_N){ spokenTut = S.tutStep; setTimeout(() => say(clean(tutSteps()[S.tutStep].text), 'ko-KR'), 600); }
  if(S.state === 'lobby'){ const d = S.lobby.near; if(d && d !== spokenDoor){ spokenDoor = d; say(d.name, 'ko-KR'); } if(!d) spokenDoor = null; }
}
function reportError(err){   // 오류가 나도 화면이 멈추지 않게: 기록하고, 위험하면 안전하게 되돌리기
  errCount++; console.error(err);
  if(Date.now() - errShown > 5000){ errShown = Date.now(); if(S) S.toast = {text:'잠깐 문제가 생겨서 바로잡았어요', t:0}; }
  try{ if(S && S.state === 'play' && S.player && !S.bonus && !S.boss){ const P = S.player; if(!Number.isFinite(P.x) || !Number.isFinite(P.y)) respawn(); } }catch(e){}
}
addEventListener('error', e => { try{ if(S) S.toast = {text:'잠깐 문제가 생겼어요. 계속 안 되면 새로고침해 주세요', t:0}; }catch(_){} });
function loop(now){
  const raw = now - last;
  try{ tickTime(Math.min(raw, 1000)/1000); symbolsTick(); }catch(e){}
  const dt = Math.min(50, raw); last = now;
  if(SET.perf === 'auto' && !LIGHT && S.state === 'play' && !S.paused && raw < 200){
    perfN++; perfSum += raw;
    if(perfN >= 180){
      if(perfSum/perfN > 26){ LIGHT = true; resize(); S.toast = {text:'화면이 버벅여서 가벼운 모드로 바꿨어요', t:0}; }
      perfN = 0; perfSum = 0;
    }
  }
  const k = dt / 16.667;
  try{
  if(S.state === 'play' && !S.paused) update(k);
  else if(S.state === 'ending') updateEnding(k);
  else if(S.state === 'over' || S.state === 'win') updateFx(k);
  else if(S.state === 'title') S.time += k;
  else if(S.state === 'lobby' && !screen) updateLobby(k);
  render();
  }catch(err){ reportError(err); }
  requestAnimationFrame(loop);
}
newGame(); showScreen(PROF.list.length > 1 ? 'profiles' : 'title'); loadSaved();
requestAnimationFrame(loop);
})();
