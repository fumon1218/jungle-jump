<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="정글 점프">
<meta name="theme-color" content="#07190f">
<title>정글 점프 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --leaf:#1f5e43; --deep:#07190f; --moss:#4f8a2e; --gold:#f2c14e; --fruit:#ff8c1a; --cream:#fff6dc;
    --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--deep);overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--font);color:var(--cream);
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
  #wrap{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
    width:min(100vw,177.78dvh);height:min(56.25vw,100dvh)}
  canvas{display:block;width:100%;height:100%;border-radius:10px;box-shadow:0 0 0 2px #2c5a3c, 0 20px 60px rgba(0,0,0,.6)}

  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(7,25,15,.55), rgba(7,25,15,.85));border-radius:10px}
  #overlay.show{display:flex}
  .card{width:min(90%,620px);max-height:100%;overflow:auto;text-align:center;padding:clamp(14px,3.5vw,32px)}
  .btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  button.go.alt{background:#5ea83a;color:#fff;box-shadow:0 5px 0 #2f6b1c}
  button.go.alt:active{box-shadow:0 1px 0 #2f6b1c}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.6vw,16px);margin:.8em 0}
  .slot{background:rgba(255,246,220,.08);border:2px solid rgba(255,246,220,.2);border-radius:14px;padding:clamp(8px,1.4vw,14px) 6px}
  .slot b{display:block;font-weight:400;font-size:clamp(13px,1.9vw,18px);margin:.3em 0 .1em}
  .slot small{display:block;opacity:.7;font-size:clamp(10px,1.4vw,13px);min-height:1.3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thumb{height:clamp(54px,9vw,96px);display:flex;align-items:flex-end;justify-content:center;
    background:linear-gradient(transparent 82%, #6b4424 82%, #5a3a1e);border-radius:8px}
  .thumb img{max-height:92%;max-width:90%;object-fit:contain}
  .thumb .note{font-size:clamp(30px,5vw,52px);align-self:center;color:var(--gold)}
  .thumb .none{align-self:center;opacity:.55;font-size:clamp(11px,1.6vw,14px)}
  .sbtn{font-family:var(--font);font-size:clamp(11px,1.6vw,15px);border:0;border-radius:999px;padding:.35em .8em;margin:.35em .15em 0;cursor:pointer;
    background:var(--gold);color:#4a2a10}
  .sbtn.ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(255,246,220,.45)}
  .opts{display:flex;flex-wrap:wrap;gap:.5em 1.4em;justify-content:center;align-items:center;font-size:clamp(12px,1.8vw,16px)}
  .opts input[type=range]{width:clamp(90px,16vw,160px);accent-color:#f2c14e;vertical-align:middle}
  .opts input[type=checkbox]{accent-color:#f2c14e;width:1.1em;height:1.1em;vertical-align:middle}
  #msg{min-height:1.4em;color:#b8ff7a}
  .word{margin:.6em 0 .3em;line-height:1}
  .word .line{display:flex;justify-content:center;gap:clamp(4px,1vw,10px);margin:clamp(6px,1.2vw,12px) 0}
  .orb{--h:260;display:inline-flex;align-items:center;justify-content:center;width:clamp(30px,5.6vw,54px);height:clamp(30px,5.6vw,54px);border-radius:50%;
    font-size:clamp(17px,3.2vw,31px);color:#fffbe8;text-shadow:0 0 3px rgba(0,0,0,.45),0 0 10px #fff3b0;
    background:radial-gradient(circle at 33% 28%, hsl(var(--h) 100% 90%) 0%, hsl(var(--h) 78% 54%) 32%, hsl(var(--h) 75% 19%) 100%);
    box-shadow:0 0 14px 4px hsl(var(--h) 100% 72% / .65), inset 0 0 0 2px hsl(var(--h) 100% 92% / .85);
    animation:orbGlow 2.4s ease-in-out infinite}
  .orb.empty{background:rgba(255,255,255,.05);color:rgba(255,246,220,.28);text-shadow:none;box-shadow:inset 0 0 0 2px rgba(255,246,220,.22);animation:none}
  @keyframes orbGlow{50%{box-shadow:0 0 24px 8px hsl(var(--h) 100% 75% / .95), inset 0 0 0 2px #fff}}
  @media (prefers-reduced-motion:reduce){.orb{animation:none}}
  @media (max-width:520px){.slots{grid-template-columns:1fr 1fr 1fr;gap:6px}}
  .card h1{margin:0 0 .2em;font-weight:400;font-size:clamp(28px,6vw,62px);line-height:1.05;color:var(--gold);
    text-shadow:0 3px 0 #6b3f1f, 0 6px 0 rgba(0,0,0,.35);letter-spacing:.02em}
  .card h2{margin:0 0 .3em;font-weight:400;font-size:clamp(24px,4.6vw,44px);color:var(--gold);text-shadow:0 3px 0 #6b3f1f}
  .card p{margin:.35em 0;font-size:clamp(13px,2vw,19px);line-height:1.5}
  .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em .9em;margin:.8em 0;font-size:clamp(12px,1.8vw,17px)}
  .legend span{white-space:nowrap}
  .bad{color:#b8ff7a}
  .pot{color:#cfe9ff}
  .keys{opacity:.85;font-size:clamp(11px,1.6vw,15px)!important}
  .big{font-size:clamp(20px,3.4vw,34px)!important;color:var(--gold)}
  button.go{margin-top:.9em;font-family:var(--font);font-size:clamp(18px,3vw,28px);padding:.45em 1.5em;border:0;border-radius:999px;
    background:var(--gold);color:#4a2a10;cursor:pointer;box-shadow:0 5px 0 #a8741c;transition:transform .08s}
  button.go:active{transform:translateY(4px);box-shadow:0 1px 0 #a8741c}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}

  #topBtns{position:absolute;top:2.2%;right:1.4%;display:flex;gap:8px}
  #topBtns button{width:clamp(32px,4.4vw,44px);height:clamp(32px,4.4vw,44px);border-radius:50%;border:2px solid rgba(255,255,255,.35);
    background:rgba(8,30,22,.55);color:#fff;font-family:var(--font);font-size:clamp(14px,2vw,20px);cursor:pointer}

  #tapzone{position:absolute;inset:0;display:none;overflow:hidden;border-radius:10px}
  #touch{position:absolute;inset:0;display:none;pointer-events:none}
  .touchmode #tapzone, .touchmode #touch{display:block}
  #pad{position:absolute;left:max(2.5%, env(safe-area-inset-left,0px));bottom:5%;display:flex;gap:clamp(10px,2vw,20px);pointer-events:auto;touch-action:none;padding:8px}
  .tb{width:clamp(60px,11.5vw,104px);height:clamp(60px,11.5vw,104px);border-radius:50%;pointer-events:none;
    background:rgba(255,246,220,.16);border:2px solid rgba(255,246,220,.45);color:#fff;font-size:clamp(22px,4.2vw,38px);
    display:flex;align-items:center;justify-content:center;font-family:var(--font);transition:background .08s, transform .08s}
  .tb.pressed{background:rgba(242,193,78,.55);transform:scale(.94)}
  #tapHint{position:absolute;right:6%;bottom:12%;text-align:center;font-size:clamp(12px,2vw,18px);line-height:1.4;opacity:0;transition:opacity .5s;pointer-events:none}
  #tapHint.show{opacity:.9}
  #tapHint i{display:block;margin:0 auto .4em;width:clamp(44px,8vw,70px);height:clamp(44px,8vw,70px);border-radius:50%;
    border:2px solid rgba(255,246,220,.7);animation:tapPulse 1.2s ease-out infinite}
  @keyframes tapPulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.25);opacity:0}}
  .ripple{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:2px solid rgba(255,246,220,.8);
    pointer-events:none;animation:ripple .4s ease-out forwards}
  @keyframes ripple{from{transform:scale(.3);opacity:1}to{transform:scale(1.3);opacity:0}}
  #btnFull{display:none}
  #rotate{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;opacity:.7;display:none}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:block}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="정글 점프 탐험대 게임 화면"></canvas>
  <div id="tapzone" aria-hidden="true"></div>
  <div id="topBtns">
    <button id="btnPause" aria-label="일시정지">Ⅱ</button>
    <button id="btnSound" aria-label="소리 켜기/끄기">♪</button>
    <button id="btnFull" aria-label="전체 화면">⛶</button>
  </div>
  <div id="touch">
    <div id="pad" aria-label="이동 버튼"><div class="tb" id="tL">◀</div><div class="tb" id="tR">▶</div></div>
    <div id="tapHint"><i></i>화면을 탭하면 점프<br>두 번 탭하면 2단 점프</div>
  </div>
  <div id="overlay" class="show"><div class="card" id="card"></div></div>
</div>
<div id="rotate">화면을 가로로 돌리면 더 크게 즐길 수 있어요</div>

<script>
(() => {
'use strict';
/* ================= 기본 설정 ================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 540;
const FONT = '"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const WORD = ['강','원','특','수','교','육','원','강','릉','분','원']; // 완성할 글자 (앞 7글자 / 뒤 4글자)
const LINE1 = 7;                                   // 첫 줄(강원특수교육원) 글자 수
const GOAL = WORD.length;
const HUES = [350, 22, 46, 95, 150, 178, 200, 228, 262, 292, 320];   // 글자 구슬 색 (칸마다 다른 색)
const POTION_TIME = 600;       // 물약 효과 시간 (60프레임 = 1초 → 600 = 10초)
const LETTER_CHANCE = 0.6;     // 보물상자에서 글자가 나올 확률 (나머지는 물약)
const POTIONS = {
  float: {name:'둥실둥실 체공 물약', short:'체공', color:'#6fd3ff', good:true},
  glow:  {name:'반짝반짝 빛 물약',   short:'빛',   color:'#ffe45c', good:true},
  slow:  {name:'느릿느릿 느림보 물약', short:'느림', color:'#8fae3a', good:false},
  fairy: {name:'요정 물약',          short:'요정', color:'#ff8fd8', good:true}
};
const MAX_LIVES = 5;
const GRAV = 0.55, ACC = 0.7, MAXV = 5.2, FRIC = 0.82, JUMP = -11.2, JUMP2 = -9.6;
const WATER_Y = 495;

/* ================= 나만의 캐릭터 · 배경음악 =================
   1) 게임 안 [꾸미기] 화면에서 파일을 불러오면 이 기기 브라우저에 저장되어 계속 적용됩니다.
   2) 모든 방문자에게 보이게 하려면 index.html과 같은 폴더에 아래 이름으로 파일을 올리세요.
   (게임 안에서 불러온 파일이 있으면 그것이 우선입니다.) */
const HERO_IMG      = 'player.png';       // 주인공 이미지
const HERO_JUMP_IMG = 'player-jump.png';  // (선택) 점프할 때 이미지
const BGM_SRC       = 'bgm.mp3';          // 배경음악
const BGM_VOLUME    = 0.45;               // 배경음악 크기 0 ~ 1
let heroHeight = 58;                      // 캐릭터 키(픽셀) — 꾸미기 화면에서 조절 가능

function newSlot(def){ return {img:new Image(), ok:false, def, custom:null, url:null}; }
const hero = newSlot(HERO_IMG), heroJump = newSlot(HERO_JUMP_IMG);
function setImg(a, src){
  const img = new Image(); a.ok = false; a.img = img;
  img.onload = () => { if(a.img === img){ a.ok = true; refreshCustom(); } };
  img.onerror = () => { if(a.img === img) a.ok = false; };
  img.src = src;
}
const bgm = new Audio();
bgm.loop = true; bgm.volume = BGM_VOLUME; bgm.preload = 'auto';
let bgmOk = true, bgmCustom = null, bgmUrl = null;
bgm.addEventListener('error', () => { bgmOk = false; refreshCustom(); });
function setBgm(src){ bgmOk = true; bgm.src = src; bgm.load(); }
function bgmPlay(restart){
  if(!bgmOk || !soundOn || !bgm.src) return;
  if(restart) bgm.currentTime = 0;
  bgm.volume = BGM_VOLUME;
  bgm.play().catch(() => {});
}
function bgmStop(){ bgm.pause(); previewing = false; }
let previewing = false;

/* ---- 브라우저 저장소(IndexedDB) ---- */
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('jungle-jump', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('assets');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k){
  const db = await idbOpen();
  return new Promise((res, rej) => { const q = db.transaction('assets').objectStore('assets').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbSet(k, v){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction('assets', 'readwrite'), st = t.objectStore('assets');
    v == null ? st.delete(k) : st.put(v, k);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
function applyImg(a, rec){
  if(a.url) URL.revokeObjectURL(a.url);
  a.custom = rec || null; a.url = rec ? URL.createObjectURL(rec.blob) : null;
  setImg(a, a.url || a.def);
}
function applyBgm(rec){
  bgmStop();
  if(bgmUrl) URL.revokeObjectURL(bgmUrl);
  bgmCustom = rec || null; bgmUrl = rec ? URL.createObjectURL(rec.blob) : null;
  setBgm(bgmUrl || BGM_SRC);
}
async function loadSaved(){
  const get = async k => { try{ return await idbGet(k); }catch(e){ return null; } };
  applyImg(hero, await get('hero'));
  applyImg(heroJump, await get('heroJump'));
  applyBgm(await get('bgm'));
  try{ const h = +localStorage.getItem('jungle_hero_h'); if(h) heroHeight = h; }catch(e){}
  refreshCustom();
}

/* ---- 이미지 정리: 배경 지우기 + 여백 자르기 ---- */
async function cleanImage(file, removeBg){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  URL.revokeObjectURL(url);
  const sc = Math.min(1, 512 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth*sc)), h = Math.max(1, Math.round(img.naturalHeight*sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h), px = d.data;
  if(removeBg){
    const corners = [0, w-1, (h-1)*w, (h-1)*w + w-1].filter(i => px[i*4+3] > 200);
    if(corners.length >= 3){ // 모서리가 불투명하면 = 배경이 있는 그림
      const o0 = corners[0]*4, br = px[o0], bgc = px[o0+1], bb = px[o0+2], TOL = 60*60;
      const seen = new Uint8Array(w*h), stack = [];
      for(let i=0;i<w;i++){ stack.push(i, (h-1)*w + i); }
      for(let j=0;j<h;j++){ stack.push(j*w, j*w + w-1); }
      while(stack.length){
        const i = stack.pop(); if(seen[i]) continue; seen[i] = 1;
        const o = i*4, dr = px[o]-br, dg = px[o+1]-bgc, db = px[o+2]-bb;
        if(px[o+3] < 20 || dr*dr + dg*dg + db*db < TOL){
          px[o+3] = 0;
          const xx = i % w, yy = (i / w) | 0;
          if(xx > 0) stack.push(i-1); if(xx < w-1) stack.push(i+1);
          if(yy > 0) stack.push(i-w); if(yy < h-1) stack.push(i+w);
        }
      }
      x.putImageData(d, 0, 0);
    }
  }
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for(let yy=0; yy<h; yy++) for(let xx=0; xx<w; xx++){
    if(px[(yy*w + xx)*4 + 3] > 12){ if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(yy<minY)minY=yy; if(yy>maxY)maxY=yy; }
  }
  let out = c;
  if(maxX >= 0){
    const bw = maxX-minX+1, bh = maxY-minY+1;
    out = document.createElement('canvas'); out.width = bw; out.height = bh;
    out.getContext('2d').drawImage(c, minX, minY, bw, bh, 0, 0, bw, bh);
  }
  return new Promise(res => out.toBlob(b => res(b || file), 'image/png'));
}

/* ---- 파일 선택 ---- */
const pickImg = Object.assign(document.createElement('input'), {type:'file', accept:'image/*'});
const pickAud = Object.assign(document.createElement('input'), {type:'file', accept:'audio/*,.mp3,.m4a,.wav,.ogg'});
let pickSlot = 'hero', autoBg = true;
pickImg.onchange = async () => {
  const f = pickImg.files[0]; pickImg.value = ''; if(!f) return;
  setMsg('이미지를 정리하는 중…');
  try{
    const blob = await cleanImage(f, autoBg);
    const rec = {blob, name:f.name};
    applyImg(pickSlot === 'hero' ? hero : heroJump, rec);
    try{ await idbSet(pickSlot, rec); setMsg('불러왔어요! 이 기기에 저장됐어요.'); }
    catch(e){ setMsg('불러왔어요. (저장은 안 돼서 새로고침하면 사라져요)'); }
  }catch(e){ setMsg('이 이미지는 열 수 없어요. PNG나 JPG로 다시 시도해 주세요.'); }
};
pickAud.onchange = async () => {
  const f = pickAud.files[0]; pickAud.value = ''; if(!f) return;
  const rec = {blob:f, name:f.name};
  applyBgm(rec);
  try{ await idbSet('bgm', rec); setMsg('음악을 불러왔어요! 이 기기에 저장됐어요.'); }
  catch(e){ setMsg('음악을 불러왔어요. (저장은 안 돼서 새로고침하면 사라져요)'); }
  refreshCustom();
};
function setMsg(t){ const m = document.getElementById('msg'); if(m) m.textContent = t; }
let screen = '';
function refreshCustom(){
  if(screen !== 'custom') return;
  const th = (a, id, nameId, emptyText) => {
    const el = document.getElementById(id), nm = document.getElementById(nameId); if(!el) return;
    el.innerHTML = a.ok ? '' : `<span class="none">${emptyText}</span>`;
    if(a.ok){ const i = document.createElement('img'); i.src = a.img.src; i.alt = ''; el.appendChild(i); }
    nm.textContent = a.custom ? a.custom.name : (a.ok ? '저장소 파일' : '');
  };
  th(hero, 'thHero', 'nmHero', '기본 탐험가');
  th(heroJump, 'thJump', 'nmJump', '없음 (선택)');
  const nb = document.getElementById('nmBgm');
  if(nb) nb.textContent = bgmCustom ? bgmCustom.name : (bgmOk ? '저장소 bgm.mp3' : '없음');
  const pv = document.getElementById('pvBtn'); if(pv){ pv.textContent = previewing ? '멈춤' : '들어보기'; pv.disabled = !bgmOk; }
}


function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize(); addEventListener('resize', resize);

const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const ease = t => t<0?0:t>1?1:t*t*(3-2*t);
const hash = n => { const s = Math.sin(n*127.1 + 311.7)*43758.5453; return s - Math.floor(s); };

function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function heartPath(x,y,s){ // x=중앙, y=위쪽, s=크기
  ctx.beginPath(); ctx.moveTo(x, y+s*0.3);
  ctx.bezierCurveTo(x, y, x-s*0.5, y, x-s*0.5, y+s*0.3);
  ctx.bezierCurveTo(x-s*0.5, y+s*0.6, x, y+s*0.8, x, y+s);
  ctx.bezierCurveTo(x, y+s*0.8, x+s*0.5, y+s*0.6, x+s*0.5, y+s*0.3);
  ctx.bezierCurveTo(x+s*0.5, y, x, y, x, y+s*0.3); ctx.closePath();
}

/* ================= 사운드 ================= */
let AC = null, soundOn = true;
function tone(f, d, type='square', v=0.07, f2){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
const seq = (notes, gap, type='triangle', v=0.07) => notes.forEach((f,i)=>setTimeout(()=>tone(f,0.18,type,v), i*gap));
const sfx = {
  jump:  () => tone(420,.14,'square',.04,760),
  jump2: () => tone(620,.14,'square',.04,1150),
  fruit: () => seq([880,1320],60),
  hurt:  () => tone(320,.35,'sawtooth',.07,70),
  splash:() => tone(240,.3,'sine',.09,60),
  chest: () => seq([523,659,784,1047],90),
  heart: () => seq([660,880,990],70),
  win:   () => seq([523,659,784,1047,784,1047,1319],120),
  lose:  () => seq([392,330,262,196],160,'sine',.08)
};

/* ================= 입력 ================= */
const keys = {left:false, right:false, jump:false};
let jumpQueued = 0;
const KEYMAP = {ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump'};
addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  if(tag === 'INPUT') return;
  if(tag === 'BUTTON' && (e.code === 'Enter' || e.code === 'Space') && S.state !== 'play') return;
  const k = KEYMAP[e.code];
  if(k){ e.preventDefault(); if(k==='jump' && !e.repeat) jumpQueued = Math.min(2, jumpQueued + 1); keys[k] = true; }
  if((e.code==='KeyP' || e.code==='Escape') && S.state==='play') togglePause();
  if(e.code==='Enter' && screen !== 'custom' && (S.state==='title' || S.state==='over' || S.state==='win')) startGame();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if(k) keys[k] = false; });

/* ---- 모바일 터치 조작 ---- */
const wrapEl = document.getElementById('wrap');
let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
function enableTouch(){ isTouch = true; wrapEl.classList.add('touchmode'); }
if(isTouch) enableTouch();
addEventListener('pointerdown', e => { if(e.pointerType === 'touch' && !isTouch){ enableTouch(); if(screen === 'title') showScreen('title'); } }, true);

// 이동 패드: 손가락을 떼지 않고 ◀ ▶ 사이를 미끄러져도 방향이 바뀜
const pad = document.getElementById('pad'), tL = document.getElementById('tL'), tR = document.getElementById('tR');
let padId = null;
function padSet(e){
  const r = pad.getBoundingClientRect(), right = e.clientX > r.left + r.width/2;
  keys.left = !right; keys.right = right;
  tL.classList.toggle('pressed', !right); tR.classList.toggle('pressed', right);
}
function padClear(){ padId = null; keys.left = keys.right = false; tL.classList.remove('pressed'); tR.classList.remove('pressed'); }
pad.addEventListener('pointerdown', e => { e.preventDefault(); padId = e.pointerId; try{ pad.setPointerCapture(e.pointerId); }catch(_){} padSet(e); });
pad.addEventListener('pointermove', e => { if(e.pointerId === padId) padSet(e); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev => pad.addEventListener(ev, e => { if(e.pointerId === padId) padClear(); }));

// 화면 탭 = 점프 (두 번 탭 = 2단 점프, 길게 누르면 더 높이)
const tapzone = document.getElementById('tapzone'), jumpPointers = new Set();
let tapCount = 0;
tapzone.addEventListener('pointerdown', e => {
  e.preventDefault();
  if(S.state !== 'play' || S.paused) return;
  jumpPointers.add(e.pointerId); keys.jump = true;
  jumpQueued = Math.min(2, jumpQueued + 1);
  const r = tapzone.getBoundingClientRect(), d = document.createElement('div');
  d.className = 'ripple'; d.style.left = (e.clientX - r.left) + 'px'; d.style.top = (e.clientY - r.top) + 'px';
  tapzone.appendChild(d); setTimeout(() => d.remove(), 420);
  if(++tapCount >= 3) hideTapHint();
});
['pointerup','pointercancel','pointerleave'].forEach(ev => tapzone.addEventListener(ev, e => {
  jumpPointers.delete(e.pointerId); if(!jumpPointers.size) keys.jump = false;
}));
tapzone.addEventListener('contextmenu', e => e.preventDefault());

const tapHint = document.getElementById('tapHint');
let hintTimer = 0;
function showTapHint(){ tapCount = 0; tapHint.classList.add('show'); clearTimeout(hintTimer); hintTimer = setTimeout(hideTapHint, 6000); }
function hideTapHint(){ tapHint.classList.remove('show'); }

/* ================= 게임 상태 ================= */
let S;
function newGame(){
  S = {
    state:'title', paused:false, time:0, camX:0, shake:0,
    player:{x:120, y:300, w:30, h:44, vx:0, vy:0, onGround:false, jumps:0, face:1, inv:0, anim:0, plat:null, splashed:false},
    plats:[], fruits:[], spiders:[], chests:[], hearts:[], animals:[], particles:[], texts:[],
    score:0, fruitCount:0, treasures:0, lives:3, dist:0,
    genX:0, lastY:400, nextChestX:900, chestsMade:0, potionStreak:0, fx:{}, fairy:null, lastSafe:null,
    order:shuffle([...Array(GOAL).keys()]), found:Array(GOAL).fill(false), orbs:[], slotFlash:Array(GOAL).fill(0), endT:0
  };
  const first = {x:30, y:400, baseY:400, w:430, amp:0, phase:0, dy:0, seed:0.3};
  S.plats.push(first); S.lastSafe = first;
  S.genX = first.x + first.w; S.lastY = first.y;
  S.player.y = first.y - S.player.h;
  S.animals.push({kind:'monkey', plat:first, ox:330, t:0, flip:-1});
  while(S.genX < W + 400) genPlatform();
}

const FRUIT = {banana:{pts:10,r:13}, cherry:{pts:15,r:13}, mango:{pts:20,r:13}, dragon:{pts:40,r:14}, poison:{pts:0,r:13}};
function randomFruit(){ const r = Math.random(); return r<.4?'banana': r<.68?'cherry': r<.92?'mango':'dragon'; }

function genPlatform(){
  const d = S.genX/1000;
  const prevEnd = S.genX, prevY = S.lastY;
  const gap = rand(55,105) + Math.min(d*7, 65);
  const w = Math.max(90, rand(120,250) - Math.min(d*5, 60));
  const y = clamp(prevY + rand(-105,95), 190, 440);
  const x = prevEnd + gap;
  const p = {x, y, baseY:y, w, amp:0, phase:rand(0,6.28), dy:0, seed:Math.random()};
  if(x > 2500 && Math.random() < Math.min(0.12 + d*0.015, 0.35)) p.amp = rand(22,50);
  S.plats.push(p);
  // 가지 사이 허공에 열매 아치
  if(gap > 90 && Math.random() < 0.55){
    for(let k=1;k<=3;k++){
      const t = k/4;
      S.fruits.push({x:prevEnd+gap*t, y:Math.min(prevY,y)-55-Math.sin(Math.PI*t)*45, ox:k*7, type:randomFruit()});
    }
  }
  S.genX = x + w; S.lastY = y;
  populate(p);
}

function populate(p){
  const d = p.x/1000;
  if(S.order.length > 0 && p.x > S.nextChestX && p.w >= 120){
    S.chestsMade++;
    S.chests.push({plat:p, ox:p.w/2-18, got:false});
    S.nextChestX = p.x + rand(800,1150);
    return;
  }
  const n = Math.floor(rand(0,3.6));
  for(let i=0;i<n;i++) S.fruits.push({plat:p, ox:rand(18,p.w-18), oy:-rand(30,85), type:randomFruit()});
  if(p.x > 700 && p.w > 110 && Math.random() < Math.min(0.14 + d*0.025, 0.4))
    S.fruits.push({plat:p, ox:rand(p.w*0.35,p.w*0.8), oy:-16, type:'poison'});
  if(p.x > 1000 && Math.random() < Math.min(0.14 + d*0.025, 0.42))
    S.spiders.push({x:p.x+rand(-30,p.w), base:p.baseY-rand(75,105), amp:rand(28,48),
      spd:rand(0.025,0.045)+Math.min(d*0.002,0.02), ph:rand(0,6.28), y:0});
  if(p.x > 1500 && Math.random() < 0.035) S.hearts.push({plat:p, ox:rand(20,p.w-20), oy:-70});
  if(Math.random() < 0.2) S.animals.push({kind:pick(['monkey','toucan','frog']), plat:p, ox:rand(16,p.w-16), t:rand(0,200), flip:Math.random()<.5?-1:1});
}

function pos(o){ return o.plat ? [o.plat.x+o.ox, o.plat.y+(o.oy||0)] : [o.x, o.y]; }
function hitCircle(cx, cy, r, shrink){
  const P = S.player;
  const nx = clamp(cx, P.x+shrink, P.x+P.w-shrink), ny = clamp(cy, P.y+shrink, P.y+P.h-shrink*0.5);
  return (cx-nx)**2 + (cy-ny)**2 < r*r;
}

/* ================= 효과 ================= */
function burst(x, y, color, n=12, spd=4){
  for(let i=0;i<n;i++){
    const a = rand(0,6.28), s = rand(1,spd);
    S.particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-1.5, life:rand(25,45), max:45, color, size:rand(2,5)});
  }
}
function floatText(x, y, txt, color='#fff6dc'){ S.texts.push({x, y, txt, color, life:55}); }

/* ================= 진행 ================= */
function hurt(){
  const P = S.player;
  if(P.inv > 0 || S.state !== 'play') return false;
  S.lives--; P.inv = 120; S.shake = 12; P.vy = -7; sfx.hurt();
  floatText(P.x+P.w/2, P.y-10, '아야!', '#ff8a80');
  if(S.lives <= 0) endGame(false);
  return true;
}
function respawn(){
  const P = S.player, p = S.lastSafe;
  P.x = p.x + Math.min(30, p.w/2 - P.w/2); P.y = p.y - P.h - 2;
  P.vx = 0; P.vy = 0; P.inv = 120; P.plat = p; P.splashed = false;
  S.camX = Math.max(0, P.x - 320);
}
function endGame(won){
  S.state = won ? 'win' : 'over';
  const total = S.score + S.dist;
  let best = 0;
  try{ best = +localStorage.getItem('jungle_best') || 0; if(total > best){ best = total; localStorage.setItem('jungle_best', best); } }catch(e){ best = total; }
  S.best = best;
  bgmStop();
  if(won) showScreen('win');
  else { sfx.lose(); setTimeout(() => showScreen('over'), 700); }
}
function startEnding(){
  S.state = 'ending'; S.endT = 0; bgmStop(); sfx.win();
  Object.keys(keys).forEach(k => keys[k] = false);
}
function updateEnding(k){
  S.time += k; S.endT += k; updateFx(k);
  if(S.endT > 330 && S.state === 'ending') endGame(true);
}

function drinkPotion(type){
  const was = S.fx[type] > 0;
  S.fx[type] = POTION_TIME;
  if(POTIONS[type].good){ seq([392,523,659,784], 70, 'sine', .06); }
  else { tone(520, .5, 'triangle', .07, 140); }
  if(type === 'fairy' && !was){ const P = S.player; S.fairy = {x:P.x - 20, y:P.y - 30, t:0}; }
}
function updatePotions(k){
  const P = S.player;
  for(const key of Object.keys(S.fx)){
    S.fx[key] -= k;
    if(S.fx[key] <= 0){
      delete S.fx[key];
      floatText(P.x + P.w/2, P.y - 16, `${POTIONS[key].short} 효과 끝`, '#dfe8e0');
      if(key === 'fairy'){ burst(S.fairy.x, S.fairy.y, '#fff3b0', 16, 3); S.fairy = null; }
    }
  }
  if(S.fairy){
    const f = S.fairy; f.t += k;
    const tx = P.x + P.w/2 - P.face*34 + Math.cos(f.t*0.045)*14, ty = P.y - 14 + Math.sin(f.t*0.07)*12;
    f.x += (tx - f.x) * Math.min(1, 0.08*k); f.y += (ty - f.y) * Math.min(1, 0.08*k);
    if(Math.random() < 0.35*k) S.particles.push({x:f.x + rand(-4,4), y:f.y + rand(0,6), vx:rand(-0.4,0.4), vy:rand(0.2,0.9), life:rand(20,34), max:34, color:pick(['#fff3b0','#ffe45c','#ffffff','#ffd1f0']), size:rand(1,2.4)});
  }
  if(S.fx.glow > 0 && Math.random() < 0.25*k)
    S.particles.push({x:P.x + rand(0,P.w), y:P.y + rand(0,P.h), vx:rand(-0.6,0.6), vy:rand(-1.4,-0.4), life:rand(20,35), max:35, color:'#fff6b0', size:rand(1.2,2.6)});
  if(S.fx.slow > 0 && Math.random() < 0.12*k)
    S.particles.push({x:P.x + rand(0,P.w), y:P.y + rand(10,P.h), vx:rand(-0.2,0.2), vy:rand(-0.8,-0.3), life:rand(30,50), max:50, color:'rgba(160,190,80,.8)', size:rand(2,4)});
}

function update(k){
  const P = S.player;
  S.time += k;

  // 좌우 이동
  let ax = 0; if(keys.left) ax -= 1; if(keys.right) ax += 1;
  const slow = S.fx.slow > 0, maxv = slow ? MAXV*0.5 : MAXV;
  if(ax){ P.vx += ax*ACC*(slow ? 0.55 : 1)*k; P.face = ax; } else P.vx *= Math.pow(FRIC, k);
  P.vx = clamp(P.vx, -maxv, maxv);

  // 점프 (공중 2단 점프)
  if(jumpQueued){
    if(P.onGround){ P.vy = JUMP; P.jumps = 1; P.onGround = false; sfx.jump(); }
    else if(P.jumps < 2){ P.vy = JUMP2; P.jumps = 2; sfx.jump2(); burst(P.x+P.w/2, P.y+P.h, '#e8f5c8', 8, 2); }
    jumpQueued--;
  }
  if(!keys.jump && P.vy < -3) P.vy += 0.45*k; // 짧게 누르면 낮은 점프

  // 움직이는 가지
  for(const p of S.plats){
    if(p.amp){ const ny = p.baseY + Math.sin(S.time*0.03 + p.phase)*p.amp; p.dy = ny - p.y; p.y = ny; }
    else p.dy = 0;
  }
  if(P.onGround && P.plat) P.y += P.plat.dy;

  if(S.fx.float > 0) P.vy = Math.min(P.vy + (P.vy < 0 ? 0.36 : 0.18)*k, 3.4);  // 체공 물약: 천천히 떨어짐
  else P.vy = Math.min(P.vy + GRAV*k, 14);
  const prevBottom = P.y + P.h;
  P.x += P.vx*k; P.y += P.vy*k;
  if(P.x < S.camX + 10){ P.x = S.camX + 10; if(P.vx < 0) P.vx = 0; }

  // 가지 위 착지 (위에서만 통과 불가)
  P.onGround = false;
  if(P.vy >= 0){
    for(const p of S.plats){
      if(P.x+P.w-6 > p.x && P.x+6 < p.x+p.w && prevBottom <= p.y+8 && P.y+P.h >= p.y){
        P.y = p.y - P.h; P.vy = 0; P.onGround = true; P.jumps = 0; P.plat = p; S.lastSafe = p; break;
      }
    }
  }
  if(P.onGround && Math.abs(P.vx) > 0.4) P.anim += Math.abs(P.vx)*0.07*k;

  // 카메라
  const target = P.x - 320;
  if(target > S.camX) S.camX += (target - S.camX)*Math.min(1, 0.12*k);
  while(S.genX < S.camX + W + 300) genPlatform();
  S.dist = Math.max(S.dist, Math.floor((P.x - 120)/10));

  // 물에 빠짐
  if(P.y + P.h > WATER_Y + 8 && !P.splashed){
    P.splashed = true; sfx.splash();
    for(let i=0;i<18;i++) S.particles.push({x:P.x+P.w/2, y:WATER_Y, vx:rand(-3,3), vy:rand(-7,-2), life:rand(25,40), max:40, color:'#bfeee0', size:rand(2,4)});
  }
  if(P.y > H + 60){
    S.lives--; S.shake = 10;
    if(S.lives <= 0){ P.y = H + 60; endGame(false); }
    else { floatText(S.lastSafe.x+40, S.lastSafe.y-70, '풍덩!', '#bfeee0'); respawn(); }
  }

  // 열매
  for(const f of S.fruits){
    if(f.got) continue;
    const [fx, fy] = pos(f);
    if(f.type === 'poison'){
      if(hitCircle(fx, fy, FRUIT.poison.r, 7) && hurt()){
        f.got = true; burst(fx, fy, '#7dff4a', 16); floatText(fx, fy-20, '독열매!', '#b8ff7a');
      }
    } else if(hitCircle(fx, fy, FRUIT[f.type].r, 2)){
      f.got = true; S.score += FRUIT[f.type].pts; S.fruitCount++; sfx.fruit();
      const col = {banana:'#f7d23c', cherry:'#ff4d5e', mango:'#ffa53a', dragon:'#ff4f9a'}[f.type];
      burst(fx, fy, col, 10); floatText(fx, fy-18, '+' + FRUIT[f.type].pts, col);
    }
  }
  // 독거미
  for(const sp of S.spiders){
    sp.y = sp.base + Math.sin(S.time*sp.spd + sp.ph)*sp.amp;
    if(hitCircle(sp.x, sp.y, 15, 7) && hurt()){ burst(sp.x, sp.y, '#c04bff', 14); floatText(sp.x, sp.y-24, '독거미!', '#e3a3ff'); }
  }
  // 보물상자
  for(const c of S.chests){
    if(c.got) continue;
    const cx = c.plat.x + c.ox, cy = c.plat.y - 28;
    if(P.x < cx+36 && P.x+P.w > cx && P.y < cy+28 && P.y+P.h > cy){
      c.got = true; c.openAt = S.time; S.treasures++; S.score += 100; sfx.chest(); S.shake = 5;
      const letter = S.order.length && (Math.random() < LETTER_CHANCE || S.potionStreak >= 2);
      if(letter){
        S.potionStreak = 0;
        const slot = S.order.pop(), ch = WORD[slot];
        burst(cx+18, cy+10, '#f2c14e', 26, 6); burst(cx+18, cy, `hsl(${HUES[slot]},100%,75%)`, 18, 5);
        S.orbs.push({slot, ch, wx:cx+18, wy:cy-6, t:0, fx:0, fy:0});
        floatText(cx+18, cy-70, `'${ch}' 글자 발견!`, `hsl(${HUES[slot]},100%,82%)`);
      } else {
        S.potionStreak++;
        const type = pick(Object.keys(POTIONS)), pt = POTIONS[type];
        c.potion = type;
        burst(cx+18, cy, pt.color, 22, 5);
        drinkPotion(type);
        floatText(cx+18, cy-70, `${pt.name}!`, pt.color);
      }
    }
  }
  // 글자 구슬 날아가기
  for(const o of S.orbs){
    o.t += k;
    if(o.t >= 50 && !o.fx){ o.fx = o.wx - S.camX; o.fy = o.wy - 80; }
    if(o.t >= 100 && !o.done){
      o.done = true; S.found[o.slot] = true; S.slotFlash[o.slot] = 50;
      seq([1047,1319,1568], 80, 'sine', .06);
      if(S.found.every(Boolean)) startEnding();
    }
  }
  S.orbs = S.orbs.filter(o => !o.done);
  // 생명 하트
  for(const h of S.hearts){
    if(h.got) continue;
    const [hx, hy] = pos(h);
    if(hitCircle(hx, hy+10, 13, 2)){
      h.got = true; sfx.heart(); burst(hx, hy+10, '#ff6b81', 14);
      if(S.lives < MAX_LIVES){ S.lives++; floatText(hx, hy-10, '생명 +1', '#ff8fa3'); }
      else { S.score += 50; floatText(hx, hy-10, '+50', '#ff8fa3'); }
    }
  }

  // 동물들
  if(Math.random() < 0.006*k){
    if(Math.random() < 0.55) S.animals.push({kind:'parrot', x:S.camX+W+40, y:rand(60,220), base:0, spd:rand(1.6,2.8), t:0, color:pick(['#e53935','#1e88e5','#43a047'])});
    else S.animals.push({kind:'butterfly', x:S.camX+rand(150,W), y:rand(120,380), t:rand(0,100), life:0, color:pick(['#ffb300','#42a5f5','#ec407a','#ab47bc'])});
  }
  if(Math.random() < 0.0015*k) S.animals.push({kind:'croc', x:S.camX+W+60, t:0});
  for(const a of S.animals){
    a.t += k;
    if(a.kind === 'parrot'){ a.x -= a.spd*k; if(!a.base) a.base = a.y; a.y = a.base + Math.sin(a.t*0.05)*18; }
    else if(a.kind === 'butterfly'){ a.x += (Math.sin(a.t*0.02)*0.9 - 0.2)*k; a.y += Math.cos(a.t*0.027)*0.7*k; a.life += k; }
    else if(a.kind === 'croc'){ a.x -= 0.5*k; }
  }

  // 효과
  updateFx(k);
  if(P.inv > 0) P.inv -= k;
  updatePotions(k);

  // 화면 밖 정리
  const cut = S.camX - 500;
  S.plats = S.plats.filter(p => p.x + p.w > cut);
  S.fruits = S.fruits.filter(f => !f.got && pos(f)[0] > cut);
  S.spiders = S.spiders.filter(s => s.x > cut);
  S.chests = S.chests.filter(c => c.plat.x + c.plat.w > cut);
  S.hearts = S.hearts.filter(h => !h.got && pos(h)[0] > cut);
  S.animals = S.animals.filter(a => pos(a)[0] > S.camX - 200 && !(a.kind==='butterfly' && a.life > 900));
}

function updateFx(k){
  for(const p of S.particles){ p.x += p.vx*k; p.y += p.vy*k; p.vy += 0.18*k; p.life -= k; }
  S.particles = S.particles.filter(p => p.life > 0);
  for(const t of S.texts){ t.y -= 0.8*k; t.life -= k; }
  S.texts = S.texts.filter(t => t.life > 0);
  S.shake = Math.max(0, S.shake - 0.6*k);
  for(let i=0;i<GOAL;i++) if(S.slotFlash[i] > 0) S.slotFlash[i] -= k;
}

function layer(par, tile, fn){
  const off = S.camX*par, s = Math.floor(off/tile) - 1, e = s + Math.ceil(W/tile) + 3;
  for(let i=s;i<e;i++) fn(i, i*tile - off);
}

  });

  });
  ctx.fillStyle = '#174a34';
  layer(0.5, 60, (i,x) => { const h = hash(i+99); ctx.beginPath(); ctx.arc(x+30, -10+h*20, 38+h*20, 0, 6.29); ctx.fill(); });

  layer(0.6, 120, (i,x) => {
    const h = hash(i+200); if(h < .4) return;

function drawPlatform(p){
  const x = p.x - S.camX, y = p.y;
  if(x > W+20 || x+p.w < -20) return;
  if(p.amp){
    ctx.strokeStyle = '#3f6b2a'; ctx.lineWidth = 3;
    for(const vx of [x+18, x+p.w-18]){ ctx.beginPath(); ctx.moveTo(vx,-10); ctx.lineTo(vx,y+4); ctx.stroke(); }
  }
  const g = ctx.createLinearGradient(0,y,0,y+16);
  g.addColorStop(0,'#8b5e34'); g.addColorStop(1,'#5a3a1e');
  ctx.fillStyle = g; rr(x, y, p.w, 16, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(40,22,8,.45)'; ctx.lineWidth = 1.5;
  for(let i=0;i<p.w/28;i++){
    const bx = x + 12 + i*28 + hash(p.seed*100+i)*10;
    if(bx > x+p.w-10) break;
    ctx.beginPath(); ctx.moveTo(bx, y+6); ctx.lineTo(bx+10, y+9); ctx.stroke();
  }
  ctx.fillStyle = '#4f8a2e'; rr(x+4, y-3, p.w-8, 6, 3); ctx.fill();
  for(const [lx,dir] of [[x+4,-1],[x+p.w-4,1]]){
    ctx.fillStyle = '#3c7d2b'; ctx.beginPath(); ctx.ellipse(lx+dir*8, y-2, 12, 5, dir*-0.5, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#5ea83a'; ctx.beginPath(); ctx.ellipse(lx+dir*4, y+6, 10, 4, dir*0.5, 0, 6.29); ctx.fill();
  }
  // 늘어진 이끼
  ctx.strokeStyle = 'rgba(95,150,60,.8)'; ctx.lineWidth = 2;
  for(let i=0;i<3;i++){
    const mx = x + p.w*(0.2 + hash(p.seed*50+i)*0.6), ml = 10 + hash(p.seed*70+i)*18;
    ctx.beginPath(); ctx.moveTo(mx, y+14); ctx.quadraticCurveTo(mx+3, y+14+ml/2, mx, y+14+ml); ctx.stroke();
  }
}

function drawFruit(f){
  let [fx, fy] = pos(f);
  const x = fx - S.camX; if(x < -30 || x > W+30) return;
  const y = fy + Math.sin(S.time*0.08 + f.ox)*3;
  ctx.save(); ctx.translate(x, y);
  switch(f.type){
    case 'banana':
      ctx.rotate(-0.4); ctx.lineCap = 'round';
      ctx.strokeStyle = '#e8b923'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(0,-9,13,0.18*Math.PI,0.82*Math.PI); ctx.stroke();
      ctx.strokeStyle = '#fff09a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0,-9,11,0.3*Math.PI,0.7*Math.PI); ctx.stroke();
      ctx.fillStyle = '#5a3a1e'; ctx.beginPath(); ctx.arc(11,-1,2.2,0,6.29); ctx.fill();
      break;
    case 'cherry':
      ctx.strokeStyle = '#4c7a2a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(-6,1); ctx.moveTo(0,-12); ctx.lineTo(6,1); ctx.stroke();
      ctx.fillStyle = '#5ea83a'; ctx.beginPath(); ctx.ellipse(4,-12,5,2.5,-0.4,0,6.29); ctx.fill();
      for(const cx of [-6,6]){ ctx.fillStyle = '#e0283a'; ctx.beginPath(); ctx.arc(cx,4,6.5,0,6.29); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(cx-2,2,1.8,0,6.29); ctx.fill(); }
      break;
    case 'mango': {
      const g = ctx.createRadialGradient(-4,-4,2,0,0,14); g.addColorStop(0,'#ffd35a'); g.addColorStop(1,'#f06a1d');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0,0,11,13,0.4,0,6.29); ctx.fill();
      ctx.fillStyle = '#4c9a2e'; ctx.beginPath(); ctx.ellipse(6,-13,6,3,-0.5,0,6.29); ctx.fill();
      break; }
    case 'dragon':
      ctx.fillStyle = '#ff4f9a'; ctx.beginPath(); ctx.ellipse(0,0,12,14,0,0,6.29); ctx.fill();
      ctx.fillStyle = '#7ccf3a';
      for(const [sx,sy,r] of [[-9,-6,-0.8],[9,-4,0.8],[-6,7,-0.5],[7,8,0.5],[0,-14,0]]){
        ctx.save(); ctx.translate(sx,sy); ctx.rotate(r); ctx.beginPath(); ctx.moveTo(-3,2); ctx.lineTo(0,-6); ctx.lineTo(3,2); ctx.fill(); ctx.restore();
      }
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(-4,-4,2.5,0,6.29); ctx.fill();
      break;
    case 'poison': {
      const pulse = 0.5 + Math.sin(S.time*0.12)*0.25;
      const g = ctx.createRadialGradient(0,0,4,0,0,26); g.addColorStop(0,`rgba(140,255,80,${pulse})`); g.addColorStop(1,'rgba(140,255,80,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,26,0,6.29); ctx.fill();
      ctx.fillStyle = '#4b1d63'; ctx.beginPath(); ctx.ellipse(0,0,12,13,0,0,6.29); ctx.fill();
      ctx.fillStyle = '#7dff4a'; for(const [sx,sy] of [[-7,-5],[8,3],[-5,8]]){ ctx.beginPath(); ctx.arc(sx,sy,1.8,0,6.29); ctx.fill(); }
      ctx.fillStyle = '#f4f4f4'; ctx.beginPath(); ctx.arc(0,-1,5.5,0,6.29); ctx.fill(); ctx.fillRect(-3,3,6,3.5);
      ctx.fillStyle = '#4b1d63'; ctx.beginPath(); ctx.arc(-2.2,-1.5,1.5,0,6.29); ctx.arc(2.2,-1.5,1.5,0,6.29); ctx.fill();
      ctx.fillStyle = '#2e5f14'; ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(4,-18); ctx.lineTo(1,-12); ctx.fill();
      const dy = (S.time*0.4 + f.ox*3) % 18;
      ctx.fillStyle = `rgba(125,255,74,${1-dy/18})`; ctx.beginPath(); ctx.arc(3,13+dy,2,0,6.29); ctx.fill();
      break; }
  }
  ctx.restore();
}

function drawSpider(sp){
  const x = sp.x - S.camX; if(x < -40 || x > W+40) return;
  const y = sp.y;
  ctx.strokeStyle = 'rgba(235,235,235,.55)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x,-5); ctx.lineTo(x,y-12); ctx.stroke();

  for(let i=0;i<4;i++){

    for(const s of [-1,1]){
      ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(s*14, ly-6+wig); ctx.lineTo(s*20, ly+6+wig*0.5); ctx.stroke();

}

function drawChest(c){
  const x = c.plat.x + c.ox - S.camX, y = c.plat.y - 28;
  if(x < -60 || x > W+60) return;
  const g = ctx.createRadialGradient(x+18,y+14,4,x+18,y+14,48);
  g.addColorStop(0,'rgba(255,220,120,.55)'); g.addColorStop(1,'rgba(255,220,120,0)');
  if(c.got){
    const age = S.time - c.openAt, beam = Math.max(0, 1 - age/90);
    if(beam > 0){
      const bg = ctx.createLinearGradient(0, y-120, 0, y+12);
      bg.addColorStop(0,'rgba(255,255,255,0)'); bg.addColorStop(1, c.potion ? POTIONS[c.potion].color + Math.round(180*beam).toString(16).padStart(2,'0') : `rgba(220,205,255,${0.7*beam})`);
      ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(x+6,y+12); ctx.lineTo(x+30,y+12); ctx.lineTo(x+48,y-120); ctx.lineTo(x-12,y-120); ctx.closePath(); ctx.fill();
    }
    if(c.potion && age < 80){
      const e = ease(age/50);
      ctx.save(); ctx.globalAlpha = Math.min(1, (80-age)/25);
      drawPotion(x+18, y+6 - e*60, 1.1, POTIONS[c.potion].color); ctx.restore();
    }
    ctx.fillStyle = '#6b3f1f'; ctx.save(); ctx.translate(x, y+11); ctx.rotate(-0.5);
    rr(0,-12,36,12,4); ctx.fill(); ctx.fillStyle = '#f2c14e'; ctx.fillRect(0,-3,36,3); ctx.restore();
    ctx.fillStyle = '#8b5a2b'; rr(x, y+10, 36, 18, 3); ctx.fill();
    ctx.fillStyle = '#2a1608'; ctx.fillRect(x+3, y+10, 30, 4);
    ctx.fillStyle = '#f2c14e'; ctx.fillRect(x+7, y+10, 3, 18); ctx.fillRect(x+26, y+10, 3, 18);
    return;
  }
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x+18,y+14,48,0,6.29); ctx.fill();
  drawChestIcon(x, y, 1, true);
  for(let i=0;i<3;i++){
    const a = S.time*0.04 + i*2.1, sx = x+18+Math.cos(a)*28, sy = y+10+Math.sin(a)*16, s = 3 + Math.sin(S.time*0.2+i)*1.5;
    ctx.fillStyle = '#fff6c0'; ctx.beginPath();
    ctx.moveTo(sx,sy-s); ctx.lineTo(sx+s*0.35,sy); ctx.lineTo(sx,sy+s); ctx.lineTo(sx-s*0.35,sy); ctx.closePath(); ctx.fill();
  }
}

function drawAnimal(a){
  const [ax, ay] = pos(a), x = ax - S.camX;
  if(x < -60 || x > W+60) return;
  ctx.save();
  if(a.kind === 'monkey'){
    const P = S.player, near = Math.abs(P.x - ax) < 160;
    const hop = near ? -Math.abs(Math.sin(a.t*0.15))*10 : 0;
    ctx.translate(x, ay+hop); ctx.scale(near ? (P.x < ax ? -1 : 1) : a.flip, 1);
    ctx.strokeStyle = '#6b3f1f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8,-8); ctx.bezierCurveTo(-26,-6,-26,-34,-14,-32); ctx.stroke();
    ctx.fillStyle = '#7a4a24'; ctx.beginPath(); ctx.ellipse(0,-13,11,13,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#d8a878'; ctx.beginPath(); ctx.ellipse(1,-11,6,8,0,0,6.29); ctx.fill();
    const wave = near ? Math.sin(a.t*0.3)*0.6 : 0.2;
    ctx.save(); ctx.translate(8,-18); ctx.rotate(-1.2 - wave); ctx.fillStyle = '#7a4a24'; ctx.fillRect(-2,0,4,13); ctx.restore();
    ctx.fillStyle = '#7a4a24'; ctx.beginPath(); ctx.arc(0,-32,10,0,6.29); ctx.arc(-10,-32,4,0,6.29); ctx.arc(10,-32,4,0,6.29); ctx.fill();
    ctx.fillStyle = '#e7c095'; ctx.beginPath(); ctx.ellipse(1,-30,7,6,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#2a1a0e'; ctx.beginPath(); ctx.arc(-2,-32,1.6,0,6.29); ctx.arc(4,-32,1.6,0,6.29); ctx.fill();
    ctx.strokeStyle = '#2a1a0e'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(1,-28,2.5,0.2,Math.PI-0.2); ctx.stroke();
  } else if(a.kind === 'toucan'){
    ctx.translate(x, ay); ctx.scale(a.flip, 1);
    const bob = Math.sin(a.t*0.05)*1.5;
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.moveTo(-6,-6); ctx.lineTo(-16,2); ctx.lineTo(-4,-2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-14+bob,9,13,0.15,0,6.29); ctx.fill();
    ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.ellipse(4,-19+bob,5,6,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#ff8c1a'; ctx.beginPath(); ctx.ellipse(14,-23+bob,11,4.5,0.1,0,6.29); ctx.fill();
    ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(24,-22+bob,2.5,0,6.29); ctx.fill();
    ctx.fillStyle = '#4fc3f7'; ctx.beginPath(); ctx.arc(3,-24+bob,3,0,6.29); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(3.5,-24+bob,1.4,0,6.29); ctx.fill();
    ctx.fillStyle = '#ff8c1a'; ctx.fillRect(-3,-2,2,3); ctx.fillRect(2,-2,2,3);
  } else if(a.kind === 'frog'){
    const ph = a.t % 150, hop = ph < 20 ? -Math.sin(ph/20*Math.PI)*18 : 0;
    ctx.translate(x, ay+hop); ctx.scale(a.flip, 1);
    ctx.fillStyle = '#3e9b3f'; ctx.beginPath(); ctx.ellipse(-7,-3,6,3,0,0,6.29); ctx.ellipse(7,-3,6,3,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.ellipse(0,-8,12,8,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#ffe082'; ctx.beginPath(); ctx.ellipse(0,-5,7,4,0,0,6.29); ctx.fill();
    for(const ex of [-5,5]){ ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.arc(ex,-15,4,0,6.29); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex,-15.5,2.6,0,6.29); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex+0.6,-15.5,1.3,0,6.29); ctx.fill(); }
  } else if(a.kind === 'parrot'){
    ctx.translate(x, ay);
    const flap = Math.sin(a.t*0.4);
    ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(34,3); ctx.lineTo(10,4); ctx.fill();

function drawPlayerBack(){   // 주인공 뒤쪽 효과 (빛, 날개)
  const P = S.player, cx = P.x - S.camX + P.w/2, cy = P.y + P.h/2;
  if(S.fx.glow > 0){
    const fade = Math.min(1, S.fx.glow/60), r = 78 + Math.sin(S.time*0.1)*8;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(cx, cy, 6, cx, cy, r);
    g.addColorStop(0, `rgba(255,250,200,${0.75*fade})`); g.addColorStop(0.35, `rgba(255,230,120,${0.35*fade})`); g.addColorStop(1, 'rgba(255,220,100,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 0.25*fade; ctx.strokeStyle = '#fff6c0'; ctx.lineWidth = 3;
    for(let i=0;i<8;i++){ const a = S.time*0.02 + i*Math.PI/4; ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*30, cy+Math.sin(a)*30); ctx.lineTo(cx+Math.cos(a)*(r+10), cy+Math.sin(a)*(r+10)); ctx.stroke(); }
    ctx.restore();
  }
  if(S.fx.float > 0){
    const flap = Math.sin(S.time*(P.onGround ? 0.12 : 0.35))*0.35;
    ctx.save(); ctx.translate(cx - P.face*6, P.y + P.h*0.38);
    ctx.globalAlpha = S.fx.float < 120 && Math.floor(S.fx.float/8)%2 ? 0.4 : 0.9;
    for(const d of [-1, 1]){
      ctx.save(); ctx.scale(d, 1); ctx.rotate(-0.5 + flap*d*0 + flap);
      ctx.fillStyle = '#eaf8ff'; ctx.strokeStyle = '#8fd6ff'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(14,-22,30,-16); ctx.quadraticCurveTo(22,-6,26,2); ctx.quadraticCurveTo(14,2,0,0); ctx.fill(); ctx.stroke();
      ctx.restore();

function drawPlayerFront(){  // 주인공 앞쪽 효과 (느림보, 요정)
  const P = S.player, cx = P.x - S.camX + P.w/2;
  if(S.fx.slow > 0){
    ctx.save(); ctx.translate(cx, P.y - 12);
    ctx.strokeStyle = 'rgba(170,200,90,.9)'; ctx.lineWidth = 2;
    for(let i=0;i<3;i++){ const a = S.time*0.08 + i*2.09; ctx.beginPath(); ctx.arc(Math.cos(a)*12, Math.sin(a)*4, 3, 0, 6.29); ctx.stroke(); }
    ctx.font = `13px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#d6ec9a'; ctx.fillText('느릿느릿', 0, -10);
    ctx.restore();
  }
  if(S.fairy){
    const f = S.fairy, x = f.x - S.camX, y = f.y, fade = Math.min(1, (S.fx.fairy || 0)/60);

    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 26, 0, 6.29); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

      ctx.beginPath(); ctx.ellipse(x + d*4*flap, y + 1, 4.5*flap + 1, 3, -d*0.4, 0, 6.29); ctx.fill();
    }
    ctx.fillStyle = '#7fdc6a'; ctx.beginPath(); ctx.moveTo(x-3.5, y+7); ctx.lineTo(x+3.5, y+7); ctx.lineTo(x+1.5, y-2); ctx.lineTo(x-1.5, y-2); ctx.fill();
    ctx.fillStyle = '#ffe0c2'; ctx.beginPath(); ctx.arc(x, y - 5, 3.2, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.arc(x, y - 6.5, 3.2, Math.PI, 0); ctx.fill(); ctx.beginPath(); ctx.arc(x + 2.8*(-P.face), y - 6, 1.8, 0, 6.29); ctx.fill();

function drawPotionHUD(){

  });

function drawOrb(x, y, r, ch, flash=0, hue=260){
  const pulse = 1 + Math.sin(S.time*0.08 + x*0.05)*0.07, glow = Math.min(1, flash/50);
  ctx.save();
  const ar = r*(2.1 + glow*0.8)*pulse;
  const a = ctx.createRadialGradient(x, y, r*0.6, x, y, ar);
  a.addColorStop(0, `hsla(${hue},100%,72%,${0.55 + glow*0.4})`); a.addColorStop(1, `hsla(${hue},100%,72%,0)`);
  ctx.fillStyle = a; ctx.beginPath(); ctx.arc(x, y, ar, 0, 6.29); ctx.fill();
  const g = ctx.createRadialGradient(x-r*0.35, y-r*0.4, r*0.08, x, y, r);
  g.addColorStop(0, `hsl(${hue},100%,90%)`); g.addColorStop(0.32, `hsl(${hue},78%,54%)`); g.addColorStop(1, `hsl(${hue},75%,19%)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill();
  ctx.strokeStyle = `hsla(${hue},100%,92%,.9)`; ctx.lineWidth = Math.max(1.2, r*0.08); ctx.stroke();
  const rot = S.time*0.04 + x*0.01;
  ctx.strokeStyle = 'rgba(255,238,170,.85)'; ctx.lineWidth = Math.max(1, r*0.07); ctx.lineCap = 'round';
  for(const o of [0, Math.PI]){ ctx.beginPath(); ctx.arc(x, y, r*1.24, rot+o, rot+o+1.1); ctx.stroke(); }
  ctx.font = `${Math.round(r*1.15)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(1.5, r*0.12); ctx.strokeStyle = `hsla(${hue},80%,15%,.55)`; ctx.strokeText(ch, x, y + r*0.07);
  ctx.shadowColor = '#fff3b0'; ctx.shadowBlur = r*0.7; ctx.fillStyle = '#fffbe8';
  ctx.fillText(ch, x, y + r*0.07);
  ctx.restore();
}
const SLOT_SP = 34, SLOT_GAP = 18;
function slotPos(i){
  const total = GOAL*SLOT_SP + SLOT_GAP;
  return [W/2 - total/2 + SLOT_SP/2 + i*SLOT_SP + (i >= LINE1 ? SLOT_GAP : 0), 38];
}
function drawOrbsInFlight(){
  for(const o of S.orbs){
    let x, y, r;
    if(o.t < 50){ const e = ease(o.t/50); x = o.wx - S.camX; y = o.wy - e*80; r = 8 + e*18; }
    else { const e = ease((o.t-50)/50), [tx, ty] = slotPos(o.slot); x = o.fx + (tx-o.fx)*e; y = o.fy + (ty-o.fy)*e - Math.sin(e*Math.PI)*40; r = 26 - e*11; }
    drawOrb(x, y, r, o.ch, 30, HUES[o.slot]);
  }
}
function drawEnding(){
  const t = S.endT;
  ctx.save();
  ctx.fillStyle = `rgba(8,4,30,${Math.min(0.78, t/70*0.78)})`; ctx.fillRect(0, 0, W, H);
  const cx = W/2, cy = H/2 - 10;
  if(t > 40){
    const a = Math.min(1, (t-40)/60);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(S.time*0.004);
    for(let i=0;i<14;i++){
      ctx.rotate(Math.PI*2/14);
      ctx.fillStyle = `rgba(200,180,255,${0.10*a})`;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-40, -W); ctx.lineTo(40, -W); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  const R = 32, SP = 80;
  for(let i=0;i<GOAL;i++){
    const line2 = i >= LINE1, idx = line2 ? i-LINE1 : i, n = line2 ? GOAL-LINE1 : LINE1;
    const tx = cx - (n-1)*SP/2 + idx*SP, ty = line2 ? cy + 48 : cy - 48;
    const [sx, sy] = slotPos(i), e = ease((t - 20 - i*7)/70);
    drawOrb(sx + (tx-sx)*e, sy + (ty-sy)*e, 15 + (R-15)*e, WORD[i], t > 120 + i*5 && t < 150 + i*5 ? 50 : 0, HUES[i]);
  }
  if(t > 170){
    const a = Math.min(1, (t-170)/40);
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `34px ${FONT}`; ctx.fillStyle = '#f2c14e'; ctx.shadowColor = '#fff3b0'; ctx.shadowBlur = 16;
    ctx.fillText('탐험 완성!', cx, cy + 140);
  }
  ctx.restore();
}
function drawHUD(){
  ctx.save();
  ctx.fillStyle = 'rgba(8,30,22,.6)'; rr(12,12,246,70,14); ctx.fill();
  const slots = Math.max(3, S.lives);
  for(let i=0;i<slots;i++){
    heartPath(34 + i*28, 20, 22);
    if(i < S.lives){ ctx.fillStyle = '#ff4d6d'; ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.stroke(); }
  }
  ctx.font = `20px ${FONT}`; ctx.fillStyle = '#fff6dc'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(`점수 ${S.score}`, 24, 72);
  ctx.fillStyle = '#f7d23c'; ctx.fillText(`열매 ${S.fruitCount}`, 150, 72);

  const pw = GOAL*SLOT_SP + SLOT_GAP + 20, px = W/2 - pw/2;
  ctx.fillStyle = 'rgba(8,30,22,.6)'; rr(px,12,pw,52,14); ctx.fill();
  for(let i=0;i<GOAL;i++){
    const [sx, sy] = slotPos(i);
    if(S.found[i]){ if(S.state !== 'ending') drawOrb(sx, sy, 14, WORD[i], S.slotFlash[i], HUES[i]); }
    else {
      ctx.strokeStyle = 'rgba(255,246,220,.25)'; ctx.lineWidth = 1.5; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.arc(sx, sy, 13, 0, 6.29); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = `15px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,246,220,.28)'; ctx.fillText(WORD[i], sx, sy+1);
    }
  }
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center'; ctx.font = `17px ${FONT}`; ctx.fillStyle = 'rgba(255,246,220,.85)';
  ctx.fillText(`${S.dist}m 탐험`, W/2, 82);
  ctx.restore();
}

function render(){
  ctx.save();
  if(S.shake > 0) ctx.translate(rand(-S.shake,S.shake)*0.5, rand(-S.shake,S.shake)*0.5);
  drawBG();
  for(const p of S.plats) drawPlatform(p);
  for(const a of S.animals) if(a.plat) drawAnimal(a);
  for(const c of S.chests) drawChest(c);
  for(const h of S.hearts) drawHeartPickup(h);
  for(const f of S.fruits) drawFruit(f);
  for(const s of S.spiders) drawSpider(s);
  drawPlayerBack();
  drawPlayer();
  drawPlayerFront();
  for(const a of S.animals) if(a.kind === 'parrot' || a.kind === 'butterfly') drawAnimal(a);
  drawWater();
  for(const a of S.animals) if(a.kind === 'croc') drawCroc(a);
  for(const p of S.particles){ ctx.globalAlpha = Math.max(0, p.life/p.max); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x-S.camX, p.y, p.size, 0, 6.29); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = `22px ${FONT}`; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,30,20,.8)';
  for(const t of S.texts){ ctx.globalAlpha = Math.min(1, t.life/20); ctx.strokeText(t.txt, t.x-S.camX, t.y); ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x-S.camX, t.y); }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  drawFG();
  ctx.restore();
  if(S.state !== 'title'){ drawHUD(); drawPotionHUD(); }
  drawOrbsInFlight();
  if(S.state === 'ending') drawEnding();
}

        <div class="slot"><div class="thumb" id="thJump"></div><b>점프 모습</b><small id="nmJump"></small>
          <button class="sbtn" data-img="heroJump">불러오기</button><button class="sbtn ghost" data-clr="heroJump">지우기</button></div>
        <div class="slot"><div class="thumb"><span class="note">♪</span></div><b>배경음악</b><small id="nmBgm"></small>
          <button class="sbtn" id="audBtn">불러오기</button><button class="sbtn ghost" id="pvBtn">들어보기</button><button class="sbtn ghost" data-clr="bgm">지우기</button></div>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="optBg" ${autoBg ? 'checked' : ''}> 그림 배경 자동 지우기</label>
        <label>캐릭터 크기 <input type="range" id="optSize" min="36" max="96" value="${heroHeight}"></label>
      </div>
      <p id="msg"></p>
      <p class="keys">불러온 파일은 이 기기의 브라우저에 저장돼요. 다른 기기에서는 다시 불러와야 해요.</p>
      <button class="go" id="goBtn">완료</button>`;
  } else if(type === 'pause'){
    html = `<h2>잠깐 쉬는 중</h2><p>정글이 기다리고 있어요.</p><button class="go" id="goBtn">계속하기</button>`;
  } else {
    const won = type === 'win', total = S.score + S.dist;
    html = `<h2>${won ? '강원특수교육원 강릉분원 완성!' : '탐험 종료'}</h2>
      ${wordHTML()}
      <p class="big">최종 점수 ${total}</p>
      <p>열매 ${S.fruitCount}개 · 글자 ${S.found.filter(Boolean).length}/${GOAL} · ${S.dist}m 탐험</p>
      <p>최고 기록 ${S.best}</p>
      <button class="go" id="goBtn">${won ? '새 정글로 출발' : '다시 도전'}</button>`;
  }
  screen = type;
  card.innerHTML = html;
  overlay.classList.add('show');
  const b = document.getElementById('goBtn');
  b.onclick = type === 'pause' ? togglePause : type === 'custom' ? () => { bgmStop(); showScreen('title'); } : startGame;
  const cb = document.getElementById('customBtn');
  if(cb) cb.onclick = () => showScreen('custom');
  if(type === 'custom') wireCustom();
  b.focus();
}
function wireCustom(){
  card.querySelectorAll('[data-img]').forEach(el => el.onclick = () => { pickSlot = el.dataset.img; pickImg.click(); });
  document.getElementById('audBtn').onclick = () => pickAud.click();
  card.querySelectorAll('[data-clr]').forEach(el => el.onclick = async () => {
    const k = el.dataset.clr;
    if(k === 'bgm') applyBgm(null); else applyImg(k === 'hero' ? hero : heroJump, null);
    try{ await idbSet(k, null); }catch(e){}
    setMsg('기본 상태로 되돌렸어요.'); refreshCustom();
  });
  document.getElementById('pvBtn').onclick = () => {
    if(previewing){ bgmStop(); }
    else if(bgmOk && bgm.src){ previewing = true; bgm.currentTime = 0; bgm.volume = BGM_VOLUME; bgm.play().catch(() => { previewing = false; refreshCustom(); }); }
    refreshCustom();
  };
  document.getElementById('optBg').onchange = e => { autoBg = e.target.checked; };
  document.getElementById('optSize').oninput = e => {
    heroHeight = +e.target.value;
    try{ localStorage.setItem('jungle_hero_h', heroHeight); }catch(e){}
  };
  refreshCustom();
}
function wordHTML(){
  const orb = i => `<span class="orb${S.found[i] ? '' : ' empty'}" style="--h:${HUES[i]}">${WORD[i]}</span>`;
  const idx = [...Array(GOAL).keys()];
  return `<div class="word"><div class="line">${idx.slice(0,LINE1).map(orb).join('')}</div><div class="line">${idx.slice(LINE1).map(orb).join('')}</div></div>`;
}
function hideScreen(){ overlay.classList.remove('show'); screen = ''; }
function startGame(){
  bgmStop(); screen = '';
  newGame(); S.state = 'play'; hideScreen();
  jumpQueued = 0; Object.keys(keys).forEach(k => keys[k] = false); jumpPointers.clear();
  if(isTouch) showTapHint();
  tone(1,0.01,'sine',0.0001); // 모바일 오디오 잠금 해제
  bgmPlay(true);
}
function togglePause(){
  if(S.state !== 'play') return;
  S.paused = !S.paused;
  S.paused ? (showScreen('pause'), bgmStop()) : (hideScreen(), bgmPlay(false));
}
document.getElementById('btnPause').onclick = e => { e.currentTarget.blur(); togglePause(); };
const btnSound = document.getElementById('btnSound');
btnSound.onclick = e => {
  soundOn = !soundOn; btnSound.style.opacity = soundOn ? 1 : 0.4; e.currentTarget.blur();
  if(!soundOn) bgmStop(); else if(S.state === 'play' && !S.paused) bgmPlay(false);
};
document.addEventListener('visibilitychange', () => { if(document.hidden && S.state === 'play' && !S.paused) togglePause(); });

/* ================= 루프 ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(50, now - last); last = now;
  const k = dt / 16.667;
  if(S.state === 'play' && !S.paused) update(k);
  else if(S.state === 'ending') updateEnding(k);
  else if(S.state === 'over' || S.state === 'win') updateFx(k);
  else if(S.state === 'title') S.time += k;
  render();
  requestAnimationFrame(loop);
}
newGame(); showScreen('title'); loadSaved();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
