  const slot = artBgs[key] = {img:null, ok:false};

      const x = c.getContext('2d'); x.drawImage(src.img, 0, 0);
      const d = x.getImageData(0, 0, w, h), p = d.data;
      for(let i=0;i<p.length;i+=4){ const o = fn(p[i], p[i+1], p[i+2], i/4 % w, (i/4/w)|0, w, h); p[i] = o[0]; p[i+1] = o[1]; p[i+2] = o[2]; }
      x.putImageData(d, 0, 0);
      c.naturalWidth = w; c.naturalHeight = h;
      slot.img = c; slot.ok = true;
    }catch(e){ slot.img = src.img; slot.ok = true; }
  };

}

/* ---- 이미지 정리: 배경 지우기 + 여백 자르기 ---- */
async function cleanImage(file, removeBg){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  URL.revokeObjectURL(url);
  const sc = Math.min(1, 512 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth*sc)), h = Math.max(1, Math.round(img.naturalHeight*sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h), px = d.data;
  if(removeBg){
    const corners = [0, w-1, (h-1)*w, (h-1)*w + w-1].filter(i => px[i*4+3] > 200);
    if(corners.length >= 3){ // 모서리가 불투명하면 = 배경이 있는 그림
      const o0 = corners[0]*4, br = px[o0], bgc = px[o0+1], bb = px[o0+2], TOL = 60*60;
      const seen = new Uint8Array(w*h), stack = [];
      for(let i=0;i<w;i++){ stack.push(i, (h-1)*w + i); }
      for(let j=0;j<h;j++){ stack.push(j*w, j*w + w-1); }
      while(stack.length){
        const i = stack.pop(); if(seen[i]) continue; seen[i] = 1;
        const o = i*4, dr = px[o]-br, dg = px[o+1]-bgc, db = px[o+2]-bb;
        if(px[o+3] < 20 || dr*dr + dg*dg + db*db < TOL){
          px[o+3] = 0;
          const xx = i % w, yy = (i / w) | 0;
          if(xx > 0) stack.push(i-1); if(xx < w-1) stack.push(i+1);
          if(yy > 0) stack.push(i-w); if(yy < h-1) stack.push(i+w);
        }
      }
      x.putImageData(d, 0, 0);
    }
  }
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for(let yy=0; yy<h; yy++) for(let xx=0; xx<w; xx++){
    if(px[(yy*w + xx)*4 + 3] > 12){ if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(yy<minY)minY=yy; if(yy>maxY)maxY=yy; }
  }
  let out = c;
  if(maxX >= 0){
    const bw = maxX-minX+1, bh = maxY-minY+1;
    out = document.createElement('canvas'); out.width = bw; out.height = bh;
    out.getContext('2d').drawImage(c, minX, minY, bw, bh, 0, 0, bw, bh);
  }
  return new Promise(res => out.toBlob(b => res(b || file), 'image/png'));
}

function ciMakeImg(d, src){ d.ok = false; d.img = new Image(); d.img.onload = () => { d.ok = true; if(screen === 'myitems') showScreen('myitems'); }; d.img.src = src; d.src = src; }
function ciRepoOff(){ return loadJSON('jungle_repo_off') || []; }
function activeCustom(){ const off = ciRepoOff(); return CUSTOM.filter(d => d.ok && (d.repo ? !off.includes(d.id) : d.on)); }
async function ciPersist(){
  const list = CUSTOM.filter(d => !d.repo).map(({id,name,type,value,effect,freq,size,place,on,blob}) => ({id,name,type,value,effect,freq,size,place,on,blob}));
  try{ await idbSet('custom_items', list); return true; }catch(e){ return false; }
}
async function ciLoad(){
  let list = null; try{ list = await idbGet('custom_items'); }catch(e){}
  for(const d of (list || [])){ const it = Object.assign({}, d); ciMakeImg(it, URL.createObjectURL(d.blob)); CUSTOM.push(it); }
  try{   // 저장소 items/custom.json (모든 방문자에게 보이는 아이템)
    const r = await fetch('items/custom.json', {cache:'no-store'});
    if(r.ok){ const j = await r.json(); for(const d of (j.items || [])){ if(!d.image || CUSTOM.some(c => c.id === d.id)) continue; const it = Object.assign({}, d, {repo:true}); delete it.image; ciMakeImg(it, d.image); CUSTOM.push(it); } }
  }catch(e){}
}
function blobToDataURL(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
async function ciExport(){
  const items = [];
  for(const d of CUSTOM.filter(d => !d.repo)){ const {id,name,type,value,effect,freq,size,place,on} = d; items.push({id,name,type,value,effect,freq,size,place,on, image: await blobToDataURL(d.blob)}); }
  const blob = new Blob([JSON.stringify({version:1, items})], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'custom.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const pickJSON = Object.assign(document.createElement('input'), {type:'file', accept:'.json,application/json'});
pickJSON.onchange = async () => {
  const f = pickJSON.files[0]; pickJSON.value = ''; if(!f) return;
  try{
    const j = JSON.parse(await f.text()); let n = 0;
    for(const d of (j.items || [])){
      if(!d.image || CUSTOM.filter(c => !c.repo).length >= CI_MAX) continue;
      const blob = await (await fetch(d.image)).blob();
      const it = Object.assign({}, d, {id:'ci' + Date.now() + '_' + n, blob, repo:false, on:true}); delete it.image;
      ciMakeImg(it, URL.createObjectURL(blob)); CUSTOM.push(it); n++;
    }
    await ciPersist(); showScreen('myitems'); setMsg(`아이템 ${n}개를 가져왔어요.`);
  }catch(e){ setMsg('이 파일은 읽을 수 없어요. 내보내기로 만든 custom.json 파일을 골라 주세요.'); }
};

function drawImgFit(img, cx, cy, box){ const r = Math.min(box/img.naturalWidth, box/img.naturalHeight), w = img.naturalWidth*r, h = img.naturalHeight*r; ctx.drawImage(img, cx - w/2, cy - h/2, w, h); }

function spawnCustom(p){
  const list = activeCustom(); if(!list.length) return;
  const test = S.opts && S.opts.testItem;
  if(S.tutorial && p.x < TUT_END + 200) return;
  if(p.x < (test ? 200 : 500)) return;
  for(const d of list){
    let ch = CI_FREQ[d.freq] || 0.07;
    if(d.type === 'life') ch = Math.min(ch, 0.035);
    if(test === d.id) ch = 0.6;
    if(Math.random() > ch) continue;   // (오늘의 도전 맵이 달라지지 않게 따로 뽑아요)
    if(d.type === 'bounce'){ if(p.amp || p.crumble || p.w < 100 || p.y < 300) continue; S.mushrooms.push({plat:p, ox:rand(p.w*0.3, p.w*0.7), sq:0, art:d}); continue; }
    const size = CI_SIZE[d.size] || 36, air = d.place === 'air' && d.type !== 'hazard';
    const oy = d.type === 'hazard' ? -size/2 + 2 : air ? -rand(110, 160) : d.type === 'enemy' ? -rand(50, 70) : -rand(34, 80);
    S.customs.push({d, plat:p, ox:rand(20, Math.max(21, p.w - 20)), oy, t:rand(0, 100), got:false});
  }
}
function collectCustom(c, x, y){
  const d = c.d;
  if(d.type === 'fruit'){ addCombo(x, y); const pts = (+d.value || 20)*comboMult(); S.score += pts; S.fruitCount++; S.stats.fruits++; sfx.fruit(); floatText(x, y - 18, `${d.name} +${pts}`, '#fff3a0'); burst(x, y, '#fff3a0', 10); }
  else if(d.type === 'coins'){ const n = +d.value || 5; S.coinCount += n - 1; coinChime(x, y); S.coinCount++; checkCoinLife(); floatText(x, y - 18, `${d.name} 코인 +${n}`, '#ffe07a'); burst(x, y, '#ffe07a', 14); }
  else if(d.type === 'life') gainLife(x, y, `${d.name}! 생명 +1`);
  else if(d.type === 'potion'){ const e = POTIONS[d.effect] ? d.effect : 'glow'; drinkPotion(e); floatText(x, y - 18, `${d.name}! ${POTIONS[e].short} 10초`, POTIONS[e].color); burst(x, y, POTIONS[e].color, 16); }
}
function customPos(c){ const [x, y] = pos(c); return [x, c.d.type === 'enemy' ? y + Math.sin(c.t*0.05)*24 : y]; }
function updateCustoms(k){
  const P = S.player, pcx = P.x + P.w/2, pcy = P.y + P.h/2;
  for(const c of S.customs){
    if(c.got) continue;
    c.t += k;
    const d = c.d, size = CI_SIZE[d.size] || 36, r = size*0.42;
    if(c.dead){ c.vy = (c.vy || -2) + 0.5*k; c.dy = (c.dy || 0) + c.vy*k; if(c.dy > 600) c.got = true; continue; }
    if(d.type === 'hazard' || d.type === 'enemy'){
      const [cx, cy] = customPos(c);
      if(d.type === 'enemy'){
        const stomp = !S.ride && P.vy > 0.5 && P.y + P.h < cy - r*0.2 && P.y + P.h > cy - r - 20 && Math.abs(pcx - cx) < r + 10;
        if(stomp || ((S.fx.giant > 0 || S.fx.power > 0) && hitCircle(cx, cy, r, 0))){
          c.dead = true; if(stomp){ P.vy = -9.5; P.jumps = 1; P.sx = 0.82; P.sy = 1.2; }
          addCombo(cx, cy); addTot('stomp'); const pts = (+d.value || 50)*comboMult(); S.score += pts; P.happyT = 40;
          floatText(cx, cy - r - 12, `${d.name} 물리침! +${pts}`, '#e3a3ff'); burst(cx, cy, '#c04bff', 14); tone(660,.12,'square',.05,220);
          continue;
        }
      }
      if(hitCircle(cx, cy, r, 6)){
        if(S.tutorial && P.x < TUT_END){ continue; }
        S.hurtCause = 'custom';
        if(hurt()){ floatText(cx, cy - r - 12, `${d.name}!`, '#ff8a80'); burst(cx, cy, '#ff6b6b', 12); if(d.type === 'hazard' && S.fx.power > 0) c.got = true; }
      }
      continue;
    }
    if(S.fx.magnet > 0 || S.fx.power > 0){
      const [x0, y0] = pos(c), dx = pcx - x0, dy = pcy - y0, dd = Math.hypot(dx, dy);
      if(dd < 200 && dd > 1){ if(c.plat){ c.x = x0; c.y = y0; c.plat = null; } const sp = Math.min(dd, (4 + (200 - dd)*0.06)*k); c.x += dx/dd*sp; c.y += dy/dd*sp; }
    }
    const [cx, cy] = customPos(c);
    if(hitCircle(cx, cy, r, 2)){ c.got = true; collectCustom(c, cx, cy); }
  }
}
function drawCustom(c){
  const d = c.d; if(!d.ok) return;
  let [px, py] = customPos(c); const x = px - S.camX; if(x < -60 || x > W + 60) return;
  const size = CI_SIZE[d.size] || 36, bad = d.type === 'hazard' || d.type === 'enemy';
  if(d.type !== 'hazard' && d.type !== 'enemy') py += Math.sin(S.time*0.08 + c.ox)*3;
  ctx.save(); ctx.translate(x, py + (c.dy || 0));
  if(!c.dead){
    const col = bad ? '255,70,70' : d.type === 'life' ? '255,120,160' : d.type === 'potion' ? '180,150,255' : '255,230,120';
    const pulse = bad ? 0.35 + Math.sin(S.time*0.14)*0.15 : 0.35;
    const g = ctx.createRadialGradient(0, 0, 3, 0, 0, size*0.85); g.addColorStop(0, `rgba(${col},${pulse})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, size*0.85, 0, 6.29); ctx.fill();
  } else ctx.rotate(Math.PI + (c.dy || 0)*0.02);
  if(d.type === 'enemy' && !c.dead){ ctx.rotate(Math.sin(c.t*0.1)*0.12); if(S.player.x + S.player.w/2 < px) ctx.scale(-1, 1); }
  drawImgFit(d.img, 0, 0, size);
  ctx.restore();
  S.lights.push({x, y:py, r:size, s:bad ? 0.5 : 0.4});
}

    x.setTransform(1,0,0,1,0,0); x.clearRect(0, 0, c.width, c.height);

    else if(k === 'heart'){ x.fillStyle = '#ff4d6d'; heartPath(32, 14, 36); x.fill(); }
    else if(k === 'chest') drawChestIcon(10, 16, 1.2, true);

const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const ease = t => t<0?0:t>1?1:t*t*(3-2*t);
const hash = n => { const s = Math.sin(n*127.1 + 311.7)*43758.5453; return s - Math.floor(s); };

function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function heartPath(x,y,s){ // x=중앙, y=위쪽, s=크기
  ctx.beginPath(); ctx.moveTo(x, y+s*0.3);
  ctx.bezierCurveTo(x, y, x-s*0.5, y, x-s*0.5, y+s*0.3);
  ctx.bezierCurveTo(x-s*0.5, y+s*0.6, x, y+s*0.8, x, y+s);
  ctx.bezierCurveTo(x, y+s*0.8, x+s*0.5, y+s*0.6, x+s*0.5, y+s*0.3);
  ctx.bezierCurveTo(x+s*0.5, y, x, y, x, y+s*0.3); ctx.closePath();
}

let AC = null, soundOn = true;
function tone(f, d, type='square', v=0.07, f2){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
    v *= SET.sfx; if(v <= 0.0002) return;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
const seq = (notes, gap, type='triangle', v=0.07) => notes.forEach((f,i)=>setTimeout(()=>tone(f,0.18,type,v), i*gap));
const sfx = {
  jump:  () => tone(420,.14,'square',.04,760),
  jump2: () => tone(620,.14,'square',.04,1150),
  fruit: () => seq([880,1320],60),
  hurt:  () => tone(320,.35,'sawtooth',.07,70),
  splash:() => tone(240,.3,'sine',.09,60),
  chest: () => seq([523,659,784,1047],90),
  heart: () => seq([660,880,990],70),
  win:   () => seq([523,659,784,1047,784,1047,1319],120),
  lose:  () => seq([392,330,262,196],160,'sine',.08)
};

const KEYMAP = {ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump', ArrowDown:'down', KeyS:'down'};
let slideQueued = 0;
addEventListener('keydown', e => {
  if(screen === 'rhythm' && !e.repeat){
    const lane = {ArrowLeft:0, KeyA:0, KeyJ:0, ArrowDown:1, KeyS:1, KeyK:1, Space:1, ArrowRight:2, KeyD:2, KeyL:2}[e.code];
    if(lane !== undefined){ e.preventDefault(); rhyHit(lane); return; }
  }
  const tag = e.target && e.target.tagName;
  if(tag === 'INPUT') return;
  if(tag === 'BUTTON' && (e.code === 'Enter' || e.code === 'Space') && S.state !== 'play') return;
  const k = KEYMAP[e.code];
  if(k){ e.preventDefault(); if(k==='jump' && !e.repeat) jumpQueued = Math.min(2, jumpQueued + 1); if(k==='down' && !e.repeat) slideQueued = 1; keys[k] = true; }
  if((e.code==='KeyP' || e.code==='Escape') && S.state==='play'){ if(screen === 'bag') closeBag(); else togglePause(); }
  if(S.state === 'lobby' && !screen && (e.code === 'KeyE' || e.code === 'ArrowDown' || e.code === 'KeyS' || e.code === 'Enter') && S.lobby.near){ e.preventDefault(); enterDoor(S.lobby.near); return; }
  if(e.code==='KeyB' && S.state==='play' && (!screen || screen === 'bag')){ if(screen === 'bag') closeBag(); else openBag(); }
  if(e.code==='Enter' && screen === 'title') enterLobby();
});

function layoutUI(){
  try{ layoutUIinner(); }catch(err){ console.error('layout', err); }

function layoutUIinner(){
  if(!isTouch) return;
  const de = document.documentElement;
  const vw = de.clientWidth || innerWidth, vh = de.clientHeight || innerHeight;   // 실제 화면 크기
  if(window.scrollX || window.scrollY) window.scrollTo(0, 0);
  const cs = getComputedStyle(insetProbe), T = parseFloat(cs.paddingTop) || 0, R = parseFloat(cs.paddingRight) || 0, Bm = parseFloat(cs.paddingBottom) || 0, L = parseFloat(cs.paddingLeft) || 0;
  // 노치를 뺀 영역을 게임 화면으로 꽉 채우기: 화면이 넓으면 게임 세계도 옆으로 넓게 보여요
  const aw = vw - L - R, ah = vh;
  const newW = clamp(Math.round(H*aw/ah), 720, 1700);
  if(newW !== W){ W = newW; resize(); }
  let cw = aw, ch = aw*H/W;
  if(ch > ah){ ch = ah; cw = ah*W/H; }
  Object.assign(wrapEl.style, {left:(L + (aw - cw)/2) + 'px', top:((ah - ch)/2) + 'px', width:cw + 'px', height:ch + 'px'});
  // 조이스틱 크기 (설정의 크기 반영)
  const sc = {s:0.85, m:1, l:1.2}[SET.btn] || 1;
  joyR = Math.round(clamp(Math.min(vw, vh)*0.15, 48, 80)*sc);
  const jb = document.getElementById('joyBase'), jk = document.getElementById('joyKnob');
  Object.assign(jb.style, {width:joyR*2 + 'px', height:joyR*2 + 'px'});
  Object.assign(jk.style, {width:Math.round(joyR*0.9) + 'px', height:Math.round(joyR*0.9) + 'px'});
  document.getElementById('joyZone').style.display = ACCS.oneHand ? 'none' : '';
  document.body.classList.toggle('onehand', !!ACCS.oneHand);
  Object.assign(document.getElementById('jumpZone').style, {width:ACCS.oneHand ? '100%' : '50%'});
  // 일시정지·소리 버튼: 오른쪽 위 작게
  const tb = document.getElementById('topBtns'), sb = Math.round(clamp(Math.min(vw, vh)*0.09, 32, 44));
  tb.style.setProperty('--sb', sb + 'px');
  Object.assign(tb.style, {left:'auto', right:(R + 10) + 'px', top:(T + 8) + 'px', flexDirection:'row'});
}

  const d = p.x/1000, ez = S.easy;
  if(false && p.x > S.nextHutX){   // (게임 중 학습 오두막은 뺐어요 — 로비의 체험실로 옮겼어요)
    S.huts.push({plat:p, ox:p.w/2, used:false});
    const st = Math.floor((p.x - 120)/10/ZONE_LEN) + 1;
    S.nextHutX = st*ZONE_LEN*10 + 120 + 1200;
    return;
  }
  if(S.order.length > 0 && p.x > S.nextChestX && p.w >= 120 && !p.crumble){
    S.chestsMade++;
    S.chests.push({plat:p, ox:p.w/2-18, got:false});
    S.nextChestX = p.x + grand(800,1150);
    return;
  }
  const n = Math.floor(grand(0,3.6));
  for(let i=0;i<n;i++) S.fruits.push({plat:p, ox:grand(18,p.w-18), oy:-grand(30,85), type:randomFruit(gr)});
  if(gr() < (zoneAtX(p.x) === 'gold' ? 0.6 : 0.28)){   // 코인 줄 (황금 사원엔 많이)
    const c = Math.floor(grand(3,6)), start = grand(14, Math.max(15, p.w - 14 - (c-1)*22));
    for(let i=0;i<c;i++) if(start + i*22 < p.w - 10) S.coins.push({plat:p, ox:start + i*22, oy:-40});
  }
  if(p.x > 2000 && gr() < 0.025) S.fruits.push({plat:p, ox:grand(20,p.w-20), oy:-grand(50,80), type:'gold'});
  if(p.x > 300 && Math.random() < 0.16) S.fruits.push({plat:p, ox:rand(20, Math.max(21, p.w-20)), oy:-rand(30,60), type:pick(['egg','honey','coconut','wheat'])});   // 요리 재료 (맵이 바뀌지 않게 따로 뽑아요)
  let vine = false;
  if(false && p.x > 1200 && p.w >= 150 && !p.amp && !p.crumble && gr() < (ez ? 0.08 : 0.13)){   // 가시 덩굴은 뺐어요
    S.vines.push({plat:p, ox:grand(p.w*0.45, p.w*0.8), hinted:false}); vine = true;
  }
  if(!vine && p.x > S.nextPortalX && p.w >= 120 && !p.amp && !p.crumble){   // 비밀 동굴 포탈 (드물게)
    S.portals.push({plat:p, ox:p.w/2, used:false});
    S.nextPortalX = p.x + grand(2600,3600);
    vine = true;
  }
  if(!vine && p.x > 800 && p.y >= 330 && p.w >= 110 && !p.amp && !p.crumble && gr() < 0.1){   // 점프 버섯 + 하늘 보상
    const ox = grand(p.w*0.3, p.w*0.7), mx = p.x + ox;
    S.mushrooms.push({plat:p, ox, sq:0});
    for(let i=0;i<7;i++){ const t = i/6; S.coins.push({x:mx + 30 + t*190, y:110 - Math.sin(Math.PI*t)*50, ox:i*4}); }
    if(gr() < 0.35) S.fruits.push({x:mx + 125, y:40, ox:3, type:gr() < 0.3 ? 'gold' : 'dragon'});
    vine = true;
  }
  if(p.x > 700 && p.w > 110 && gr() < Math.min(0.14 + d*0.025, 0.4)*(ez ? 0.6 : 1)*(1 - 0.25*assistLv()))
    S.fruits.push({plat:p, ox:grand(p.w*0.35,p.w*0.8), oy:-16, type:'poison'});
  if(!vine && p.x > 1000 && gr() < Math.min(0.14 + d*0.025, 0.42)*(ez ? 0.7 : 1)*(1 - 0.25*assistLv()))
    S.spiders.push({x:p.x+grand(-30,p.w), base:p.baseY-grand(75,105), amp:grand(28,48)*(ez ? 0.8 : 1),
      spd:(grand(0.025,0.045)+Math.min(d*0.002,0.02))*(ez ? 0.6 : 1), ph:grand(0,6.28), y:0, dead:false});
  if(p.x > 800 && gr() < (ez ? 0.08 : 0.06)) S.hearts.push({plat:p, ox:grand(20,p.w-20), oy:-70});
  const z = zoneAtX(p.x);
  const kinds = z === 'volcano' ? ['toucan'] : z === 'treetop' ? ['monkey','monkey','toucan','frog'] : z === 'ruins' ? ['monkey','frog'] : z === 'swamp' ? ['frog','frog','toucan'] : z === 'snow' ? ['monkey'] : z === 'crystal' ? ['frog'] : ['monkey','toucan','frog'];
  if(gr() < (z === 'volcano' || z === 'crystal' ? 0.08 : 0.2)) S.animals.push({kind:gpick(kinds), plat:p, ox:grand(16,p.w-16), t:grand(0,200), flip:gr()<.5?-1:1});
}

function pos(o){ return o.plat ? [o.plat.x+o.ox, o.plat.y+(o.oy||0)] : [o.x, o.y]; }
function hitCircle(cx, cy, r, shrink){
  const P = S.player;
  const top = P.y + (P.slide > 0 ? 22 : 0);
  const nx = clamp(cx, P.x+shrink, P.x+P.w-shrink), ny = clamp(cy, top+shrink, P.y+P.h-shrink*0.5);
  return (cx-nx)**2 + (cy-ny)**2 < r*r;
}

function findSafePlat(){   // 지금 화면 안에 실제로 있는 튼튼한 발판 찾기
  const P = S.player, ok = p => p && !p.falling && !p.crumble && S.plats.includes(p);
  const inView = p => p.x + p.w > S.camX + 30 && p.x < S.camX + W - 80;
  if(ok(S.lastSafe) && inView(S.lastSafe)) return S.lastSafe;
  const tx = clamp(Number.isFinite(P.x) ? P.x : S.camX + 200, S.camX + 120, S.camX + W - 200);
  let best = null, bd = Infinity;
  for(const p of S.plats){
    if(!ok(p) || p.amp || !inView(p) || p.w < 70) continue;
    const d = Math.abs(p.x + p.w/2 - tx) + (p.x > tx ? 60 : 0);
    if(d < bd){ bd = d; best = p; }
  }
  if(best) return best;
  const x = S.camX + 140;   // 없으면 비상 안전지대 발판을 만들어요
  const p = {x, y:380, baseY:380, w:260, amp:0, phase:0, dy:0, seed:Math.random(), zone:zoneAtX(x)};
  S.plats.push(p);
  return p;
}
function respawn(){
  const P = S.player, p = findSafePlat();
  S.lastSafe = p;
  P.x = p.x + Math.max(8, Math.min(40, p.w/2 - P.w/2)); P.y = p.y - P.h - 2;
  P.vx = 0; P.vy = 0; P.inv = 120; P.plat = p; P.splashed = false; P.onGround = false;
  P.launchT = 0; P.boostT = 0; P.slide = 0; P.gliding = false; P.glide = glideMax();
  S.swing = null; S.ride = null;
  S.camX = Math.max(0, P.x - 320);
  p.safeT = 150;   // 안전지대 표시
  const cx = P.x + P.w/2;   // 다시 시작하는 곳 바로 옆 위험은 치워요
  for(const sp of S.spiders) if(!sp.dead && Math.abs(sp.x - cx) < 130){ sp.dead = true; sp.vy = -2; sp.rot = 0; }
  for(const f of S.fruits) if(f.type === 'poison' && Math.abs(pos(f)[0] - cx) < 130) f.got = true;
  for(const c of S.customs || []) if((c.d.type === 'hazard' || c.d.type === 'enemy') && Math.abs(pos(c)[0] - cx) < 130) c.got = true;
}
function endGame(won){
  S.state = won ? 'win' : 'over';
  S.ride = null; stopRainSound();
  const total = S.score + S.dist;
  let best = 0;
  try{ best = +localStorage.getItem(pk('jungle_best')) || 0; if(total > best){ best = total; localStorage.setItem(pk('jungle_best'), best); } }catch(e){ best = total; }
  S.best = best;
  S.clearTime = S.playTime/60;
  DEX.bestDist = Math.max(DEX.bestDist || 0, S.dist);
  clearSave(); saveDex();
  DEX.ana.runs++; DEX.ana.distSum += S.dist;
  if(won){ unlock('clear1'); if(!S.stats.hits) unlock('nohit'); }
  S.coinBonus = won ? (S.easy ? 30 : 50) : 0;
  S.coinEarned = S.coinCount + S.coinBonus;
  DEX.coins += S.coinEarned; saveDex();
  if(won){
    const before = titleOf(totalClears());
    DEX.clears[S.mode]++;
    const prev = DEX.best[S.mode];
    S.newRecord = !prev || S.clearTime < prev;
    if(S.newRecord) DEX.best[S.mode] = S.clearTime;
    const now = titleOf(totalClears());
    S.newTitle = now !== before ? now : '';
    saveDex();
  }
  bgmStop();
  if(S.duo){
    const d = S.duo;
    d.results[d.idx] = {name:d.names[d.idx], score:total, letters:S.found.filter(Boolean).length, dist:S.dist, time:S.clearTime, clear:won};
    if(!won) sfx.lose();
    setTimeout(() => showScreen(d.idx === 0 ? 'duoNext' : 'duoResult'), won ? 0 : 700);
    return;
  }
  if(won) showScreen('win');
  else { sfx.lose(); setTimeout(() => showScreen('over'), 700); }
}

function drinkPotion(type){
  const was = S.fx[type] > 0;
  S.fx[type] = Math.max(S.fx[type] || 0, POTION_TIME*(1 + 0.02*vit()));   // 활력 1마다 물약 +2%
  if(POTIONS[type].good){ seq([392,523,659,784], 70, 'sine', .06); }
  else { tone(520, .5, 'triangle', .07, 140); }
  if(type === 'fairy' && !was){ const P = S.player; S.fairy = {x:P.x - 20, y:P.y - 30, t:0}; }
  if((type === 'giant' || type === 'power') && !was) seq([196,262,330,392,523], 60, 'square', .04);
  if(type === 'power') S.player.happyT = 60;
}
function updatePotions(k){
  const P = S.player;
  for(const key of Object.keys(S.fx)){
    S.fx[key] -= k;
    if(S.fx[key] <= 0){
      delete S.fx[key];
      floatText(P.x + P.w/2, P.y - 16, `${POTIONS[key].short} 효과 끝`, '#dfe8e0');
      if(key === 'fairy'){ burst(S.fairy.x, S.fairy.y, '#fff3b0', 16, 3); S.fairy = null; }
    }
  }
  if(S.fairy){
    const f = S.fairy; f.t += k;
    const tx = P.x + P.w/2 - P.face*34 + Math.cos(f.t*0.045)*14, ty = P.y - 14 + Math.sin(f.t*0.07)*12;
    f.x += (tx - f.x) * Math.min(1, 0.08*k); f.y += (ty - f.y) * Math.min(1, 0.08*k);
    if(Math.random() < 0.35*k) S.particles.push({x:f.x + rand(-4,4), y:f.y + rand(0,6), vx:rand(-0.4,0.4), vy:rand(0.2,0.9), life:rand(20,34), max:34, color:pick(['#fff3b0','#ffe45c','#ffffff','#ffd1f0']), size:rand(1,2.4)});
  }
  if(S.fx.glow > 0 && Math.random() < 0.25*k)
    S.particles.push({x:P.x + rand(0,P.w), y:P.y + rand(0,P.h), vx:rand(-0.6,0.6), vy:rand(-1.4,-0.4), life:rand(20,35), max:35, color:'#fff6b0', size:rand(1.2,2.6)});
  if(S.fx.slow > 0 && Math.random() < 0.12*k)
    S.particles.push({x:P.x + rand(0,P.w), y:P.y + rand(10,P.h), vx:rand(-0.2,0.2), vy:rand(-0.8,-0.3), life:rand(30,50), max:50, color:'rgba(160,190,80,.8)', size:rand(2,4)});
}

function dayState(){
  const m = Math.max(0, (S.camX + 200)/10), t = (m % DAY_LEN)/DAY_LEN;
  if(t < 0.45) return {dark:0, tint:null};
  if(t < 0.6){ const q = (t-0.45)/0.15; return {dark:q*0.6, tint:[255,120,60, Math.sin(q*Math.PI)*0.22]}; }
  if(t < 0.88) return {dark:0.6, tint:null};
  const q = (t-0.88)/0.12; return {dark:0.6*(1-q), tint:[255,150,190, Math.sin(q*Math.PI)*0.18]};
}
function zoneMix(){
  const m = Math.max(0, (S.camX + 200)/10), zi = Math.floor(m/ZONE_LEN);
  const b = clamp((m % ZONE_LEN - (ZONE_LEN - 40))/40, 0, 1);
  return [zi % ZONES.length, (zi + 1) % ZONES.length, b];
}

function dangerAhead(){
  const P = S.player, cx = P.x + P.w/2, cy = P.y + P.h/2, f = P.face;
  if(P.onGround && P.plat){
    const p = P.plat, edge = f > 0 ? (p.x + p.w) - (P.x + P.w) : P.x - p.x;
    if(edge < 8 || (p.crumble && p.cracked)) return true;
  }
  for(const sp of S.spiders){ if(sp.dead) continue; const dx = (sp.x - cx)*f; if(dx > 0 && dx < 120 && Math.abs(sp.y - cy) < 60) return true; }
  for(const v of S.vines){ if(v.broken) continue; const dx = (v.plat.x + v.ox - cx)*f; if(dx > 0 && dx < 130 && v.plat.y - VINE_GAP > P.y) return true; }
  for(const fr of S.fruits){ if(fr.type !== 'poison' || fr.got) continue; const [x, y] = pos(fr), dx = (x - cx)*f; if(dx > 0 && dx < 70 && Math.abs(y - cy) < 40) return true; }
  return false;
}

function coinChime(x, y){   // 도-레-미-파-솔-라-시-도, 8개마다 옥타브 ↑ + 폭죽
  S.coinChain = S.coinChainT > 0 ? S.coinChain + 1 : 1; S.coinChainT = 45; addTot('coins'); checkCoinLife();
  const idx = (S.coinChain - 1) % 8, oct = Math.min(2, Math.floor((S.coinChain - 1)/8));
  tone(DOREMI[idx]*Math.pow(2, oct), .13, 'square', .035);

    floatText(x, y - 34, `도레미 콤보! +${bonus}`, '#fff3a0');
    setTimeout(() => { const b = DOREMI[0]*Math.pow(2, oct + 1); tone(b,.3,'triangle',.05); tone(b*1.25,.3,'triangle',.04); tone(b*1.5,.3,'triangle',.04); }, 90);

function startChase(){
  S.chase = {startM:S.dist, t:0, phase:'run', gx:-220, endT:0};
  S.banner = {text:'분노한 고릴라다! 달려!', t:0};
  tone(90,.8,'sawtooth',.09,45); setTimeout(() => tone(70,.6,'sawtooth',.08,40), 250);
  S.shake = 14;

function updateChase(k){
  const C = S.chase, P = S.player; C.t += k;
  if(C.phase === 'run'){
    C.gx += (70 - C.gx)*Math.min(1, 0.025*k);
    const sp = Math.min(CHASE_SPEED[S.mode], (S.fx.slow > 0 ? MAXV*0.5 : MAXV)*0.8)*(1 - 0.1*assistLv())*(ACCS.oneHand ? 0.85 : 1);
    S.camX += sp*k;   // 화면이 강제로 앞으로 흐름
    if(Math.floor(C.t/38) !== Math.floor((C.t - k)/38)){ S.shake = Math.max(S.shake, 5); tone(70,.18,'sine',.09,40); }
    if(P.x < S.camX + 40 && !S.ride && !S.swing){   // 잡힘 → 앞으로 내던져짐
      if(!S.easy && P.inv <= 0){ S.hurtCause = 'gorilla'; hurt(); floatText(P.x + P.w/2, P.y - 30, '잡혔다!', '#ff8a80'); }
      P.x = Math.max(P.x, S.camX + 42); P.vx = 9; P.vy = -12; P.launchT = 60; P.boostT = 25; P.onGround = false; P.inv = Math.max(P.inv, 90); S.shake = 12;
    }
    if(S.dist - C.startM >= CHASE_LEN){
      C.phase = 'end'; S.coinCount += 20; P.happyT = 60; addTot('gorilla'); checkCoinLife();
      gainLife(P.x + P.w/2, P.y - 20, '도망 성공! 생명 +1');
      S.banner = {text:'고릴라를 따돌렸다! 생명 +1 · 코인 +20', t:0};
      seq([523,659,784,1047], 90, 'triangle', .06);
    }
  } else {
    C.endT += k; C.gx -= 4*k;
    if(C.endT > 90){ S.chase = null; S.nextChase += CHASE_EVERY; S.chaseWarned = false; }
  }
}
let rainSrc = null, rainGain = null;
function startRainSound(){

  if(Math.random() < 0.006*k){
    const parrot = () => S.animals.push({kind:'parrot', x:S.camX+W+40, y:rand(90,260), base:0, spd:rand(1.6,2.8), t:0, color:pick(['#e53935','#1e88e5','#43a047'])});
    const fly = () => S.animals.push({kind:'butterfly', x:S.camX+rand(150,W), y:rand(120,380), t:rand(0,100), life:0, color:pick(['#ffb300','#42a5f5','#ec407a','#ab47bc'])});
    const bat = () => S.animals.push({kind:'bat', x:S.camX+W+40, y:rand(60,260), t:rand(0,50), spd:rand(2.2,3.2)});
    if(zk === 'volcano' || zk === 'crystal') (Math.random() < 0.7 ? bat : parrot)();
    else if(zk === 'swamp') (Math.random() < 0.6 ? fly : bat)();
    else if(zk === 'snow') parrot();
    else if(zk === 'ruins') (Math.random() < 0.55 ? fly : bat)();
    else if(zk === 'treetop') (Math.random() < 0.65 ? parrot : fly)();
    else (Math.random() < 0.55 ? parrot : fly)();
  }
  if(zk !== 'volcano' && Math.random() < 0.0015*k) S.animals.push({kind:'croc', x:S.camX+W+60, t:0});
  for(const a of S.animals){
    a.t += k;
    if(a.kind === 'parrot'){
      a.x -= a.spd*k;
      if(a.leaving) a.y -= 1.6*k;
      else {
        if(!a.base) a.base = a.y; a.y = a.base + Math.sin(a.t*0.05)*18;
        if(!S.ride && S.state === 'play' && hitCircle(a.x, a.y, 18, 2)){
          S.ride = {t:RIDE_TIME[S.mode], max:RIDE_TIME[S.mode], y:P.y, ty:clamp(a.y + 16, 120, 290), color:a.color};
          a.remove = true; P.jumps = 0; jumpQueued = 0;
          seq([660,880,1100], 60, 'square', .04); floatText(a.x, a.y-30, '앵무새 타기!', '#ffe082');
        }
      }
    }
    else if(a.kind === 'butterfly'){ a.x += (Math.sin(a.t*0.02)*0.9 - 0.2)*k; a.y += Math.cos(a.t*0.027)*0.7*k; a.life += k; }
    else if(a.kind === 'bat'){ a.x -= a.spd*k; a.y += Math.sin(a.t*0.15)*1.6*k; }
    else if(a.kind === 'croc'){ a.x -= 0.5*k; }
  }
  // 꽃잎 · 반딧불이
  if(zk === 'treetop' && Math.random() < 0.12*k)   // 떨어지는 나뭇잎
    S.particles.push({x:S.camX+rand(0,W+200), y:-10, vx:rand(-0.9,-0.3), vy:rand(0.5,1.1), g:0, life:420, max:420, color:pick(['#7fca48','#a8d860','#5aa832']), size:rand(2,3.5)});
  if(zk === 'volcano' && Math.random() < 0.3*k)    // 불티
    S.particles.push({x:S.camX+rand(0,W+100), y:WATER_Y+rand(-5,20), vx:rand(-0.4,0.4), vy:rand(-1.8,-0.6), g:0, life:rand(120,220), max:220, color:pick(['#ffb347','#ff7a2a','#ffe07a']), size:rand(1.2,2.6)});
  if(zk === 'snow' && Math.random() < (LIGHT ? 0.15 : 0.4)*k)   // 눈송이
    S.particles.push({x:S.camX+rand(-50,W+150), y:-10, vx:rand(-0.8,0.2), vy:rand(0.6,1.4), g:0, life:520, max:520, color:'#ffffff', size:rand(1.5,3.2)});
  if(zk === 'swamp' && Math.random() < 0.08*k)   // 늪 거품
    S.particles.push({x:S.camX+rand(0,W), y:WATER_Y+rand(4,30), vx:0, vy:rand(-0.5,-0.2), g:0, life:60, max:60, color:'rgba(200,230,150,.7)', size:rand(2,4)});
  if(zk === 'gold' && Math.random() < 0.1*k)     // 반짝이는 금가루
    S.particles.push({x:S.camX+rand(0,W+100), y:rand(60,420), vx:rand(-0.2,0.2), vy:rand(-0.3,0.1), g:0, life:120, max:120, color:'#ffe07a', size:rand(1.2,2.4)});
  if((zk === 'ruins' || zk === 'crystal') && Math.random() < 0.08*k)     // 떠다니는 빛 먼지
    S.particles.push({x:S.camX+rand(0,W+100), y:rand(150,480), vx:rand(-0.2,0.2), vy:rand(-0.4,-0.1), g:0, life:300, max:300, color:'rgba(200,255,230,.8)', size:rand(1.2,2.2)});
  const night = Math.max(dayState().dark, zk === 'swamp' ? 0.45 : 0);
  if(night > 0.35 && S.flies.length < (LIGHT ? 7 : 18) && Math.random() < 0.1*k) S.flies.push({x:S.camX+rand(0,W+100), y:rand(80,460), t:rand(0,300), a:0});
  for(const f of S.flies){
    f.t += k; f.x += Math.cos(f.t*0.03 + f.y*0.01)*0.6*k; f.y += Math.sin(f.t*0.041)*0.5*k;
    f.a = night > 0.3 ? Math.min(1, f.a + 0.02*k) : f.a - 0.02*k;
  }
  S.flies = S.flies.filter(f => f.a >= 0 && f.x > S.camX - 60);

  // 효과
  updateFx(k);
  if(P.inv > 0) P.inv -= k;
  updatePotions(k);

  // 화면 밖 정리
  const cut = S.camX - 500;
  S.plats = S.plats.filter(p => p.x + p.w > cut && p.y < H + 200);
  S.fruits = S.fruits.filter(f => !f.got && pos(f)[0] > cut && pos(f)[1] < H + 100);
  S.spiders = S.spiders.filter(s => s.x > cut && s.y < H + 60);
  S.chests = S.chests.filter(c => c.plat.x + c.plat.w > cut);
  S.hearts = S.hearts.filter(h => !h.got && pos(h)[0] > cut);
  S.coins = S.coins.filter(c => !c.got && pos(c)[0] > cut && pos(c)[1] < H + 100);
  S.customs = S.customs.filter(c => !c.got && pos(c)[0] > cut);
  S.huts = S.huts.filter(h => h.plat.x + h.plat.w > cut);
  S.vines = S.vines.filter(v => v.plat.x + v.plat.w > cut);
  S.mushrooms = S.mushrooms.filter(m => m.plat.x + m.plat.w > cut);
  S.portals = S.portals.filter(p => p.plat.x + p.plat.w > cut);
  S.swings = S.swings.filter(v => v.ax + v.L > cut);
  S.animals = S.animals.filter(a => !a.remove && pos(a)[0] > S.camX - 200 && !(a.kind==='butterfly' && a.life > 900) && !(a.leaving && a.y < -60));
}

function updateFx(k){
  for(const p of S.particles){ p.x += p.vx*k; p.y += p.vy*k; p.vy += (p.g ?? 0.18)*k; p.life -= k; }
  S.particles = S.particles.filter(p => p.life > 0);
  if(LIGHT && S.particles.length > 90) S.particles.splice(0, S.particles.length - 90);
  for(const t of S.texts){ t.y -= 0.8*k; t.life -= k; }
  S.texts = S.texts.filter(t => t.life > 0);
  S.shake = Math.max(0, S.shake - 0.6*k);
  if(S.toast){ S.toast.t += k; if(S.toast.t > 200) S.toast = null; }
  for(let i=0;i<GOAL;i++) if(S.slotFlash[i] > 0) S.slotFlash[i] -= k;
}

/* ================= 그리기: 배경 ================= */
function layer(par, tile, fn){
  const off = S.camX*par, s = Math.floor(off/tile) - 1, e = s + Math.ceil(W/tile) + 3;
  for(let i=s;i<e;i++) fn(i, i*tile - off);
}
function drawBG(){
  const [a, b, t] = zoneMix();
  drawZone(ZONES[a], 1 - t);
  if(t > 0){ ctx.save(); ctx.globalAlpha = t; drawZone(ZONES[b], t); ctx.restore(); }
}
function drawBackdrop(Z, wgt){
  const img = artBgs[Z.img].img, nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height, ih = H*1.12, iw = nw * ih / nh;   // 아래쪽은 물 뒤로 살짝 숨김
  const off = S.camX*0.12, i0 = Math.floor(off/iw);
  for(let i=i0; i<=i0+2; i++){
    const x = i*iw - off; if(x > W) break;
    if(Math.abs(i) % 2){ ctx.save(); ctx.translate(x + iw, 0); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, iw, ih); ctx.restore(); }
    else ctx.drawImage(img, x, 0, iw, ih);
  }
  ctx.fillStyle = Z.haze; ctx.fillRect(0, 0, W, H);     // 배경은 살짝 뿌옇게 → 게임 발판이 또렷하게 보임
  if(Z.key === 'ruins'){   // 안개 속 빛줄기
    ctx.save(); ctx.globalAlpha *= 0.10; ctx.fillStyle = '#eafff4';
    layer(0.08, 300, (i,x) => { if(hash(i+3) < .4) return; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+50,0); ctx.lineTo(x+210,H); ctx.lineTo(x+130,H); ctx.closePath(); ctx.fill(); });
    ctx.restore();
  }
  if(Z.key === 'volcano'){  // 용암 열기
    const g = ctx.createLinearGradient(0, H*0.55, 0, H);
    g.addColorStop(0, 'rgba(255,120,40,0)'); g.addColorStop(1, `rgba(255,110,30,${0.28 + Math.sin(S.time*0.05)*0.06})`);
    ctx.fillStyle = g; ctx.fillRect(0, H*0.55, W, H*0.45);
    return;
  }
  // 가까운 덩굴 (앞쪽 깊이감)
  if(!LIGHT) layer(0.6, 150, (i,x) => {
    const h = hash(i+200); if(h < (Z.key === 'treetop' ? .35 : .5)) return;
    const len = 60 + h*170, sway = Math.sin(S.time*0.012 + i)*6;
    ctx.strokeStyle = Z.vine; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x+60,0); ctx.quadraticCurveTo(x+60+sway, len*.5, x+60+sway*1.5, len); ctx.stroke();
    let n = 0;
    for(let yy=24; yy<len; yy+=26, n++){
      const lx = x + 60 + sway*(yy/len)*1.5, side = n%2 ? 1 : -1;
      ctx.fillStyle = Z.leaf; ctx.beginPath(); ctx.ellipse(lx+side*6, yy, 7, 3.5, side*0.6, 0, 6.29); ctx.fill();
    }
  });
  if(Z.key === 'lagoon'){   // 폭포 물보라
    ctx.save(); ctx.globalAlpha *= 0.3; ctx.fillStyle = '#ffffff';
    for(let j=0;j<5;j++){ const mx = ((j*230 - S.camX*0.12) % (W+200) + W+200) % (W+200) - 100; ctx.beginPath(); ctx.ellipse(mx, WATER_Y - 14 + Math.sin(S.time*0.05+j)*4, 70, 16, 0, 0, 6.29); ctx.fill(); }
    ctx.restore();
  }
}
function drawZone(Z, wgt){
  const base = ctx.globalAlpha;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,Z.sky[0]); g.addColorStop(.3,Z.sky[1]); g.addColorStop(.7,Z.sky[2]); g.addColorStop(1,Z.sky[3]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const cave = !!Z.cave || Z.key === 'cave', flower = Z.key === 'flower', fall = Z.key === 'waterfall';
  if(Z.img && artBgs[Z.img] && artBgs[Z.img].ok){ drawBackdrop(Z, wgt); return; }

  if(!cave){
    ctx.save(); ctx.globalAlpha = base*.09; ctx.fillStyle = '#fff8d0';
    layer(0.05, 330, (i,x) => {
      if(hash(i+3) < .5) return;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+60,0); ctx.lineTo(x+230,H); ctx.lineTo(x+140,H); ctx.closePath(); ctx.fill();
    });
    ctx.restore();
  }

  // 먼 배경
  ctx.fillStyle = Z.far;
  if(cave){
    layer(0.15, 110, (i,x) => {
      const h = hash(i);
      ctx.beginPath(); ctx.moveTo(x+10,H); ctx.lineTo(x+22,180+h*90); ctx.lineTo(x+46,150+h*70); ctx.lineTo(x+70,190+h*80); ctx.lineTo(x+86,H); ctx.closePath(); ctx.fill();
    });
  } else {
    layer(0.15, 95, (i,x) => {
      const h = hash(i);
      ctx.fillRect(x+40, 150+h*60, 8+h*8, H);
      for(let j=0;j<3;j++){ ctx.beginPath(); ctx.arc(x+44+(hash(i*7+j)-.5)*80, 140+h*60+(hash(i*3+j)-.5)*50, 30+hash(i+j*5)*22, 0, 6.29); ctx.fill(); }
    });
  }

  // 폭포
  if(fall){
    layer(0.25, 520, (i,x) => {
      if(hash(i+13) < .3) return;
      const fx = x + 160, fw = 70 + hash(i+4)*40;
      ctx.fillStyle = '#2d5450'; rr(fx-24, 30, fw+48, H, 14); ctx.fill();
      const wg = ctx.createLinearGradient(0,30,0,WATER_Y);
      wg.addColorStop(0,'rgba(220,245,255,.95)'); wg.addColorStop(1,'rgba(150,220,235,.9)');
      ctx.fillStyle = wg; ctx.fillRect(fx, 40, fw, WATER_Y-40);
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
      for(let j=0;j<8;j++){
        const yy = 40 + ((S.time*5 + j*61 + i*17) % (WATER_Y-80));
        const lx = fx + 6 + ((j*23 + i*7) % Math.max(1, fw-12));
        ctx.beginPath(); ctx.moveTo(lx, yy); ctx.lineTo(lx, yy+26); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      for(let j=0;j<3;j++){ ctx.beginPath(); ctx.ellipse(fx+fw/2+(j-1)*30, WATER_Y-6+Math.sin(S.time*0.1+j)*3, 40, 14, 0, 0, 6.29); ctx.fill(); }
    });
  }

  // 중간 배경
  ctx.fillStyle = Z.mid;
  if(cave){
    layer(0.35, 170, (i,x) => {
      const h = hash(i+50); if(h < .35) return;
      ctx.beginPath(); ctx.moveTo(x+50,H); ctx.lineTo(x+62,80+h*60); ctx.lineTo(x+80,60+h*40); ctx.lineTo(x+98,90+h*50); ctx.lineTo(x+112,H); ctx.closePath(); ctx.fill();
    });
    layer(0.35, 260, (i,x) => {   // 빛나는 수정
      if(hash(i+7) < .35) return;
      const cx = x + 120, cy = 400 + hash(i)*60, hue = hash(i+2) > .5 ? 190 : 280;
      for(let j=0;j<3;j++){
        const hh = 26 + hash(i*3+j)*30, ox = (j-1)*12, tilt = (j-1)*0.3;
        ctx.save(); ctx.translate(cx+ox, cy); ctx.rotate(tilt);
        const cg = ctx.createLinearGradient(0,-hh,0,0);
        cg.addColorStop(0,`hsl(${hue},100%,85%)`); cg.addColorStop(1,`hsl(${hue},70%,45%)`);
        ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(-5,-hh*0.7); ctx.lineTo(0,-hh); ctx.lineTo(5,-hh*0.7); ctx.lineTo(6,0); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      S.lights.push({x:cx, y:cy-20, r:90, s:0.75*wgt});
    });
  } else {
    layer(0.35, 170, (i,x) => {
      const h = hash(i+50); if(h < .3) return;
      ctx.fillStyle = Z.mid;
      ctx.fillRect(x+70, 90+h*40, 16+h*10, H);
      for(let j=0;j<4;j++){ ctx.beginPath(); ctx.arc(x+78+(hash(i*11+j)-.5)*110, 80+h*40+(hash(i*5+j)-.5)*40, 40+hash(i+j*9)*25, 0, 6.29); ctx.fill(); }
      if(flower){
        for(let j=0;j<9;j++){
          ctx.fillStyle = pick2(['#ffd1e6','#ffffff','#ff8fc1','#ffe07a'], i*9+j);
          ctx.beginPath(); ctx.arc(x+78+(hash(i*13+j)-.5)*140, 70+h*40+(hash(i*17+j)-.5)*70, 3+hash(i+j)*4, 0, 6.29); ctx.fill();
        }
      }
    });
  }

  // 위쪽 (잎 천장 / 종유석)
  ctx.fillStyle = Z.canopy;
  if(cave){
    ctx.fillRect(0,0,W,14);
    layer(0.5, 46, (i,x) => { const h = hash(i+99); ctx.beginPath(); ctx.moveTo(x,10); ctx.lineTo(x+46,10); ctx.lineTo(x+23+(h-.5)*10, 30+h*80); ctx.closePath(); ctx.fill(); });
  } else {
    layer(0.5, 60, (i,x) => { const h = hash(i+99); ctx.beginPath(); ctx.arc(x+30, -10+h*20, 38+h*20, 0, 6.29); ctx.fill(); });
  }

  // 덩굴
  if(!cave){
    layer(0.6, 120, (i,x) => {
      const h = hash(i+200); if(h < .4) return;
      const len = 80 + h*230, sway = Math.sin(S.time*0.012 + i)*6;
      ctx.strokeStyle = Z.vine; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x+60,0); ctx.quadraticCurveTo(x+60+sway, len*.5, x+60+sway*1.5, len); ctx.stroke();
      let n = 0;
      for(let yy=30; yy<len; yy+=34, n++){
        const lx = x + 60 + sway*(yy/len)*1.5, side = n%2 ? 1 : -1;
        ctx.fillStyle = Z.leaf; ctx.beginPath(); ctx.ellipse(lx+side*6, yy, 7, 3.5, side*0.6, 0, 6.29); ctx.fill();
        if(flower && n%2){ ctx.fillStyle = '#ff9ec4'; ctx.beginPath(); ctx.arc(lx-side*5, yy+4, 3.2, 0, 6.29); ctx.fill(); }
      }
    });
  }
}
const pick2 = (a, n) => a[Math.floor(hash(n)*a.length)];
function drawWater(){

  ctx.fillStyle = g; ctx.fillRect(0, WATER_Y, W, H-WATER_Y);
  if(Z.lava){
    ctx.strokeStyle = '#fff3a0'; ctx.lineWidth = 2.5; ctx.beginPath();
    for(let x=0;x<=W;x+=8){ const y = WATER_Y + Math.sin((x+S.camX)*0.025 + S.time*0.03)*2.5; x ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
    ctx.stroke();
    layer(1, 70, (i,x) => {   // 부글부글 거품
      const ph = (S.time*0.02 + hash(i)*10) % 1, bx = x + 20 + hash(i+5)*30, by = WATER_Y + 16 + hash(i+2)*22;
      ctx.fillStyle = `rgba(255,240,150,${0.8*(1-ph)})`; ctx.beginPath(); ctx.arc(bx, by - ph*6, 2 + ph*4, 0, 6.29); ctx.fill();
    });
    layer(1, 260, (i,x) => {   // 현무암 바위

      ctx.strokeStyle = '#ff8a2a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(rx - rw*0.5, WATER_Y + 4); ctx.lineTo(rx - 4, WATER_Y - 2); ctx.lineTo(rx + rw*0.4, WATER_Y + 5); ctx.stroke();
    });

  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.5;
  layer(1, 90, (i,x) => { const yy = WATER_Y + 14 + hash(i+3)*22, len = 14 + hash(i)*20, dx = Math.sin(S.time*0.03 + i)*4; ctx.beginPath(); ctx.moveTo(x + 20 + dx, yy); ctx.lineTo(x + 20 + dx + len, yy); ctx.stroke(); });
  if(Z.icy){ layer(1, 200, (i,x) => { if(hash(i+41) < .45) return; ctx.fillStyle = 'rgba(240,250,255,.9)'; ctx.beginPath(); ctx.moveTo(x+60, WATER_Y+4); ctx.lineTo(x+80+hash(i)*30, WATER_Y+1); ctx.lineTo(x+120+hash(i+3)*20, WATER_Y+6); ctx.lineTo(x+90, WATER_Y+10); ctx.closePath(); ctx.fill(); }); return; }
  if(Z.cave) return;
  layer(1, 260, (i,x) => {   // 이끼 낀 바위
    if(hash(i+41) < .45) return;
    const rx = x + 90, rw = 22 + hash(i+9)*18;

    ctx.beginPath(); ctx.ellipse(rx, WATER_Y + 8, rw, 12, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6fbf3a'; ctx.beginPath(); ctx.ellipse(rx - 2, WATER_Y - 2, rw*0.7, 5, 0, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(rx, WATER_Y + 8, rw + 6 + Math.sin(S.time*0.08+i)*2, 4, 0, 0, Math.PI); ctx.stroke();
  });
}
function drawFG(){
  if(LIGHT) return;
  const [a, b, t] = zoneMix(), Z = ZONES[t < 0.5 ? a : b];
  if(Z.lava){   // 검은 바위와 달아오른 가장자리
    layer(1.25, 420, (i,x) => {
      const h = hash(i+777); if(h < .45) return;
      ctx.fillStyle = '#1e1210'; ctx.strokeStyle = '#ff7a2a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x+60,H); ctx.lineTo(x+78,H-38-h*30); ctx.lineTo(x+104,H-26); ctx.lineTo(x+122,H-44-h*10); ctx.lineTo(x+140,H); ctx.closePath(); ctx.fill(); ctx.stroke();
    });
    return;
  }
  layer(1.25, 380, (i,x) => {
    const h = hash(i+777); if(h < .4) return;
    const bx = x + 100;
    for(const [dir, len, col] of [[-1, 70, '#2f8a2e'], [1, 64, '#3fa33a'], [-0.35, 80, '#4cb043'], [0.4, 58, '#2f8a2e']]){
      ctx.save(); ctx.translate(bx, H + 8); ctx.rotate(dir*0.9);
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(6, -len*0.5, 0, -len); ctx.stroke();
      for(let k=10; k<len; k+=9){
        const s = 1 - k/len; ctx.beginPath(); ctx.ellipse(-7*s-2, -k, 8*s+2, 2.6, -0.5, 0, 6.29); ctx.ellipse(7*s+2, -k, 8*s+2, 2.6, 0.5, 0, 6.29); ctx.fill();
      }
      ctx.restore();
    }
    if(h > .6){   // 히비스커스
      const fx = bx + (h - .8)*120, fy = H - 34 - h*20, col = pick2(['#ff4d6d','#ff8a3d','#ff5fa2','#ffd23f'], i);
      ctx.fillStyle = col;
      for(let k=0;k<5;k++){ const an = k*Math.PI*2/5 + h; ctx.beginPath(); ctx.ellipse(fx + Math.cos(an)*7, fy + Math.sin(an)*7, 7, 4.5, an, 0, 6.29); ctx.fill(); }
      ctx.fillStyle = '#ffe07a'; ctx.beginPath(); ctx.arc(fx, fy, 3.2, 0, 6.29); ctx.fill();
    }
  });
}

/* ================= 그리기: 오브젝트 ================= */
function drawPlatform(p){
  let x = p.x - S.camX; const y = p.y, w = p.w;
  if(x > W+20 || x+w < -20 || y > H + 40) return;
  if(p.safeT > 0){   // 안전지대: 초록빛 테두리 + 깃발
    const a = Math.min(1, p.safeT/40);
    ctx.save(); ctx.globalAlpha = a;
    const g = ctx.createLinearGradient(0, y - 60, 0, y + 10); g.addColorStop(0, 'rgba(140,255,160,0)'); g.addColorStop(1, 'rgba(140,255,160,.45)');
    ctx.fillStyle = g; ctx.fillRect(x, y - 60, w, 70);
    ctx.strokeStyle = '#8f6a3a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + w - 20, y - 4); ctx.lineTo(x + w - 20, y - 46); ctx.stroke();
    ctx.fillStyle = '#7dff9a'; ctx.beginPath(); ctx.moveTo(x + w - 19, y - 46); ctx.lineTo(x + w + 6, y - 39); ctx.lineTo(x + w - 19, y - 32); ctx.fill();
    ctx.font = `14px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#eaffef'; ctx.fillText('안전지대', x + w/2, y - 50);
    ctx.restore();
  }
  if(p.crumbleT > 0) x += Math.sin(S.time*1.7)*2.2;
  ctx.save(); ctx.lineJoin = 'round';
  if(p.crumble){
    // 통나무 (밟으면 부서짐)
    const r = 10, cy = y + r;
    const g = ctx.createLinearGradient(0, y, 0, y + 2*r);
    g.addColorStop(0,'#b07a44'); g.addColorStop(.5,'#7d5129'); g.addColorStop(1,'#4c2f17');
    ctx.fillStyle = g; rr(x, y, w, 2*r, r); ctx.fill();
    ctx.strokeStyle = 'rgba(40,22,8,.8)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(50,28,10,.5)'; ctx.lineWidth = 1.5;
    for(let i=0;i<w/22;i++){
      const bx = x + 16 + i*22 + hash(p.seed*40+i)*8; if(bx > x + w - 22) break;
      ctx.beginPath(); ctx.moveTo(bx, y+5); ctx.lineTo(bx+11, y+6); ctx.moveTo(bx+5, y+14); ctx.lineTo(bx+15, y+15); ctx.stroke();
    }
    const ex = x + w - r*0.7;
    ctx.fillStyle = '#dcaa70'; ctx.strokeStyle = 'rgba(40,22,8,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(ex, cy, r*0.7, r, 0, 0, 6.29); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#a8733f'; ctx.lineWidth = 1.2;
    for(const k of [0.62, 0.3]){ ctx.beginPath(); ctx.ellipse(ex, cy, r*0.7*k, r*k, 0, 0, 6.29); ctx.stroke(); }
    ctx.fillStyle = '#7cc242'; for(let i=0;i<3;i++){ const mx = x + w*(0.15 + hash(p.seed*9+i)*0.55); ctx.beginPath(); ctx.ellipse(mx, y+2, 10, 3.5, 0, 0, 6.29); ctx.fill(); }
    ctx.strokeStyle = 'rgba(30,15,5,.85)'; ctx.lineWidth = 1.6;   // 금 간 자국
    for(let i=1;i<4;i++){
      const cx = x + w*i/4 + (hash(p.seed*30+i)-.5)*14;
      ctx.beginPath(); ctx.moveTo(cx, y+1); ctx.lineTo(cx+4, y+7); ctx.lineTo(cx-3, y+13); ctx.lineTo(cx+2, y+19); ctx.stroke();
    }
    ctx.restore(); return;
  }
  const zk = p.zone || 'lagoon';
  if(zk === 'treetop' && !p.amp){   // 나무 발판 (스테이지 2)
    const tw = 16, g = ctx.createLinearGradient(0, y, 0, y + tw);
    g.addColorStop(0,'#b58048'); g.addColorStop(.5,'#8a5a2e'); g.addColorStop(1,'#5e3a1c');
    ctx.fillStyle = g; rr(x, y, w, tw, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(40,22,8,.8)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(50,28,10,.6)'; ctx.lineWidth = 1.5; let k = 0;
    for(let bx = x + 13; bx < x + w - 4; bx += 13, k++){
      ctx.beginPath(); ctx.moveTo(bx, y + 2); ctx.lineTo(bx, y + tw - 2); ctx.stroke();
      if(k % 2 === 0){ ctx.fillStyle = '#3a2412'; ctx.beginPath(); ctx.arc(bx - 6.5, y + 4, 1.1, 0, 6.29); ctx.fill(); }
    }
    ctx.strokeStyle = '#d9b27a'; ctx.lineWidth = 2;   // 밧줄
    ctx.beginPath(); ctx.moveTo(x + 2, y + tw + 1);
    for(let px = x + 2; px < x + w - 2; px += 40){ const nx = Math.min(px + 40, x + w - 2); ctx.quadraticCurveTo((px + nx)/2, y + tw + 8, nx, y + tw + 1); }
    ctx.stroke();
    ctx.fillStyle = '#6fbf3a'; for(let i=0;i<3;i++){ const mx = x + w*(0.12 + hash(p.seed*9+i)*0.76); ctx.beginPath(); ctx.ellipse(mx, y, 8, 3, 0, 0, 6.29); ctx.fill(); }
    ctx.restore(); return;
  }
  const volc = zk === 'volcano', ruin = zk === 'ruins' || zk === 'crystal' || zk === 'gold', snowP = zk === 'snow', goldP = zk === 'gold', crys = zk === 'crystal', swampP = zk === 'swamp';
  const th = 22;
  if(p.amp){   // 떠 있는 돌섬 아랫부분
    ctx.fillStyle = volc ? '#2e2320' : '#5f6150'; ctx.strokeStyle = 'rgba(25,35,25,.65)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x+6, y+th-3); ctx.lineTo(x+w-6, y+th-3); ctx.lineTo(x+w*0.72, y+th+16); ctx.lineTo(x+w*0.52, y+th+26); ctx.lineTo(x+w*0.3, y+th+15); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // 돌판
  const g = ctx.createLinearGradient(0, y, 0, y + th);
  if(volc){ g.addColorStop(0,'#6e5c52'); g.addColorStop(.45,'#4a3c35'); g.addColorStop(1,'#271d1a'); }
  else if(goldP){ g.addColorStop(0,'#f4d27a'); g.addColorStop(.45,'#c9a044'); g.addColorStop(1,'#7a5a1a'); }
  else if(crys){ g.addColorStop(0,'#9aa4c8'); g.addColorStop(.45,'#6a7098'); g.addColorStop(1,'#3a3e60'); }
  else if(snowP){ g.addColorStop(0,'#c8d4e0'); g.addColorStop(.45,'#9aa8b8'); g.addColorStop(1,'#66788a'); }
  else if(swampP){ g.addColorStop(0,'#8a8a6a'); g.addColorStop(.45,'#66664a'); g.addColorStop(1,'#3a3a26'); }
  else if(ruin){ g.addColorStop(0,'#b4bca6'); g.addColorStop(.45,'#8a957e'); g.addColorStop(1,'#5c6652'); }
  else { g.addColorStop(0,'#b9b9a2'); g.addColorStop(.45,'#909179'); g.addColorStop(1,'#62644f'); }
  ctx.fillStyle = g; rr(x, y, w, th, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(25,35,25,.7)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); rr(x, y, w, th, 5); ctx.clip();
  ctx.strokeStyle = 'rgba(40,45,35,.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, y + th*0.55); ctx.lineTo(x + w, y + th*0.55); ctx.stroke();
  for(let row=0; row<2; row++){
    const y0 = row ? y + th*0.55 : y, y1 = row ? y + th : y + th*0.55, shift = row ? 17 : 0;
    for(let bx = x + 30 + shift + hash(p.seed*7+row)*10; bx < x + w - 8; bx += 34){ ctx.beginPath(); ctx.moveTo(bx, y0); ctx.lineTo(bx, y1); ctx.stroke(); }
  }
  ctx.fillStyle = 'rgba(255,255,240,.18)'; ctx.fillRect(x, y+3, w, 2);
  if(S.rain && S.rain.a > 0){ ctx.fillStyle = `rgba(210,235,255,${0.35*S.rain.a})`; ctx.fillRect(x, y + 1, w, 3); }
  if(ruin){   // 새겨진 소용돌이 무늬
    ctx.strokeStyle = 'rgba(230,240,215,.45)'; ctx.lineWidth = 1.3;
    for(let bx = x + 16 + hash(p.seed*3)*20; bx < x + w - 12; bx += 68){ ctx.beginPath(); ctx.arc(bx, y + th*0.3, 3.5, 0, 5); ctx.stroke(); ctx.beginPath(); ctx.arc(bx, y + th*0.3, 1.5, 0, 4.5); ctx.stroke(); }
  }
  if(volc){   // 달아오른 틈
    ctx.strokeStyle = `rgba(255,${130 + Math.sin(S.time*0.08 + p.seed*9)*40|0},40,.9)`; ctx.lineWidth = 1.6;
    for(let i=1;i<=Math.max(1, Math.floor(w/70));i++){
      const cx = x + w*i/(Math.floor(w/70)+1) + (hash(p.seed*21+i)-.5)*16;
      ctx.beginPath(); ctx.moveTo(cx, y + th); ctx.lineTo(cx + 4, y + th*0.6); ctx.lineTo(cx - 3, y + th*0.35); ctx.lineTo(cx + 2, y + 6); ctx.stroke();
    }
  }
  ctx.restore();
  if(volc) S.lights.push({x:x + w/2, y:y + th, r:Math.min(120, w*0.6), s:0.35});
  if(crys) S.lights.push({x:x + w/2, y:y, r:Math.min(110, w*0.55), s:0.3});
  // 이끼
  ctx.fillStyle = snowP ? '#f4f9ff' : crys ? '#7fe0ff' : goldP ? '#e8c860' : volc ? '#4f6a2a' : swampP ? '#6f8f3a' : '#5ea832'; rr(x - 1, y - 4, w + 2, 8, 4); ctx.fill();
  ctx.fillStyle = snowP ? '#ffffff' : crys ? '#c8f4ff' : goldP ? '#fff0a0' : volc ? '#6f8f3a' : swampP ? '#9ab85a' : '#8fd84e';
  for(let i=0;i<w/16;i++){ const mx = x + 6 + i*16 + hash(p.seed*13+i)*6; if(mx > x + w - 4) break; ctx.beginPath(); ctx.ellipse(mx, y - 3, 6, 3, 0, 0, 6.29); ctx.fill(); }
  // 늘어진 이끼
  ctx.strokeStyle = snowP ? '#dff0ff' : crys ? '#7fe0ff' : goldP ? '#c9a044' : volc ? '#4f6a2a' : '#5aa832'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  const n = volc || goldP ? 1 : Math.max(2, Math.floor(w/40));
  for(let i=0;i<n;i++){
    const mx = x + w*(0.08 + hash(p.seed*50+i)*0.84), ml = 8 + hash(p.seed*70+i)*(p.amp ? 34 : 22);
    ctx.beginPath(); ctx.moveTo(mx, y + 2); ctx.quadraticCurveTo(mx + 3, y + 2 + ml*0.6, mx, y + 4 + ml); ctx.stroke();
  }
  ctx.restore();
}

function drawFruit(f){
  let [fx, fy] = pos(f);
  const x = fx - S.camX; if(x < -30 || x > W+30) return;
  const y = fy + Math.sin(S.time*0.08 + f.ox)*3;
  ctx.save(); ctx.translate(x, y);
  if(hasItem(f.type)){
    if(f.type === 'poison' || f.type === 'gold'){   // 위험/보물 표시 빛은 그대로
      const col = f.type === 'poison' ? '140,255,80' : '255,230,90', pulse = 0.45 + Math.sin(S.time*0.12)*0.2;
      const g = ctx.createRadialGradient(0,0,4,0,0,28); g.addColorStop(0,`rgba(${col},${pulse})`); g.addColorStop(1,`rgba(${col},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,28,0,6.29); ctx.fill();
      S.lights.push({x, y, r:f.type === 'gold' ? 60 : 34, s:f.type === 'gold' ? 0.7 : 0.45});
    }
    drawItemImg(f.type, 0, 0, itemSize(f.type));
    ctx.restore(); return;
  }
  switch(f.type){
    case 'banana':
      ctx.rotate(-0.4); ctx.lineCap = 'round';
      ctx.strokeStyle = '#e8b923'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(0,-9,13,0.18*Math.PI,0.82*Math.PI); ctx.stroke();
      ctx.strokeStyle = '#fff09a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0,-9,11,0.3*Math.PI,0.7*Math.PI); ctx.stroke();
      ctx.fillStyle = '#5a3a1e'; ctx.beginPath(); ctx.arc(11,-1,2.2,0,6.29); ctx.fill();
      break;
    case 'cherry':
      ctx.strokeStyle = '#4c7a2a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(-6,1); ctx.moveTo(0,-12); ctx.lineTo(6,1); ctx.stroke();
      ctx.fillStyle = '#5ea83a'; ctx.beginPath(); ctx.ellipse(4,-12,5,2.5,-0.4,0,6.29); ctx.fill();
      for(const cx of [-6,6]){ ctx.fillStyle = '#e0283a'; ctx.beginPath(); ctx.arc(cx,4,6.5,0,6.29); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(cx-2,2,1.8,0,6.29); ctx.fill(); }
      break;
    case 'mango': {
      const g = ctx.createRadialGradient(-4,-4,2,0,0,14); g.addColorStop(0,'#ffd35a'); g.addColorStop(1,'#f06a1d');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0,0,11,13,0.4,0,6.29); ctx.fill();
      ctx.fillStyle = '#4c9a2e'; ctx.beginPath(); ctx.ellipse(6,-13,6,3,-0.5,0,6.29); ctx.fill();
      break; }
    case 'egg':
      ctx.fillStyle = '#8d6e3f'; ctx.beginPath(); ctx.ellipse(0,8,13,5,0,0,Math.PI); ctx.fill();
      ctx.fillStyle = '#fff6e3'; ctx.strokeStyle = 'rgba(120,90,50,.6)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(-4,1,5.5,7.5,-0.2,0,6.29); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(5,2,5,7,0.2,0,6.29); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(-6,-2,1.5,0,6.29); ctx.fill();
      break;
    case 'honey':
      ctx.fillStyle = '#ffb300'; rr(-9,-6,18,17,5); ctx.fill(); ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = '#c8a064'; rr(-10,-11,20,6,2); ctx.fill();
      ctx.fillStyle = '#fff3c4'; ctx.font = `bold 8px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('꿀', 0, 3);
      ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.ellipse(8,10,2,3,0,0,6.29); ctx.fill();
      break;
    case 'coconut':
      ctx.fillStyle = '#6d4c41'; ctx.beginPath(); ctx.arc(0,1,11,0,6.29); ctx.fill();
      ctx.strokeStyle = 'rgba(40,25,15,.5)'; ctx.lineWidth = 1; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(0,1,11-i*0.4,-2.6+i*0.5,-2.2+i*0.5); ctx.stroke(); }
      ctx.fillStyle = '#3e2723'; for(const [dx,dy] of [[-3,-4],[3,-4],[0,0]]){ ctx.beginPath(); ctx.arc(dx,dy,1.6,0,6.29); ctx.fill(); }
      break;
    case 'wheat':
      ctx.strokeStyle = '#b58b2a'; ctx.lineWidth = 1.6;
      for(const a of [-0.35, 0, 0.35]){ ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0,12); ctx.lineTo(0,-10); ctx.stroke();
        ctx.fillStyle = '#e6c35c'; for(let k=0;k<4;k++){ ctx.beginPath(); ctx.ellipse(-2.4,-8+k*4,2,3,-0.5,0,6.29); ctx.ellipse(2.4,-8+k*4,2,3,0.5,0,6.29); ctx.fill(); } ctx.restore(); }
      break;
    case 'apple': {
      const g = ctx.createRadialGradient(-4,-4,2,0,0,14); g.addColorStop(0,'#ff8a80'); g.addColorStop(1,'#c62828');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(-4,2,9,0,6.29); ctx.arc(4,2,9,0,6.29); ctx.fill();
      ctx.strokeStyle = '#6d4c2f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(1,-12); ctx.stroke();
      ctx.fillStyle = '#5ea83a'; ctx.beginPath(); ctx.ellipse(5,-11,5,2.5,-0.4,0,6.29); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(-5,-2,2.2,0,6.29); ctx.fill();

    case 'grape':
      ctx.strokeStyle = '#4c7a2a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(2,-14); ctx.stroke();
      for(const [gx,gy] of [[-6,-5],[0,-5],[6,-5],[-3,1],[3,1],[0,7]]){
        ctx.fillStyle = '#7b3fa0'; ctx.beginPath(); ctx.arc(gx,gy,4.4,0,6.29); ctx.fill();

    case 'strawberry':

      ctx.fillStyle = '#ffe07a'; for(const [sx,sy] of [[-5,-2],[0,-3],[5,-2],[-3,3],[3,3],[0,7],[-6,2],[6,2]]){ ctx.beginPath(); ctx.ellipse(sx,sy,0.9,1.4,0,0,6.29); ctx.fill(); }
      ctx.fillStyle = '#43a047'; for(let i=0;i<5;i++){ ctx.save(); ctx.translate(0,-8); ctx.rotate(-1.2 + i*0.6); ctx.beginPath(); ctx.ellipse(0,-3,2.2,5,0,0,6.29); ctx.fill(); ctx.restore(); }
      break;
    case 'orange': {
      const g = ctx.createRadialGradient(-4,-4,2,0,0,13); g.addColorStop(0,'#ffcc80'); g.addColorStop(1,'#ef6c00');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,1,11,0,6.29); ctx.fill();
      ctx.fillStyle = 'rgba(160,70,0,.35)'; for(const [dx,dy] of [[-4,4],[3,6],[5,-1],[-2,-3]]){ ctx.beginPath(); ctx.arc(dx,dy,0.8,0,6.29); ctx.fill(); }
      ctx.fillStyle = '#4c9a2e'; ctx.beginPath(); ctx.ellipse(4,-10,5,2.3,-0.4,0,6.29); ctx.fill();

      ctx.fillStyle = '#e8f5c8'; ctx.beginPath(); ctx.arc(0,-3,12,0,Math.PI); ctx.closePath(); ctx.fill();

      ctx.fillStyle = '#212121'; for(const [sx,sy] of [[-5,0],[0,2],[5,0],[-2,5],[3,5]]){ ctx.beginPath(); ctx.ellipse(sx,sy,1,1.8,0,0,6.29); ctx.fill(); }

    case 'pineapple': {
      ctx.fillStyle = '#43a047'; for(let i=0;i<5;i++){ ctx.save(); ctx.translate(0,-7); ctx.rotate(-0.8 + i*0.4); ctx.beginPath(); ctx.moveTo(-2,0); ctx.lineTo(0,-10); ctx.lineTo(2,0); ctx.fill(); ctx.restore(); }
      const g = ctx.createRadialGradient(-3,0,2,0,3,13); g.addColorStop(0,'#ffe082'); g.addColorStop(1,'#e0a100');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0,4,8.5,10.5,0,0,6.29); ctx.fill();

      for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(-8,4 + i*4 - 6); ctx.lineTo(8,4 + i*4 + 6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(8,4 + i*4 - 6); ctx.lineTo(-8,4 + i*4 + 6); ctx.stroke(); }

      ctx.fillStyle = '#ff4f9a'; ctx.beginPath(); ctx.ellipse(0,0,12,14,0,0,6.29); ctx.fill();
      ctx.fillStyle = '#7ccf3a';
      for(const [sx,sy,r] of [[-9,-6,-0.8],[9,-4,0.8],[-6,7,-0.5],[7,8,0.5],[0,-14,0]]){
        ctx.save(); ctx.translate(sx,sy); ctx.rotate(r); ctx.beginPath(); ctx.moveTo(-3,2); ctx.lineTo(0,-6); ctx.lineTo(3,2); ctx.fill(); ctx.restore();
      }
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(-4,-4,2.5,0,6.29); ctx.fill();
      break;
    case 'gold': {
      const g0 = ctx.createRadialGradient(0,0,4,0,0,30); g0.addColorStop(0,'rgba(255,230,90,.7)'); g0.addColorStop(1,'rgba(255,230,90,0)');
      ctx.fillStyle = g0; ctx.beginPath(); ctx.arc(0,0,30,0,6.29); ctx.fill();
      const g = ctx.createRadialGradient(-4,-5,2,0,0,15); g.addColorStop(0,'#fff6b0'); g.addColorStop(0.5,'#ffd700'); g.addColorStop(1,'#b8860b');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(-4,1,9,0,6.29); ctx.arc(4,1,9,0,6.29); ctx.fill();
      ctx.fillStyle = '#6b8e23'; ctx.beginPath(); ctx.ellipse(4,-10,5,2.5,-0.5,0,6.29); ctx.fill();
      ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(1,-12); ctx.stroke();
      ctx.fillStyle = '#fff'; starPath(0, 2, 5 + Math.sin(S.time*0.2)*1.5); ctx.fill();
      S.lights.push({x, y, r:60, s:0.7});
      break; }
    case 'poison': {
      const pulse = 0.5 + Math.sin(S.time*0.12)*0.25;
      const g = ctx.createRadialGradient(0,0,4,0,0,26); g.addColorStop(0,`rgba(140,255,80,${pulse})`); g.addColorStop(1,'rgba(140,255,80,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,26,0,6.29); ctx.fill();
      S.lights.push({x, y, r:34, s:0.45});
      ctx.fillStyle = '#4b1d63'; ctx.beginPath(); ctx.ellipse(0,0,12,13,0,0,6.29); ctx.fill();
      ctx.fillStyle = '#7dff4a'; for(const [sx,sy] of [[-7,-5],[8,3],[-5,8]]){ ctx.beginPath(); ctx.arc(sx,sy,1.8,0,6.29); ctx.fill(); }
      ctx.fillStyle = '#f4f4f4'; ctx.beginPath(); ctx.arc(0,-1,5.5,0,6.29); ctx.fill(); ctx.fillRect(-3,3,6,3.5);
      ctx.fillStyle = '#4b1d63'; ctx.beginPath(); ctx.arc(-2.2,-1.5,1.5,0,6.29); ctx.arc(2.2,-1.5,1.5,0,6.29); ctx.fill();
      ctx.fillStyle = '#2e5f14'; ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(4,-18); ctx.lineTo(1,-12); ctx.fill();
      const dy = (S.time*0.4 + f.ox*3) % 18;
      ctx.fillStyle = `rgba(125,255,74,${1-dy/18})`; ctx.beginPath(); ctx.arc(3,13+dy,2,0,6.29); ctx.fill();
      break; }
  }
  ctx.restore();
}

function drawSpider(sp){
  const x = sp.x - S.camX; if(x < -40 || x > W+40) return;
  const y = sp.y;
  if(!sp.dead){
    ctx.strokeStyle = 'rgba(235,235,235,.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x,-5); ctx.lineTo(x,y-12); ctx.stroke();
  }
  ctx.save(); ctx.translate(x,y);
  if(sp.dead){ ctx.rotate(Math.PI + sp.rot); ctx.globalAlpha = 0.8; }
  if(hasItem('spider')){ ctx.rotate(Math.sin(S.time*0.1 + sp.x)*0.12); drawItemImg('spider', 0, 0, itemSize('spider')); ctx.restore(); return; }
  ctx.strokeStyle = '#1b1020'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  for(let i=0;i<4;i++){
    const wig = Math.sin(S.time*0.25 + i)*3, ly = -6 + i*5;
    for(const s of [-1,1]){
      ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(s*14, ly-6+wig); ctx.lineTo(s*20, ly+6+wig*0.5); ctx.stroke();
    }
  }
  ctx.fillStyle = '#1b1020'; ctx.beginPath(); ctx.arc(0,3,11,0,6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-9,7,0,6.29); ctx.fill();
  ctx.fillStyle = '#e02b2b'; ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(4,3); ctx.lineTo(0,8); ctx.lineTo(-4,3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff3b3b'; ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(-2.6,-10,1.8,0,6.29); ctx.arc(2.6,-10,1.8,0,6.29); ctx.fill();
  ctx.restore();
}

function drawChestIcon(x, y, s, filled){
  if(filled && hasItem('chest')){ ctx.save(); ctx.translate(x, y); ctx.scale(s, s); drawItemImg('chest', 18, 14, itemSize('chest')*0.8); ctx.restore(); return; }
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle = filled ? '#8b5a2b' : 'rgba(255,255,255,.18)'; rr(0,10,36,18,3); ctx.fill();
  ctx.fillStyle = filled ? '#6b3f1f' : 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.moveTo(0,12); ctx.quadraticCurveTo(18,-4,36,12); ctx.closePath(); ctx.fill();
  if(filled){
    ctx.fillStyle = '#f2c14e'; ctx.fillRect(0,11,36,3); ctx.fillRect(7,4,3,24); ctx.fillRect(26,4,3,24);

function drawChest(c){
  const x = c.plat.x + c.ox - S.camX, y = c.plat.y - 28;
  if(x < -60 || x > W+60) return;
  const g = ctx.createRadialGradient(x+18,y+14,4,x+18,y+14,48);
  g.addColorStop(0,'rgba(255,220,120,.55)'); g.addColorStop(1,'rgba(255,220,120,0)');
  if(c.got){
    const age = S.time - c.openAt, beam = Math.max(0, 1 - age/90);
    if(beam > 0){
      const bg = ctx.createLinearGradient(0, y-120, 0, y+12);
      bg.addColorStop(0,'rgba(255,255,255,0)'); bg.addColorStop(1, c.potion ? POTIONS[c.potion].color + Math.round(180*beam).toString(16).padStart(2,'0') : `rgba(220,205,255,${0.7*beam})`);
      ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(x+6,y+12); ctx.lineTo(x+30,y+12); ctx.lineTo(x+48,y-120); ctx.lineTo(x-12,y-120); ctx.closePath(); ctx.fill();
    }
    if(c.heart && age < 80){
      const e = ease(age/50);
      ctx.save(); ctx.globalAlpha = Math.min(1, (80-age)/25);
      drawHeartItem(x+18, y - 14 - e*60, 26); ctx.restore();
    }
    if(c.potion && age < 80){
      const e = ease(age/50);
      ctx.save(); ctx.globalAlpha = Math.min(1, (80-age)/25);
      drawPotion(x+18, y+6 - e*60, 1.1, POTIONS[c.potion].color); ctx.restore();
    }
    if(hasItem('chest')){ ctx.save(); ctx.globalAlpha *= 0.55; drawItemImg('chest', x + 18, y + 14, itemSize('chest')); ctx.restore(); return; }
    ctx.fillStyle = '#6b3f1f'; ctx.save(); ctx.translate(x, y+11); ctx.rotate(-0.5);
    rr(0,-12,36,12,4); ctx.fill(); ctx.fillStyle = '#f2c14e'; ctx.fillRect(0,-3,36,3); ctx.restore();
    ctx.fillStyle = '#8b5a2b'; rr(x, y+10, 36, 18, 3); ctx.fill();
    ctx.fillStyle = '#2a1608'; ctx.fillRect(x+3, y+10, 30, 4);
    ctx.fillStyle = '#f2c14e'; ctx.fillRect(x+7, y+10, 3, 18); ctx.fillRect(x+26, y+10, 3, 18);
    return;
  }
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x+18,y+14,48,0,6.29); ctx.fill();
  drawChestIcon(x, y, 1, true);
  S.lights.push({x:x+18, y:y+14, r:80, s:0.8});
  for(let i=0;i<3;i++){
    const a = S.time*0.04 + i*2.1, sx = x+18+Math.cos(a)*28, sy = y+10+Math.sin(a)*16, s = 3 + Math.sin(S.time*0.2+i)*1.5;
    ctx.fillStyle = '#fff6c0'; ctx.beginPath();
    ctx.moveTo(sx,sy-s); ctx.lineTo(sx+s*0.35,sy); ctx.lineTo(sx,sy+s); ctx.lineTo(sx-s*0.35,sy); ctx.closePath(); ctx.fill();
  }
}
function drawHeartItem(cx, top, s){   // 줍는 하트 (위쪽 가운데 기준)

  ctx.save(); ctx.fillStyle = '#ff4d6d'; ctx.shadowColor = '#ff8fa3'; ctx.shadowBlur = 12; heartPath(cx, top, s); ctx.fill(); ctx.restore();
}
function drawHeartPickup(h){

function drawAnimal(a){
  const [ax, ay] = pos(a), x = ax - S.camX;
  if(x < -60 || x > W+60) return;
  ctx.save();
  if(a.kind === 'monkey'){
    const P = S.player, near = Math.abs(P.x - ax) < 160;
    const hop = near ? -Math.abs(Math.sin(a.t*0.15))*10 : 0;
    ctx.translate(x, ay+hop); ctx.scale(near ? (P.x < ax ? -1 : 1) : a.flip, 1);
    ctx.strokeStyle = '#6b3f1f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8,-8); ctx.bezierCurveTo(-26,-6,-26,-34,-14,-32); ctx.stroke();
    ctx.fillStyle = '#7a4a24'; ctx.beginPath(); ctx.ellipse(0,-13,11,13,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#d8a878'; ctx.beginPath(); ctx.ellipse(1,-11,6,8,0,0,6.29); ctx.fill();
    const wave = near ? Math.sin(a.t*0.3)*0.6 : 0.2;
    ctx.save(); ctx.translate(8,-18); ctx.rotate(-1.2 - wave); ctx.fillStyle = '#7a4a24'; ctx.fillRect(-2,0,4,13); ctx.restore();
    ctx.fillStyle = '#7a4a24'; ctx.beginPath(); ctx.arc(0,-32,10,0,6.29); ctx.arc(-10,-32,4,0,6.29); ctx.arc(10,-32,4,0,6.29); ctx.fill();
    ctx.fillStyle = '#e7c095'; ctx.beginPath(); ctx.ellipse(1,-30,7,6,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#2a1a0e'; ctx.beginPath(); ctx.arc(-2,-32,1.6,0,6.29); ctx.arc(4,-32,1.6,0,6.29); ctx.fill();
    ctx.strokeStyle = '#2a1a0e'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(1,-28,2.5,0.2,Math.PI-0.2); ctx.stroke();
  } else if(a.kind === 'toucan'){
    ctx.translate(x, ay); ctx.scale(a.flip, 1);
    const bob = Math.sin(a.t*0.05)*1.5;
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.moveTo(-6,-6); ctx.lineTo(-16,2); ctx.lineTo(-4,-2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-14+bob,9,13,0.15,0,6.29); ctx.fill();
    ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.ellipse(4,-19+bob,5,6,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#ff8c1a'; ctx.beginPath(); ctx.ellipse(14,-23+bob,11,4.5,0.1,0,6.29); ctx.fill();
    ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(24,-22+bob,2.5,0,6.29); ctx.fill();
    ctx.fillStyle = '#4fc3f7'; ctx.beginPath(); ctx.arc(3,-24+bob,3,0,6.29); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(3.5,-24+bob,1.4,0,6.29); ctx.fill();
    ctx.fillStyle = '#ff8c1a'; ctx.fillRect(-3,-2,2,3); ctx.fillRect(2,-2,2,3);
  } else if(a.kind === 'frog'){
    const ph = a.t % 150, hop = ph < 20 ? -Math.sin(ph/20*Math.PI)*18 : 0;
    ctx.translate(x, ay+hop); ctx.scale(a.flip, 1);
    ctx.fillStyle = '#3e9b3f'; ctx.beginPath(); ctx.ellipse(-7,-3,6,3,0,0,6.29); ctx.ellipse(7,-3,6,3,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.ellipse(0,-8,12,8,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#ffe082'; ctx.beginPath(); ctx.ellipse(0,-5,7,4,0,0,6.29); ctx.fill();
    for(const ex of [-5,5]){ ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.arc(ex,-15,4,0,6.29); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex,-15.5,2.6,0,6.29); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex+0.6,-15.5,1.3,0,6.29); ctx.fill(); }
  } else if(a.kind === 'parrot'){
    ctx.translate(x, ay); if(a.spd < 0) ctx.scale(-1, 1);
    drawParrotShape(a.color, a.t);
  } else if(a.kind === 'bat'){
    ctx.translate(x, ay);
    const fl = Math.sin(a.t*0.5);
    ctx.fillStyle = '#231a33';
    for(const d of [-1,1]){ ctx.beginPath(); ctx.moveTo(0,-2); ctx.quadraticCurveTo(d*10,-12*fl-4,d*20,-8*fl); ctx.lineTo(d*16,-2*fl+2); ctx.lineTo(d*11,-3*fl+4); ctx.lineTo(d*6,2); ctx.closePath(); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(0,0,5,7,0,0,6.29); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4,-5); ctx.lineTo(-3,-11); ctx.lineTo(-1,-6); ctx.moveTo(4,-5); ctx.lineTo(3,-11); ctx.lineTo(1,-6); ctx.fill();
    ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.arc(-2,-3,1.2,0,6.29); ctx.arc(2,-3,1.2,0,6.29); ctx.fill();
  } else if(a.kind === 'butterfly'){
    ctx.translate(x, ay);
    const f = Math.abs(Math.sin(a.t*0.3))*0.8 + 0.2;
    ctx.fillStyle = a.color;
    ctx.save(); ctx.scale(f,1);
    ctx.beginPath(); ctx.ellipse(-6,-4,6,7,-0.4,0,6.29); ctx.ellipse(6,-4,6,7,0.4,0,6.29); ctx.fill();
    ctx.globalAlpha = .75; ctx.beginPath(); ctx.ellipse(-4,5,4,5,0.3,0,6.29); ctx.ellipse(4,5,4,5,-0.3,0,6.29); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#2a1a0e'; ctx.fillRect(-1,-7,2,14);
  }
  ctx.restore();
}
function drawParrotShape(color, t){
  const flap = Math.sin(t*0.4);
  ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(34,3); ctx.lineTo(10,4); ctx.fill();
  ctx.fillStyle = '#1e88e5'; ctx.beginPath(); ctx.moveTo(10,-1); ctx.lineTo(32,-2); ctx.lineTo(10,2); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(0,0,14,7,0,0,6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(-12,-3,6.5,0,6.29); ctx.fill();
  ctx.fillStyle = '#f5e6c8'; ctx.beginPath(); ctx.moveTo(-17,-5); ctx.quadraticCurveTo(-24,-3,-18,1); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-13,-4,1.4,0,6.29); ctx.fill();
  ctx.save(); ctx.scale(1, flap); ctx.fillStyle = color === '#e53935' ? '#1e88e5' : '#ffd54f';
  ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(6,-18); ctx.lineTo(10,0); ctx.fill(); ctx.restore();
}
function drawCroc(a){
  const x = a.x - S.camX; if(x < -80 || x > W+80) return;
  const y = WATER_Y + 4 + Math.sin(a.t*0.05)*1.5;
  ctx.fillStyle = '#35642f';
  ctx.beginPath(); ctx.ellipse(x,y,26,6,0,Math.PI,0); ctx.fill();
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(x+30+i*14, y+1, 4, Math.PI, 0); ctx.fill(); }
  for(const ex of [x-4,x+8]){
    ctx.fillStyle = '#35642f'; ctx.beginPath(); ctx.arc(ex,y-5,5,0,6.29); ctx.fill();
    ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(ex,y-6,3,0,6.29); ctx.fill();
    ctx.fillStyle = '#111'; ctx.fillRect(ex-0.6,y-8.5,1.2,5);
  }
}

function drawFace(m){
  ctx.fillStyle = '#222'; ctx.strokeStyle = '#222'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  if(m === 'happy'){
    ctx.beginPath(); ctx.arc(5,9,2.2,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
    ctx.fillStyle = '#b3403a'; ctx.beginPath(); ctx.arc(5,11.4,3,0,Math.PI); ctx.fill();
  } else if(m === 'scared'){
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5,7.6,2.9,0,6.29); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(5.9,7.6,1.3,0,6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5,12.6,1.3,1.7,0,0,6.29); ctx.stroke();
    ctx.fillStyle = '#9ad8ff'; ctx.beginPath(); ctx.moveTo(-6,-1); ctx.quadraticCurveTo(-9,4,-6,5); ctx.quadraticCurveTo(-3,4,-6,-1); ctx.fill();
  } else if(m === 'hurt'){
    ctx.beginPath(); ctx.moveTo(3.4,6.4); ctx.lineTo(6.6,9.6); ctx.moveTo(6.6,6.4); ctx.lineTo(3.4,9.6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2.5,12.5); ctx.lineTo(4,11.5); ctx.lineTo(5.5,12.5); ctx.lineTo(7,11.5); ctx.stroke();
  } else if(m === 'dizzy'){
    ctx.beginPath(); ctx.arc(5,8,2.4,0,5.2); ctx.stroke(); ctx.beginPath(); ctx.arc(5,8,1,0,4.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2.5,12.5); ctx.quadraticCurveTo(4,11,5.5,12.5); ctx.quadraticCurveTo(7,14,8,12); ctx.stroke();
  } else if(m === 'glide'){
    ctx.beginPath(); ctx.moveTo(3.2,8.3); ctx.lineTo(6.8,7.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3,11.8); ctx.lineTo(6.8,11.3); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(5,8,1.6,0,6.29); ctx.fill();
    ctx.strokeStyle = '#8a4a2a'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(4,10,3,0.3,1.6); ctx.stroke();

function drawHero(L, run, air, mood){
  // 꼬리
  if(L.tail === 'monkey'){ ctx.strokeStyle = '#6b3f1f'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-8,25); ctx.bezierCurveTo(-24,27,-26,6,-14,7); ctx.stroke(); }
  if(L.tail === 'tiger'){
    ctx.strokeStyle = L.body; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-8,26); ctx.quadraticCurveTo(-22,24,-21,10); ctx.stroke();
    ctx.strokeStyle = '#2a1a0e'; ctx.lineWidth = 1.6; for(const [x,y] of [[-16,23],[-20,17],[-21,12]]){ ctx.beginPath(); ctx.moveTo(x-2,y-1); ctx.lineTo(x+2,y+1); ctx.stroke(); }
  }
  // 다리
  const leg = (tx, rot) => {
    ctx.save(); ctx.translate(tx,30); ctx.rotate(rot);
    ctx.fillStyle = L.leg; ctx.fillRect(-3,0,7,12);
    ctx.fillStyle = L.boot;
    if(L.fins){ ctx.beginPath(); ctx.ellipse(5,13,8,2.6,0,0,6.29); ctx.fill(); } else ctx.fillRect(-3,10,10,4);
    ctx.restore();
  };
  leg(-4, air ? 0.5 : run*0.6);
  leg(4, air ? -0.3 : -run*0.6);
  // 가방 / 산소통
  ctx.fillStyle = L.pack;
  if(L.tank){ rr(-17,10,8,19,4); ctx.fill(); ctx.fillStyle = '#9e9e9e'; ctx.fillRect(-15,7,4,4); }
  else { rr(-15,14,9,15,3); ctx.fill(); }
  // 몸

function drawPlayer(){
  const P = S.player;
  ctx.save();

  const skin = effectiveSkin();
  const imgSkin = skin === 'custom' || (skin === 'explorer' && artRun.ok) || (skin === 'pixel' && artPixelRun.ok);
  if(imgSkin){
    const pic = skin === 'custom' ? ((!P.onGround && heroJump.ok) ? heroJump : hero)
              : skin === 'pixel' ? ((!P.onGround && artPixelJump.ok) ? artPixelJump : artPixelRun)
              : ((!P.onGround && artJump.ok) ? artJump : artRun);
    const img = pic.img, h = heroHeight, w = h * img.naturalWidth / img.naturalHeight;
    const moving = P.onGround && Math.abs(P.vx) > 0.4;
    const bob = moving ? -Math.abs(Math.sin(P.anim))*4 : 0;
    const tilt = moving ? Math.sin(P.anim)*0.06 : (!P.onGround ? -0.08*Math.sign(P.vy) : 0);
    ctx.translate(P.x - S.camX + P.w/2, P.y + P.h + bob);
    ctx.scale(P.face, 1); ctx.rotate(tilt);
    if(P.onGround){ ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, -bob, w*0.35, 3, 0, 0, 6.29); ctx.fill(); }
    ctx.drawImage(img, -w/2, -h, w, h);
    ctx.restore();
    return;
  }
  ctx.translate(P.x - S.camX + P.w/2, P.y); ctx.scale(P.face, 1);
  const run = P.onGround ? Math.sin(P.anim) : 0, air = !P.onGround;
  drawHero(SKIN_LOOK[skin] || SKIN_LOOK.explorer, run, air, P.mood || 'normal');

}

function giantScale(){
  const l = Math.max(S.fx.giant || 0, S.fx.power || 0); if(!l) return 1;

const shade = document.createElement('canvas'); shade.width = W; shade.height = H;
const sctx = shade.getContext('2d');
function applyNight(){
  const ds = dayState(), [a, b, t] = zoneMix();
  const zd = ZONES[a].dark*(1-t) + ZONES[b].dark*t;
  const dark = Math.min(0.8, 1 - (1 - ds.dark)*(1 - zd)*(1 - (S.rain ? 0.15*S.rain.a : 0)));
  if(ds.tint){ ctx.fillStyle = `rgba(${ds.tint[0]},${ds.tint[1]},${ds.tint[2]},${ds.tint[3]})`; ctx.fillRect(0,0,W,H); }
  if(dark < 0.02) return 0;
  const sc = LIGHT ? 0.5 : 1;
  if(shade.width !== W*sc){ shade.width = W*sc; shade.height = H*sc; }
  sctx.setTransform(sc, 0, 0, sc, 0, 0);
  sctx.globalCompositeOperation = 'source-over';
  sctx.clearRect(0,0,W,H);
  sctx.fillStyle = `rgba(6,8,34,${dark})`; sctx.fillRect(0,0,W,H);
  sctx.globalCompositeOperation = 'destination-out';
  for(const L of S.lights){
    if(L.s <= 0 || L.x < -L.r || L.x > W + L.r) continue;
    const g = sctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
    g.addColorStop(0, `rgba(0,0,0,${Math.min(1, L.s)})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    sctx.fillStyle = g; sctx.beginPath(); sctx.arc(L.x, L.y, L.r, 0, 6.29); sctx.fill();
  }
  ctx.drawImage(shade, 0, 0, W, H);
  return dark;
}
function drawGuide(){
  if(S.state !== 'play') return;

  for(const c of S.chests){ if(!c.got && c.plat.x + c.ox > S.camX - 20 && (!next || c.plat.x + c.ox < next.plat.x + next.ox)) next = c; }
  if(!next) return;
  const cx = next.plat.x + next.ox - S.camX + 18, cy = next.plat.y - 28;
  ctx.save();
  if(cx > W - 30){
    const y = clamp(cy, 130, H - 120), bob = Math.sin(S.time*0.12)*4;
    ctx.fillStyle = 'rgba(8,30,22,.6)'; ctx.beginPath(); ctx.arc(W - 40 + bob, y, 24, 0, 6.29); ctx.fill();

    ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.moveTo(W - 10 + bob, y); ctx.lineTo(W - 18 + bob, y - 8); ctx.lineTo(W - 18 + bob, y + 8); ctx.fill();
    ctx.font = `13px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff6dc';
    ctx.fillText(`${Math.max(1, Math.round((next.plat.x + next.ox - S.player.x)/10))}m`, W - 40 + bob, y + 38);
  } else {
    const bob = Math.abs(Math.sin(S.time*0.1))*8;
    ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.moveTo(cx, cy - 18 - bob); ctx.lineTo(cx - 9, cy - 32 - bob); ctx.lineTo(cx + 9, cy - 32 - bob); ctx.fill();
  }

}
function drawBanner(){

      <h3>황금 열매 · 코인</h3><p>황금 열매를 먹으면 10초 동안 커지고, 부딪히는 장애물을 부수고, 열매와 코인을 끌어당겨요. 코인을 모아 옷장에서 캐릭터·잔상·파트너를 살 수 있어요.</p>
      <h3>정글의 장치들</h3><p>빨간 점프 버섯은 아주 높이 튕겨 줘요(하늘에 코인이 있어요). 공중의 줄타기 덩굴에 닿으면 매달리고, 앞으로 크게 흔들릴 때 점프하면 멀리 날아가요. 무지개 포탈은 10초 동안 코인과 열매가 쏟아지는 비밀 동굴로 이어져요. 코인을 연달아 먹으면 도레미 음이 올라가고, 8개째마다 폭죽 보너스!</p>
      <h3>조심! 추격전과 소나기</h3><p>900m쯤에서 분노한 고릴라가 쫓아와요. 화면이 저절로 흘러가니 뒤처지지 말고 달려요. 소나기가 오면 발판이 미끄러워져 잘 멈추지 않아요.</p>
      <h3>마지막 관문</h3><p>글자 11개를 모두 모으면 화산의 결투장에서 고릴라 대장이 나타나요. 돌진(!), 점프 충격파, 떨어지는 바위를 피하면서 머리를 3번 밟으면 이겨요.</p>
      <h3>더 즐기기</h3><p>연습하기로 기술을 익히고, 오늘의 도전은 모두 같은 맵에서 매일 다른 목표에 도전해요. 2인 대결은 한 기기로 번갈아 같은 맵을 달려 점수를 겨뤄요. 게임 중 나가도 이어하기로 다시 시작할 수 있어요.</p>
      <h3>내 아이템</h3><p>시작 화면의 '내 아이템'에서 직접 그린 PNG로 새 아이템을 만들 수 있어요. 점수 열매, 코인 주머니, 생명, 마법 효과, 함정, 움직이는 적, 점프대 중에서 능력을 고르고, 얼마나 자주 나올지도 정해요.</p>
      <h3>로비</h3><p>로비에서 걸어 다니며 방에 들어가요. 정글 점프, 바리스타 체험실(과일 음료 → 활력), 요리 체험실(요리 → 아이템), 동아리실(리듬 게임 → 배경음악·물약)이 있어요. 정글에서 모은 과일과 재료는 로비의 방에서 써요.</p>
      <h3>동아리실</h3><p>리듬 게임으로 동요를 연주하고, 정글 배경음악으로 등록하거나 물약으로 바꿔요.</p>
      <h3>파트너</h3><p>파트너가 옆을 따라다니며 높은 곳의 보너스 코인을 알려주고, 물에 빠지기 직전 한 번 구해줘요.</p>
      <h3>이렇게 해봐요</h3><p>독거미는 위에서 밟으면 물리칠 수 있어요. 날아오는 앵무새에 닿으면 잠깐 타고 날아가요(점프하면 내려요). 오른쪽 끝 화살표가 다음 보물상자를 알려줘요.</p>
      <h3>물약 (10초)</h3><p>체공: 천천히 떨어짐 · 빛: 몸이 빛나 어둠을 밝힘 · 요정: 요정이 따라다님 · 자석: 열매가 끌려옴 · 거인: 커지고 한 번 막아줌, 거미를 부딪혀 물리침 · 느림보: 느려짐 · 혼란: 좌우가 바뀜</p>
      <h3>스테이지</h3><p>500m마다 스테이지 1 폭포 정글 → 2 나무 위 마을 → 3 고대 유적 → 4 화산 지대로 바뀌어요. 화산 지대는 물 대신 용암이 흘러요. 달릴수록 낮·노을·밤도 찾아와요.</p>

let settingsFrom = 'title', DUO = null;

function wireMyItems(){

    on('lnGive', () => {
      const cu = L.cust, ok = L.tray.length === cu.n && L.tray.every(t => t === cu.want);
      if(!L.tray.length){ const m = g('msg'); if(m) m.textContent = '먼저 바구니에서 과일을 골라요'; return; }
