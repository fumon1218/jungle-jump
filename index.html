<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="mobile-web-app-capable" content="yes">

<title>정글 점프 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --leaf:#1f5e43; --deep:#07190f; --moss:#4f8a2e; --gold:#f2c14e; --fruit:#ff8c1a; --cream:#fff6dc;
    --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--deep);overflow:hidden;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--font);color:var(--cream);
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
  #wrap{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
    width:min(100vw,177.78dvh);height:min(56.25vw,100dvh)}
  canvas{display:block;width:100%;height:100%;border-radius:10px;box-shadow:0 0 0 2px #2c5a3c, 0 20px 60px rgba(0,0,0,.6)}

  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(7,25,15,.74), rgba(7,25,15,.92));border-radius:10px}
  #overlay.show{display:flex}
  .card{width:min(90%,620px);max-height:100%;overflow:auto;text-align:center;padding:clamp(14px,3.5vw,32px);touch-action:pan-y}
  button, input, .item, .seg button{touch-action:manipulation}
  canvas, #tapzone, #touch, #touch *, #topBtns, #topBtns *{touch-action:none}
  .btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  button.go.alt{background:#5ea83a;color:#fff;box-shadow:0 5px 0 #2f6b1c}
  button.go.alt:active{box-shadow:0 1px 0 #2f6b1c}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.6vw,16px);margin:.8em 0}
  .slot{background:rgba(255,246,220,.08);border:2px solid rgba(255,246,220,.2);border-radius:14px;padding:clamp(8px,1.4vw,14px) 6px}
  .slot b{display:block;font-weight:400;font-size:clamp(13px,1.9vw,18px);margin:.3em 0 .1em}
  .slot small{display:block;opacity:.7;font-size:clamp(10px,1.4vw,13px);min-height:1.3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thumb{height:clamp(54px,9vw,96px);display:flex;align-items:flex-end;justify-content:center;
    background:linear-gradient(transparent 82%, #6b4424 82%, #5a3a1e);border-radius:8px}
  .thumb img{max-height:92%;max-width:90%;object-fit:contain}
  .thumb .note{font-size:clamp(30px,5vw,52px);align-self:center;color:var(--gold)}
  .thumb .none{align-self:center;opacity:.55;font-size:clamp(11px,1.6vw,14px)}
  .sbtn{font-family:var(--font);font-size:clamp(11px,1.6vw,15px);border:0;border-radius:999px;padding:.35em .8em;margin:.35em .15em 0;cursor:pointer;
    background:var(--gold);color:#4a2a10}
  .sbtn.ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(255,246,220,.45)}
  .opts{display:flex;flex-wrap:wrap;gap:.5em 1.4em;justify-content:center;align-items:center;font-size:clamp(12px,1.8vw,16px)}
  .opts input[type=range]{width:clamp(90px,16vw,160px);accent-color:#f2c14e;vertical-align:middle}
  .opts input[type=checkbox]{accent-color:#f2c14e;width:1.1em;height:1.1em;vertical-align:middle}
  #msg{min-height:1.4em;color:#b8ff7a}
  .modes{display:inline-flex;margin:.5em 0 .2em;border-radius:999px;background:rgba(255,246,220,.1);padding:4px}
  .modes button{font-family:var(--font);font-size:clamp(14px,2.2vw,20px);border:0;border-radius:999px;padding:.3em 1.2em;cursor:pointer;background:transparent;color:var(--cream)}
  .modes button.on{background:var(--gold);color:#4a2a10}
  .badge{display:inline-block;margin:.1em 0 .3em;padding:.2em .9em;border-radius:999px;background:rgba(242,193,78,.18);border:1.5px solid var(--gold);color:var(--gold);font-size:clamp(12px,1.9vw,17px)}
  button.go.sm{font-size:clamp(14px,2.2vw,20px);padding:.4em 1em}
  .help{text-align:left;margin:.4em auto;max-width:34em}
  .help h3{margin:.7em 0 .15em;font-weight:400;color:var(--gold);font-size:clamp(14px,2.2vw,20px)}
  .help p{margin:.15em 0;font-size:clamp(12px,1.8vw,16px)}
  .dexcell{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
  .dexcell small{font-size:clamp(10px,1.5vw,13px);opacity:.8}
  .rec{color:#b8ff7a}
  .coins{color:#ffe07a;font-size:clamp(14px,2.2vw,20px);margin:.2em 0}
  .wtitle{margin:.8em 0 .35em;font-weight:400;color:var(--gold);font-size:clamp(15px,2.3vw,21px);text-align:left}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(78px,13vw,110px),1fr));gap:8px}
  .item{background:rgba(255,246,220,.08);border:2px solid transparent;border-radius:12px;padding:8px 4px 6px}
  .item.eq{border-color:var(--gold);background:rgba(242,193,78,.14)}
  .item .ic{display:block;font-size:clamp(24px,4vw,34px);line-height:1.2}
  .item b{display:block;font-weight:400;font-size:clamp(11px,1.7vw,14px);margin:.2em 0}
  .item button{font-family:var(--font);font-size:clamp(10px,1.5vw,13px);border:0;border-radius:999px;padding:.3em .7em;cursor:pointer;background:var(--gold);color:#4a2a10}
  .item button:disabled{background:rgba(255,246,220,.15);color:rgba(255,246,220,.6);cursor:default}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:1em;margin:.45em auto;max-width:30em;font-size:clamp(13px,2vw,17px);text-align:left}
  .setrow input[type=range]{width:clamp(110px,24vw,220px);accent-color:#f2c14e}
  .setrow input[type=checkbox]{width:1.3em;height:1.3em;accent-color:#f2c14e}
  .seg{display:inline-flex;border-radius:999px;background:rgba(255,246,220,.1);padding:3px}
  .seg button{font-family:var(--font);font-size:clamp(12px,1.8vw,15px);border:0;border-radius:999px;padding:.25em .9em;cursor:pointer;background:transparent;color:var(--cream)}
  .seg button.on{background:var(--gold);color:#4a2a10}
  .stat{max-width:30em;margin:.3em auto;text-align:left;font-size:clamp(12px,1.8vw,15px)}
  .bar{display:flex;align-items:center;gap:.5em;margin:.2em 0}
  .bar i{display:block;height:10px;border-radius:5px;background:#ff8a80;min-width:3px}
  .rank{width:100%;max-width:30em;margin:.4em auto;border-collapse:collapse;font-size:clamp(12px,1.9vw,16px)}
  .rank td,.rank th{padding:.3em .4em;border-bottom:1px solid rgba(255,246,220,.15);font-weight:400}
  .rank th{color:var(--gold)}
  .namein{font-family:var(--font);font-size:clamp(14px,2.2vw,18px);padding:.35em .7em;border-radius:10px;border:2px solid rgba(255,246,220,.4);background:rgba(0,0,0,.25);color:var(--cream);width:10em;text-align:center}
  .achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(90px,15vw,130px),1fr));gap:8px;margin:.5em 0}
  .ach{background:rgba(255,246,220,.08);border-radius:12px;padding:8px 4px;opacity:.45}
  .ach.on{opacity:1;background:rgba(242,193,78,.16);border:1.5px solid var(--gold)}
  .ach .ic{font-size:clamp(22px,3.6vw,30px)} .ach b{display:block;font-weight:400;font-size:clamp(11px,1.6vw,14px)} .ach small{display:block;font-size:clamp(9px,1.3vw,11px);opacity:.8}
  .card.learnc{width:min(96%,760px)}
  .titletop{display:flex;justify-content:center;gap:.5em;flex-wrap:wrap;margin-bottom:.2em}
  .profchip small{font-size:.72em;opacity:.8;margin-right:.1em} .profchip em{font-style:normal;font-size:.78em;color:#ffe07a;margin-left:.3em}
  .teachchip{background:rgba(46,125,50,.45)!important;border-color:rgba(184,255,122,.6)!important}
  @media (max-height:520px){ #card.titlec h1{font-size:clamp(28px,8vh,44px);margin:.05em 0} #card.titlec > p:not(.keys){display:none} #card.titlec .keys{margin:.1em 0} #card.titlec .startbig{padding:.3em 1.4em!important} }
  .profchip{font-family:var(--font);font-size:clamp(14px,2.2vw,18px);border:2px solid rgba(255,246,220,.4);border-radius:999px;background:rgba(0,0,0,.25);color:var(--cream);padding:.25em 1em;cursor:pointer;margin-bottom:.3em}
  .profs{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(100px,17vw,140px),1fr));gap:10px;margin:.6em 0}
  .prof{font-family:var(--font);border:3px solid rgba(255,246,220,.3);border-radius:18px;background:rgba(255,246,220,.08);color:var(--cream);padding:10px 4px;cursor:pointer}
  .prof.on{border-color:var(--gold);background:rgba(242,193,78,.18)} .prof.add{border-style:dashed}
  .prof span{display:block;font-size:clamp(38px,7vw,52px)} .prof b{display:block;font-weight:400;font-size:clamp(15px,2.4vw,19px)} .prof small{display:block;font-size:11px;opacity:.7}
  .iconpick{display:flex;flex-wrap:wrap;justify-content:center;gap:6px} .ip{font-size:32px;width:56px;height:56px;border-radius:14px;border:2px solid transparent;background:rgba(255,246,220,.08);cursor:pointer}
  .ip.on{border-color:var(--gold);background:rgba(242,193,78,.25)}
  .pindots{display:flex;justify-content:center;gap:12px;margin:.5em 0} .pindots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--cream)} .pindots span.on{background:var(--gold);border-color:var(--gold)}
  .keypad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center} .keypad button{font-family:var(--font);font-size:22px;height:56px;border-radius:14px;border:0;background:rgba(255,246,220,.15);color:var(--cream);cursor:pointer}
  .tscroll{overflow-x:auto;max-width:100%} .tt{font-size:12px;white-space:nowrap} .tt td{text-align:center}
  .tt button{font-family:var(--font);font-size:11px;border:0;border-radius:8px;padding:.2em .5em;margin:1px;cursor:pointer;background:rgba(255,246,220,.15);color:var(--cream)}
  .tt .acc button.on{background:var(--gold);color:#4a2a10}
  .treas{display:flex;flex-direction:column;gap:6px;text-align:left;max-width:32em;margin:.4em auto}
  .tr2{display:flex;gap:10px;align-items:center;background:rgba(255,246,220,.08);border-radius:12px;padding:6px 10px}
  .tr2 .ti{font-size:30px} .tr2 b{font-weight:400;font-size:17px;color:var(--gold)} .tr2 em{font-style:normal;color:#fff6dc;margin-left:6px} .tr2 small{display:block;font-size:12px;opacity:.85}
  .inlobby #topBtns{display:none!important}
  .inlobby #overlay{background:rgba(10,22,40,.9)}
  #townBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:9;display:none;gap:clamp(3px,1vw,10px);align-items:flex-end;max-width:100vw}
  #townBar button{font-family:var(--font);width:clamp(52px,min(9vw,18vh),82px);height:clamp(52px,min(9vw,18vh),82px);flex:none;border-radius:50%;border:3px solid #e0b060;background:radial-gradient(circle at 40% 35%, #6d4424, #3a220f);color:#fff6dc;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.4);touch-action:manipulation;padding:0}
  #townBar button span{font-size:clamp(20px,3.6vw,32px);line-height:1} #townBar button b{font-weight:400;font-size:clamp(11px,1.7vw,15px)}
  #townBar button.adv{width:clamp(52px,min(10vw,20vh),90px);height:clamp(52px,min(10vw,20vh),90px);border-color:#ffe07a;background:radial-gradient(circle at 40% 35%, #43a047, #1b5e20);margin-left:clamp(3px,1.5vw,20px)}
  #townBar button.adv span{font-size:clamp(24px,4vw,36px)}
  #townBar button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
  .pmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(120px,20vw,160px),1fr));gap:10px;margin:.5em 0}
  .pmode{font-family:var(--font);border:0;border-radius:20px;padding:10px 6px;cursor:pointer;background:var(--c);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.28);text-shadow:0 1px 2px rgba(0,0,0,.3)}
  .pmode:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)} .pmode span{display:block;font-size:clamp(30px,6vw,44px)} .pmode b{display:block;font-weight:400;font-size:clamp(15px,2.5vw,19px)} .pmode small{display:block;font-size:12px;opacity:.95}
  .porder{background:rgba(184,255,122,.15);border:2px dashed rgba(184,255,122,.6);border-radius:14px;padding:.4em .8em;margin:.4em auto;max-width:36em}
  .pguide{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;background:rgba(63,169,255,.14);border-radius:14px;padding:.4em .6em;margin:.4em 0;font-size:clamp(12px,2vw,14px)}
  .pguide b{font-weight:400;color:var(--gold)} .pguide span{background:rgba(0,0,0,.2);border-radius:999px;padding:.15em .7em}
  .parea{border:2px solid var(--c);border-radius:18px;padding:.3em .6em .6em;margin:.5em 0;background:rgba(0,0,0,.18)} .parea h3{margin:.2em 0;color:var(--c)}
  .pstages{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .pst{font-family:var(--font);width:clamp(62px,12vw,84px);border-radius:16px;border:3px solid var(--c);background:rgba(255,255,255,.1);color:#fff;padding:6px 2px;cursor:pointer}
  .pst b{display:block;font-size:22px;font-weight:400} .pst small{display:block;color:#ffe07a;font-size:13px} .pst i{display:block;font-style:normal;font-size:11px;opacity:.85;min-height:1.2em}
  .pst.done{background:rgba(255,224,122,.18)} .pst.lock{opacity:.4;cursor:default}
  .pangtitle{font-size:clamp(40px,8vw,64px)!important;letter-spacing:.05em;-webkit-text-stroke:2px #2b3a67;text-shadow:0 4px 0 #fff, 0 7px 0 #2b3a67}
  .pangrule{background:rgba(63,169,255,.14);border-radius:16px;padding:.4em .9em;text-align:left;max-width:34em;margin:.4em auto} .pangrule p{margin:.35em 0}
  .tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:.4em 0}
  .tabs button{font-family:var(--font);font-size:clamp(14px,2.3vw,17px);border:2px solid rgba(143,247,255,.35);border-radius:999px;background:rgba(20,10,50,.6);color:#cfe8ff;padding:.3em 1em;cursor:pointer}
  .tabs button.on{background:linear-gradient(90deg,#ff3fa4,#7a5cff);border-color:#ffe07a;color:#fff}
  .songs{display:flex;flex-direction:column;gap:6px;margin:.4em 0;text-align:left}
  .song{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(40,20,90,.55),rgba(10,20,60,.55));border:1.5px solid rgba(143,247,255,.25);border-radius:14px;padding:6px 10px}
  .song .num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#1a0a2a;font-size:15px;flex:none}
  .song .sn{flex:1;min-width:0} .song .sn b{display:block;font-weight:400;font-size:clamp(15px,2.4vw,18px);color:#fff} .song .sn small{display:block;font-size:12px;color:#9fb3e0} .song .sn em{font-style:normal;color:#ffe07a}
  .song .sb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .dbtn{font-family:var(--font);font-size:13px;border:0;border-radius:999px;padding:.35em .9em;cursor:pointer;background:var(--c,#7a5cff);color:#1a0a2a}
  .dbtn.ghost{background:rgba(255,255,255,.12);color:#cfe8ff}
  .song .tag{font-size:12px;color:#ffe07a;align-self:center}
  h2.neon{background:linear-gradient(90deg,#ff8ad8,#ffe07a);-webkit-background-clip:text;background-clip:text;color:transparent} h2.neon small{display:block;font-size:.45em;color:#9fe8ff;-webkit-text-fill-color:#9fe8ff}
  .grade{font-size:clamp(60px,12vw,90px)!important;margin:.05em 0} .grade.gS{color:#ffe07a} .grade.gA{color:#8ff7ff} .grade.gB{color:#b8ff7a} .grade.gC{color:#cfcfcf}
  #xClose{position:absolute;top:10px;right:10px;z-index:3;width:48px;height:48px;border-radius:50%;border:3px solid #fff6dc;background:#c0392b;color:#fff;font-size:24px;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  #xClose:hover{background:#e04b3a}
  img.face{width:1.25em;height:1.25em;border-radius:50%;object-fit:cover;vertical-align:-0.25em;border:2px solid rgba(255,224,122,.8)}
  .prof span img.face{width:1.6em;height:1.6em}
  .avnow{width:110px;height:110px;margin:.3em auto;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff8d6,#f5c860);border:5px solid #e9b949;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:64px}
  .avnow img{width:100%;height:100%;object-fit:cover}
  .iconpick.big .ip{font-size:40px;width:68px;height:68px}
  .vlogo{width:1.25em;height:1.25em;background:#fff;border-radius:50%;padding:.1em;object-fit:contain;vertical-align:middle}
  .logoh{display:flex;align-items:center;justify-content:center;gap:.4em;line-height:1.1} .logoh span{text-align:left}
  .hlogo{width:1.9em;height:1.9em;background:#fff;border-radius:50%;padding:.12em;object-fit:contain;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .vcard.lock{filter:grayscale(.75) brightness(.8)}
  .lvup{text-align:center} .lvup .lvbig{font-size:clamp(46px,9vw,72px);color:var(--gold);text-shadow:0 4px 0 #6b3a0a;margin:.1em 0;animation:lvpop .6s ease-out}
  .lvup .rw{display:inline-flex;align-items:center;gap:.5em;background:rgba(255,224,122,.14);border:2px solid rgba(255,224,122,.6);border-radius:18px;padding:.5em 1em;margin:.3em 0}
  .lvup .rw span{font-size:44px} .lvup .rw b{display:block;font-weight:400;font-size:clamp(18px,3vw,24px)} .lvup .rw small{display:block;opacity:.85}
  .lvup .conf{font-size:28px;letter-spacing:.3em;animation:lvpop 1s ease-out}
  @keyframes lvpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  .startbig{font-size:clamp(24px,4.4vw,34px)!important;padding:.45em 1.6em!important}
  details.more{margin-top:.4em} details.more summary{cursor:pointer;list-style:none;display:inline-block;padding:.3em 1.1em;border-radius:999px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25)} details.more summary::-webkit-details-marker{display:none}
  #card.mapc{width:auto!important;max-width:none!important;padding:6px!important;background:transparent!important;box-shadow:none!important;border:0!important;overflow:hidden}
  .smap{display:flex;justify-content:center}
  .smwrap{position:relative;width:min(96vw, calc((100dvh - 24px)*2.357), 1500px);aspect-ratio:2048/869;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .smwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none}

/* ---- 이미지 정리: 배경 지우기 + 여백 자르기 ---- */
async function cleanImage(file, removeBg){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  URL.revokeObjectURL(url);
  const sc = Math.min(1, 512 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth*sc)), h = Math.max(1, Math.round(img.naturalHeight*sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h), px = d.data;
  if(removeBg){
    const corners = [0, w-1, (h-1)*w, (h-1)*w + w-1].filter(i => px[i*4+3] > 200);
    if(corners.length >= 3){ // 모서리가 불투명하면 = 배경이 있는 그림
      const o0 = corners[0]*4, br = px[o0], bgc = px[o0+1], bb = px[o0+2], TOL = 60*60;
      const seen = new Uint8Array(w*h), stack = [];
      for(let i=0;i<w;i++){ stack.push(i, (h-1)*w + i); }
      for(let j=0;j<h;j++){ stack.push(j*w, j*w + w-1); }
      while(stack.length){
        const i = stack.pop(); if(seen[i]) continue; seen[i] = 1;
        const o = i*4, dr = px[o]-br, dg = px[o+1]-bgc, db = px[o+2]-bb;
        if(px[o+3] < 20 || dr*dr + dg*dg + db*db < TOL){
          px[o+3] = 0;
          const xx = i % w, yy = (i / w) | 0;
          if(xx > 0) stack.push(i-1); if(xx < w-1) stack.push(i+1);
          if(yy > 0) stack.push(i-w); if(yy < h-1) stack.push(i+w);
        }
      }
      x.putImageData(d, 0, 0);
    }
  }
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for(let yy=0; yy<h; yy++) for(let xx=0; xx<w; xx++){
    if(px[(yy*w + xx)*4 + 3] > 12){ if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(yy<minY)minY=yy; if(yy>maxY)maxY=yy; }
  }
  let out = c;
  if(maxX >= 0){
    const bw = maxX-minX+1, bh = maxY-minY+1;
    out = document.createElement('canvas'); out.width = bw; out.height = bh;
    out.getContext('2d').drawImage(c, minX, minY, bw, bh, 0, 0, bw, bh);
  }
  return new Promise(res => out.toBlob(b => res(b || file), 'image/png'));
}

  else if(x > 1500 && gr() < Math.min(0.1 + d*0.01, 0.22)*(S.easy ? 0.5 : 1)) p.crumble = true;  // 부서지는 가지
  S.plats.push(p);
  if(swingHere){
    const endY = Math.min(prevY, y) - 60, ay = 16;
    S.swings.push({ax:prevEnd + gap/2, ay, L:Math.max(90, endY - ay), amp:0.55, w:0.05, ph:grand(0,6.28)});
  }
  // 가지 사이 허공에 열매 아치
  if(!swingHere && gap > 90 && gr() < 0.55){
    const coinArc = gr() < 0.3;
    for(let k=1;k<=3;k++){
      const t = k/4, ax = prevEnd+gap*t, ay = Math.min(prevY,y)-55-Math.sin(Math.PI*t)*45;
      if(coinArc) S.coins.push({x:ax, y:ay, ox:k*7});
      else S.fruits.push({x:ax, y:ay, ox:k*7, type:randomFruit(gr)});
    }
  }
  // 보너스 코인 무더기 (높은 곳)
  if(x > S.nextBonusX){
    const cx = prevEnd + gap/2, cy = Math.max(70, Math.min(prevY, y) - grand(150,185)), id = S.clusters.length;
    S.clusters.push({id, cx, cy, total:9, got:0, hinted:false});
    S.coins.push({x:cx, y:cy, ox:0, bonus:id});
    for(let i=0;i<8;i++){ const a = i*Math.PI/4; S.coins.push({x:cx+Math.cos(a)*26, y:cy+Math.sin(a)*26, ox:i*5, bonus:id}); }
    S.nextBonusX = x + grand(1200,1700);
  }
  S.genX = x + w; S.lastY = y;
  populate(p);
  spawnCustom(p);
}

function zoneAtX(px){ if(S && S.stage) return ZONES[S.stage.n].key; return ZONES[Math.floor(Math.max(0, px - 120)/10/ZONE_LEN) % ZONES.length].key; }
function populate(p){
  const d = stageDiffX(p.x)/1000, ez = S.easy;
  if(false && p.x > S.nextHutX){   // (게임 중 학습 오두막은 뺐어요 — 로비의 체험실로 옮겼어요)
    S.huts.push({plat:p, ox:p.w/2, used:false});
    const st = Math.floor((p.x - 120)/10/ZONE_LEN) + 1;
    S.nextHutX = st*ZONE_LEN*10 + 120 + 1200;
    return;
  }
  if(S.order.length > 0 && p.x > S.nextChestX && p.w >= 120 && !p.crumble){
    S.chestsMade++;
    S.chests.push({plat:p, ox:p.w/2-18, got:false});
    S.nextChestX = p.x + grand(800,1150);
    return;
  }
  const n = Math.floor(grand(0,3.6));
  for(let i=0;i<n;i++) S.fruits.push({plat:p, ox:grand(18,p.w-18), oy:-grand(30,85), type:randomFruit(gr)});
  if(gr() < (zoneAtX(p.x) === 'gold' ? 0.6 : 0.28)){   // 코인 줄 (황금 사원엔 많이)
    const c = Math.floor(grand(3,6)), start = grand(14, Math.max(15, p.w - 14 - (c-1)*22));
    for(let i=0;i<c;i++) if(start + i*22 < p.w - 10) S.coins.push({plat:p, ox:start + i*22, oy:-40});
  }
  if(p.x > 2000 && gr() < 0.025) S.fruits.push({plat:p, ox:grand(20,p.w-20), oy:-grand(50,80), type:'gold'});
  if(p.x > 300 && Math.random() < 0.16) S.fruits.push({plat:p, ox:rand(20, Math.max(21, p.w-20)), oy:-rand(30,60), type:pick(['egg','honey','coconut','wheat'])});   // 요리 재료 (맵이 바뀌지 않게 따로 뽑아요)
  let vine = false;
  if(false && p.x > 1200 && p.w >= 150 && !p.amp && !p.crumble && gr() < (ez ? 0.08 : 0.13)){   // 가시 덩굴은 뺐어요
    S.vines.push({plat:p, ox:grand(p.w*0.45, p.w*0.8), hinted:false}); vine = true;
  }
  if(!vine && p.x > S.nextPortalX && p.w >= 120 && !p.amp && !p.crumble){   // 비밀 동굴 포탈 (드물게)
    S.portals.push({plat:p, ox:p.w/2, used:false});
    S.nextPortalX = p.x + grand(2600,3600);
    vine = true;
  }
  if(!vine && p.x > 800 && p.y >= 330 && p.w >= 110 && !p.amp && !p.crumble && gr() < 0.1){   // 점프 버섯 + 하늘 보상
    const ox = grand(p.w*0.3, p.w*0.7), mx = p.x + ox;
    S.mushrooms.push({plat:p, ox, sq:0});
    for(let i=0;i<7;i++){ const t = i/6; S.coins.push({x:mx + 30 + t*190, y:110 - Math.sin(Math.PI*t)*50, ox:i*4}); }
    if(gr() < 0.35) S.fruits.push({x:mx + 125, y:40, ox:3, type:gr() < 0.3 ? 'gold' : 'dragon'});
    vine = true;
  }
  if(p.x > 700 && p.w > 110 && gr() < Math.min(0.14 + d*0.025, 0.4)*(ez ? 0.6 : 1)*(1 - 0.25*assistLv()))
    S.fruits.push({plat:p, ox:grand(p.w*0.35,p.w*0.8), oy:-16, type:'poison'});
  if(!vine && p.x > 1000 && gr() < Math.min(0.14 + d*0.025, 0.42)*(ez ? 0.7 : 1)*(1 - 0.25*assistLv()))
    S.spiders.push({x:p.x+grand(-30,p.w), base:p.baseY-grand(75,105), amp:grand(28,48)*(ez ? 0.8 : 1),
      spd:(grand(0.025,0.045)+Math.min(d*0.002,0.02))*(ez ? 0.6 : 1), ph:grand(0,6.28), y:0, dead:false});
  if(p.x > 800 && gr() < (ez ? 0.08 : 0.06)) S.hearts.push({plat:p, ox:grand(20,p.w-20), oy:-70});
  const z = zoneAtX(p.x);
  const kinds = z === 'volcano' ? ['toucan'] : z === 'treetop' ? ['monkey','monkey','toucan','frog'] : z === 'ruins' ? ['monkey','frog'] : z === 'swamp' ? ['frog','frog','toucan'] : z === 'snow' ? ['monkey'] : z === 'crystal' ? ['frog'] : ['monkey','toucan','frog'];
  const fk = {lagoon:'monkey', treetop:'sloth', ruins:'chameleon'}[z];
  if(fk && p.w > 150 && (gr() < 0.12 || (S.stage && S.stage.friendDue && p.x > S.stage.x0 + 500))){ if(S.stage) S.stage.friendDue = false; S.animals.push({kind:fk, plat:p, ox:grand(50, p.w - 50), t:0, flip:1}); return; }
  if(gr() < (z === 'volcano' || z === 'crystal' ? 0.08 : 0.2)) S.animals.push({kind:gpick(fk === 'sloth' || fk === 'chameleon' ? kinds.filter(k => k !== 'monkey') : kinds), plat:p, ox:grand(16,p.w-16), t:grand(0,200), flip:gr()<.5?-1:1});
}

function pos(o){ return o.plat ? [o.plat.x+o.ox, o.plat.y+(o.oy||0)] : [o.x, o.y]; }
function hitCircle(cx, cy, r, shrink){
  const P = S.player;
  const top = P.y + (P.slide > 0 ? 22 : 0);
  const nx = clamp(cx, P.x+shrink, P.x+P.w-shrink), ny = clamp(cy, top+shrink, P.y+P.h-shrink*0.5);
  return (cx-nx)**2 + (cy-ny)**2 < r*r;
}

function findSafePlat(){   // 지금 화면 안에 실제로 있는 튼튼한 발판 찾기
  const P = S.player, ok = p => p && !p.falling && !p.crumble && S.plats.includes(p);
  const inView = p => p.x + p.w > S.camX + 30 && p.x < S.camX + W - 80;
  if(ok(S.lastSafe) && inView(S.lastSafe)) return S.lastSafe;
  const tx = clamp(Number.isFinite(P.x) ? P.x : S.camX + 200, S.camX + 120, S.camX + W - 200);
  let best = null, bd = Infinity;
  for(const p of S.plats){
    if(!ok(p) || p.amp || !inView(p) || p.w < 70) continue;
    const d = Math.abs(p.x + p.w/2 - tx) + (p.x > tx ? 60 : 0);
    if(d < bd){ bd = d; best = p; }
  }
  if(best) return best;
  const x = S.camX + 140;   // 없으면 비상 안전지대 발판을 만들어요
  const p = {x, y:380, baseY:380, w:260, amp:0, phase:0, dy:0, seed:Math.random(), zone:zoneAtX(x)};
  S.plats.push(p);
  return p;
}
function respawn(){
  const P = S.player, p = findSafePlat();
  S.lastSafe = p;
  P.x = p.x + Math.max(8, Math.min(40, p.w/2 - P.w/2)); P.y = p.y - P.h - 2;
  P.vx = 0; P.vy = 0; P.inv = 120; P.plat = p; P.splashed = false; P.onGround = false;
  P.launchT = 0; P.boostT = 0; P.slide = 0; P.gliding = false; P.glide = glideMax();
  S.swing = null; S.ride = null;
  S.camX = Math.max(0, P.x - 320);
  p.safeT = 150;   // 안전지대 표시
  const cx = P.x + P.w/2;   // 다시 시작하는 곳 바로 옆 위험은 치워요
  for(const sp of S.spiders) if(!sp.dead && Math.abs(sp.x - cx) < 130){ sp.dead = true; sp.vy = -2; sp.rot = 0; }
  for(const f of S.fruits) if(f.type === 'poison' && Math.abs(pos(f)[0] - cx) < 130) f.got = true;
  for(const c of S.customs || []) if((c.d.type === 'hazard' || c.d.type === 'enemy') && Math.abs(pos(c)[0] - cx) < 130) c.got = true;
}
function endGame(won){
  if(S.stage && !won){   // 스테이지 모드 실패: 그 스테이지 처음부터 다시
    S.state = 'over'; S.ride = null; stopRainSound(); bgmStop();
    const runDist = Math.max(0, S.dist - S.stage.d0); DEX.ana.runs++; DEX.ana.distSum += runDist; dmAdd('dist', Math.floor(runDist));
    DEX.coins += S.coinCount; gainXP(runDist*0.5 + (S.treasures || 0)*20); clearSave(); saveDex();
    sfx.lose(); setTimeout(() => showScreen('stageFail'), 700); return;
  }
  if(!S.duo) dmAdd('dist', Math.max(0, Math.floor(S.dist)));
  S.state = won ? 'win' : 'over';
  S.ride = null; stopRainSound();
  const total = S.score + S.dist;
  let best = 0;
  try{ best = +localStorage.getItem(pk('jungle_best')) || 0; if(total > best){ best = total; localStorage.setItem(pk('jungle_best'), best); } }catch(e){ best = total; }
  S.best = best;
  S.clearTime = S.playTime/60;
  DEX.bestDist = Math.max(DEX.bestDist || 0, S.dist);
  clearSave(); saveDex();
  DEX.ana.runs++; DEX.ana.distSum += S.dist;
  if(!S.duo) gainXP(S.dist + (S.treasures || 0)*20 + (won ? 500 : 0));
  if(won){ unlock('clear1'); if(!S.stats.hits) unlock('nohit'); }
  S.coinBonus = won ? (S.easy ? 30 : 50) : 0;
  S.coinEarned = S.coinCount + S.coinBonus;
  DEX.coins += S.coinEarned; saveDex();
  if(won){
    const before = titleOf(totalClears());
    DEX.clears[S.mode]++;
    const prev = DEX.best[S.mode];
    S.newRecord = !prev || S.clearTime < prev;
    if(S.newRecord) DEX.best[S.mode] = S.clearTime;
    const now = titleOf(totalClears());
    S.newTitle = now !== before ? now : '';
    saveDex();
  }
  bgmStop();
  if(S.duo){
    const d = S.duo;
    d.results[d.idx] = {name:d.names[d.idx], score:total, letters:S.found.filter(Boolean).length, dist:S.dist, time:S.clearTime, clear:won};
    if(!won) sfx.lose();
    setTimeout(() => showScreen(d.idx === 0 ? 'duoNext' : 'duoResult'), won ? 0 : 700);
    return;
  }
  if(won) showScreen('win');
  else { sfx.lose(); setTimeout(() => showScreen('over'), 700); }
}

function updatePotions(k){
  const P = S.player;
  for(const key of Object.keys(S.fx)){
    S.fx[key] -= k;
    if(S.fx[key] <= 0){
      delete S.fx[key];
      floatText(P.x + P.w/2, P.y - 16, `${POTIONS[key].short} 효과 끝`, '#dfe8e0');
      if(key === 'fairy'){ burst(S.fairy.x, S.fairy.y, '#fff3b0', 16, 3); S.fairy = null; }
    }
  }
  if(S.fairy){
    const f = S.fairy; f.t += k;
    const tx = P.x + P.w/2 - P.face*34 + Math.cos(f.t*0.045)*14, ty = P.y - 14 + Math.sin(f.t*0.07)*12;
    f.x += (tx - f.x) * Math.min(1, 0.08*k); f.y += (ty - f.y) * Math.min(1, 0.08*k);
    if(Math.random() < 0.35*k) S.particles.push({x:f.x + rand(-4,4), y:f.y + rand(0,6), vx:rand(-0.4,0.4), vy:rand(0.2,0.9), life:rand(20,34), max:34, color:pick(['#fff3b0','#ffe45c','#ffffff','#ffd1f0']), size:rand(1,2.4)});
  }

  if(S.fx.slow > 0 && Math.random() < 0.12*k)

}

function dangerAhead(){
  const P = S.player, cx = P.x + P.w/2, cy = P.y + P.h/2, f = P.face;
  if(P.onGround && P.plat){
    const p = P.plat, edge = f > 0 ? (p.x + p.w) - (P.x + P.w) : P.x - p.x;
    if(edge < 8 || (p.crumble && p.cracked)) return true;
  }
  for(const sp of S.spiders){ if(sp.dead) continue; const dx = (sp.x - cx)*f; if(dx > 0 && dx < 120 && Math.abs(sp.y - cy) < 60) return true; }
  for(const v of S.vines){ if(v.broken) continue; const dx = (v.plat.x + v.ox - cx)*f; if(dx > 0 && dx < 130 && v.plat.y - VINE_GAP > P.y) return true; }
  for(const fr of S.fruits){ if(fr.type !== 'poison' || fr.got) continue; const [x, y] = pos(fr), dx = (x - cx)*f; if(dx > 0 && dx < 70 && Math.abs(y - cy) < 40) return true; }
  return false;
}

let rainSrc = null, rainGain = null;
function startRainSound(){
  if(!soundOn || rainSrc) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const len = AC.sampleRate*2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
    rainSrc = AC.createBufferSource(); rainSrc.buffer = buf; rainSrc.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.6;
    rainGain = AC.createGain(); rainGain.gain.setValueAtTime(0.0001, AC.currentTime); rainGain.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.06*SET.sfx), AC.currentTime + 1.2);
    rainSrc.connect(f); f.connect(rainGain); rainGain.connect(AC.destination); rainSrc.start();
  }catch(e){ rainSrc = null; }
}
function stopRainSound(){
  if(!rainSrc) return;
  try{ rainGain.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.8); rainSrc.stop(AC.currentTime + 0.9); }catch(e){}
  rainSrc = null;
}

  // 독거미 (위에서 밟으면 물리침)
  for(const sp of S.spiders){

    const giant = S.fx.giant > 0 || S.fx.power > 0;

  }
  // 글자 구슬 날아가기
  for(const o of S.orbs){

      if(S.found.every(Boolean) && !S.stage) S.bossPending = 70;   // 글자 완성 → 고릴라 대장과 마지막 대결
    }
  }
  S.orbs = S.orbs.filter(o => !o.done);
  // 생명 하트
  for(const h of S.hearts){
    if(h.got) continue;

    }
  }
  updateCustoms(k);
  for(const hut of S.huts){   // 오두막에 들어가면 과일 학습

  }

  for(const c of S.coins){

      if(dd < 200 && dd > 1){ if(c.plat){ c.x = cx0; c.y = cy0; c.plat = null; } const sp = Math.min(dd, (4 + (200-dd)*0.06)*k); c.x += dx/dd*sp; c.y += dy/dd*sp; }

      else if(S.tutorial && vx < TUT_END){ P.x = vx - 9 - P.w - 6; P.vx = -3; if(!(P.inv > 0)){ P.inv = 40; floatText(vx, P.y - 10, isTouch ? '▼ 버튼으로 미끄러져요!' : '↓ 키로 미끄러져요!', '#e3ffb0'); } }
      else { S.hurtCause = 'vine'; if(hurt()){ burst(vx, P.y + 10, '#b04a8a', 12); floatText(vx, P.y - 10, '가시 덩굴!', '#f0a0d0'); } }

  // 파트너: 따라다니고 보너스 코인 위치를 알려줌

  // 점프 잔상

  if(assistOn() && (S.assist || 0) > 0){ S.assistCalm = (S.assistCalm || 0) + k; if(S.assistCalm > 5400){ S.assistCalm = 0; S.assist--; } }   // 90초 잘하면 한 단계 원래대로
  // 콤보 시간
  if(S.comboT > 0){ S.comboT -= k; if(S.comboT <= 0) S.combo = 0; }

  // 동물들 (구역마다 다름)
  const zk = ZONES[S.zoneIdx % ZONES.length].key;
  if(Math.random() < 0.006*k){

    else if(zk === 'swamp') (Math.random() < 0.6 ? fly : bat)();
    else if(zk === 'snow') parrot();
    else if(zk === 'ruins') (Math.random() < 0.55 ? fly : bat)();
    else if(zk === 'treetop') (Math.random() < 0.65 ? parrot : fly)();
    else (Math.random() < 0.55 ? parrot : fly)();
  }
  if(zk !== 'volcano' && Math.random() < 0.0015*k) S.animals.push({kind:'croc', x:S.camX+W+60, t:0});
  for(const a of S.animals){
    a.t += k;
    if(a.kind === 'parrot'){
      a.x -= a.spd*k;
      if(a.leaving) a.y -= 1.6*k;
      else {
        if(!a.base) a.base = a.y; a.y = a.base + Math.sin(a.t*0.05)*18;
        if(!S.ride && S.state === 'play' && hitCircle(a.x, a.y, 18, 2)){
          S.ride = {t:RIDE_TIME[S.mode], max:RIDE_TIME[S.mode], y:P.y, ty:clamp(a.y + 16, 120, 290), color:a.color};
          a.remove = true; P.jumps = 0; jumpQueued = 0;
          seq([660,880,1100], 60, 'square', .04); floatText(a.x, a.y-30, '앵무새 타기!', '#ffe082');
        }
      }
    }
    else if(a.kind === 'butterfly'){ a.x += (Math.sin(a.t*0.02)*0.9 - 0.2)*k; a.y += Math.cos(a.t*0.027)*0.7*k; a.life += k; }
    else if(a.kind === 'bat'){ a.x -= a.spd*k; a.y += Math.sin(a.t*0.15)*1.6*k; }
    else if(a.kind === 'croc'){ a.x -= 0.5*k; }
  }
  // 꽃잎 · 반딧불이
  if(zk === 'treetop' && Math.random() < 0.12*k)   // 떨어지는 나뭇잎
    S.particles.push({x:S.camX+rand(0,W+200), y:-10, vx:rand(-0.9,-0.3), vy:rand(0.5,1.1), g:0, life:420, max:420, color:pick(['#7fca48','#a8d860','#5aa832']), size:rand(2,3.5)});
  if(zk === 'volcano' && Math.random() < 0.3*k)    // 불티
    S.particles.push({x:S.camX+rand(0,W+100), y:WATER_Y+rand(-5,20), vx:rand(-0.4,0.4), vy:rand(-1.8,-0.6), g:0, life:rand(120,220), max:220, color:pick(['#ffb347','#ff7a2a','#ffe07a']), size:rand(1.2,2.6)});
  if(zk === 'snow' && Math.random() < (LIGHT ? 0.15 : 0.4)*k)   // 눈송이
    S.particles.push({x:S.camX+rand(-50,W+150), y:-10, vx:rand(-0.8,0.2), vy:rand(0.6,1.4), g:0, life:520, max:520, color:'#ffffff', size:rand(1.5,3.2)});
  if(zk === 'swamp' && Math.random() < 0.08*k)   // 늪 거품
    S.particles.push({x:S.camX+rand(0,W), y:WATER_Y+rand(4,30), vx:0, vy:rand(-0.5,-0.2), g:0, life:60, max:60, color:'rgba(200,230,150,.7)', size:rand(2,4)});
  if(zk === 'gold' && Math.random() < 0.1*k)     // 반짝이는 금가루
    S.particles.push({x:S.camX+rand(0,W+100), y:rand(60,420), vx:rand(-0.2,0.2), vy:rand(-0.3,0.1), g:0, life:120, max:120, color:'#ffe07a', size:rand(1.2,2.4)});
  if((zk === 'ruins' || zk === 'crystal') && Math.random() < 0.08*k)     // 떠다니는 빛 먼지
    S.particles.push({x:S.camX+rand(0,W+100), y:rand(150,480), vx:rand(-0.2,0.2), vy:rand(-0.4,-0.1), g:0, life:300, max:300, color:'rgba(200,255,230,.8)', size:rand(1.2,2.2)});
  const night = Math.max(dayState().dark, zk === 'swamp' ? 0.45 : 0);

  // 화면 밖 정리
  const cut = S.camX - 500;
  S.plats = S.plats.filter(p => p.x + p.w > cut && p.y < H + 200);
  S.fruits = S.fruits.filter(f => !f.got && pos(f)[0] > cut && pos(f)[1] < H + 100);

  S.swings = S.swings.filter(v => v.ax + v.L > cut);
  S.animals = S.animals.filter(a => !a.remove && pos(a)[0] > S.camX - 200 && !(a.kind==='butterfly' && a.life > 900) && !(a.leaving && a.y < -60));
}

function updateFx(k){
  for(const p of S.particles){ p.x += p.vx*k; p.y += p.vy*k; p.vy += (p.g ?? 0.18)*k; p.life -= k; }
  S.particles = S.particles.filter(p => p.life > 0);
  if(LIGHT && S.particles.length > 90) S.particles.splice(0, S.particles.length - 90);
  for(const t of S.texts){ t.y -= 0.8*k; t.life -= k; }
  S.texts = S.texts.filter(t => t.life > 0);
  S.shake = Math.max(0, S.shake - 0.6*k);
  if(S.toast){ S.toast.t += k; if(S.toast.t > 200) S.toast = null; }

function drawSpider(sp){
  const x = sp.x - S.camX; if(x < -40 || x > W+40) return;
  const y = sp.y;
  if(!sp.dead){
    ctx.strokeStyle = 'rgba(235,235,235,.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x,-5); ctx.lineTo(x,y-12); ctx.stroke();
  }
  ctx.save(); ctx.translate(x,y);
  if(sp.dead){ ctx.rotate(Math.PI + sp.rot); ctx.globalAlpha = 0.8; }
  if(hasItem('spider')){ ctx.rotate(Math.sin(S.time*0.1 + sp.x)*0.12); drawItemImg('spider', 0, 0, itemSize('spider')); ctx.restore(); return; }
  ctx.strokeStyle = '#1b1020'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  for(let i=0;i<4;i++){
    const wig = Math.sin(S.time*0.25 + i)*3, ly = -6 + i*5;
    for(const s of [-1,1]){
      ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(s*14, ly-6+wig); ctx.lineTo(s*20, ly+6+wig*0.5); ctx.stroke();
    }
  }
  ctx.fillStyle = '#1b1020'; ctx.beginPath(); ctx.arc(0,3,11,0,6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-9,7,0,6.29); ctx.fill();
  ctx.fillStyle = '#e02b2b'; ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(4,3); ctx.lineTo(0,8); ctx.lineTo(-4,3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff3b3b'; ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(-2.6,-10,1.8,0,6.29); ctx.arc(2.6,-10,1.8,0,6.29); ctx.fill();
  ctx.restore();
}

function drawChestIcon(x, y, s, filled){
  if(filled && hasItem('chest')){ ctx.save(); ctx.translate(x, y); ctx.scale(s, s); drawItemImg('chest', 18, 14, itemSize('chest')*0.8); ctx.restore(); return; }
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle = filled ? '#8b5a2b' : 'rgba(255,255,255,.18)'; rr(0,10,36,18,3); ctx.fill();
  ctx.fillStyle = filled ? '#6b3f1f' : 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.moveTo(0,12); ctx.quadraticCurveTo(18,-4,36,12); ctx.closePath(); ctx.fill();
  if(filled){
    ctx.fillStyle = '#f2c14e'; ctx.fillRect(0,11,36,3); ctx.fillRect(7,4,3,24); ctx.fillRect(26,4,3,24);
    rr(14,13,8,8,2); ctx.fill(); ctx.fillStyle = '#6b3f1f'; ctx.fillRect(17,16,2,4);
  }
  ctx.restore();
}
function drawChest(c){
  const x = c.plat.x + c.ox - S.camX, y = c.plat.y - 28;
  if(x < -60 || x > W+60) return;
  const g = ctx.createRadialGradient(x+18,y+14,4,x+18,y+14,48);
  g.addColorStop(0,'rgba(255,220,120,.55)'); g.addColorStop(1,'rgba(255,220,120,0)');
  if(c.got){
    const age = S.time - c.openAt, beam = Math.max(0, 1 - age/90);
    if(beam > 0){
      const bg = ctx.createLinearGradient(0, y-120, 0, y+12);
      bg.addColorStop(0,'rgba(255,255,255,0)'); bg.addColorStop(1, c.potion ? POTIONS[c.potion].color + Math.round(180*beam).toString(16).padStart(2,'0') : `rgba(220,205,255,${0.7*beam})`);
      ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(x+6,y+12); ctx.lineTo(x+30,y+12); ctx.lineTo(x+48,y-120); ctx.lineTo(x-12,y-120); ctx.closePath(); ctx.fill();
    }
    if(c.heart && age < 80){
      const e = ease(age/50);
      ctx.save(); ctx.globalAlpha = Math.min(1, (80-age)/25);
      drawHeartItem(x+18, y - 14 - e*60, 26); ctx.restore();
    }
    if(c.potion && age < 80){
      const e = ease(age/50);
      ctx.save(); ctx.globalAlpha = Math.min(1, (80-age)/25);
      drawPotion(x+18, y+6 - e*60, 1.1, POTIONS[c.potion].color); ctx.restore();
    }
    if(hasItem('chest')){ ctx.save(); ctx.globalAlpha *= 0.55; drawItemImg('chest', x + 18, y + 14, itemSize('chest')); ctx.restore(); return; }
    ctx.fillStyle = '#6b3f1f'; ctx.save(); ctx.translate(x, y+11); ctx.rotate(-0.5);
    rr(0,-12,36,12,4); ctx.fill(); ctx.fillStyle = '#f2c14e'; ctx.fillRect(0,-3,36,3); ctx.restore();
    ctx.fillStyle = '#8b5a2b'; rr(x, y+10, 36, 18, 3); ctx.fill();
    ctx.fillStyle = '#2a1608'; ctx.fillRect(x+3, y+10, 30, 4);
    ctx.fillStyle = '#f2c14e'; ctx.fillRect(x+7, y+10, 3, 18); ctx.fillRect(x+26, y+10, 3, 18);
    return;
  }
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x+18,y+14,48,0,6.29); ctx.fill();
  drawChestIcon(x, y, 1, true);
  S.lights.push({x:x+18, y:y+14, r:80, s:0.8});
  for(let i=0;i<3;i++){
    const a = S.time*0.04 + i*2.1, sx = x+18+Math.cos(a)*28, sy = y+10+Math.sin(a)*16, s = 3 + Math.sin(S.time*0.2+i)*1.5;
    ctx.fillStyle = '#fff6c0'; ctx.beginPath();
    ctx.moveTo(sx,sy-s); ctx.lineTo(sx+s*0.35,sy); ctx.lineTo(sx,sy+s); ctx.lineTo(sx-s*0.35,sy); ctx.closePath(); ctx.fill();
  }
}
function drawHeartItem(cx, top, s){   // 줍는 하트 (위쪽 가운데 기준)
  if(hasItem('heart')){ drawItemImg('heart', cx, top + s/2, s*1.15); return; }
  ctx.save(); ctx.fillStyle = '#ff4d6d'; ctx.shadowColor = '#ff8fa3'; ctx.shadowBlur = 12; heartPath(cx, top, s); ctx.fill(); ctx.restore();
}
function drawHeartPickup(h){
  const [hx, hy] = pos(h), x = hx - S.camX; if(x < -30 || x > W+30) return;
  drawHeartItem(x, hy, 22 + Math.sin(S.time*0.15)*2);
}

/* ---- 동물들 ---- */
const FRIEND_ART = {monkey:artImg('assets/animals/monkey.png'), sloth:artImg('assets/animals/sloth.png'), chameleon:artImg('assets/animals/chameleon.png')};
const FRIENDS = {
  monkey:{name:'원숭이', icon:'🐒', h:64, say:'안녕! 바나나를 모아 봐!', zone:'lagoon'},
  sloth:{name:'나무늘보', icon:'🦥', h:74, say:'천천히~ 덩굴을 잡고 건너 봐~', zone:'treetop', hang:true},
  chameleon:{name:'카멜레온', icon:'🦎', h:50, say:'보물상자는 높은 곳에 숨어 있어!', zone:'ruins'}
};
function drawFriend(a, x, ay){
  const F = FRIENDS[a.kind], im = FRIEND_ART[a.kind].img, P = S.player, near = Math.abs(P.x + P.w/2 - (x + S.camX)) < 150;
  const h = F.h, w = h*im.width/im.height; a.t = (a.t || 0) + 1;
  if(near && !a.met){ a.met = true; a.sayT = 160; DEX.friends = DEX.friends || {};
    if(!DEX.friends[a.kind]){ DEX.friends[a.kind] = true; saveDex(); S.toast = {text:`${F.icon} 새 친구 ${F.name}를 만났어요!`, t:0}; say(`새 친구 ${F.name}를 만났어요`, 'ko-KR'); seq([784,988,1175], 90, 'triangle', .06); } }
  const face = P.x + P.w/2 < x + S.camX ? -1 : 1;
  ctx.save();
  if(F.hang){   // 나무늘보: 위에서 내려온 덩굴에 매달려 흔들흔들
    const top = ay - 190, sway = Math.sin(a.t*0.03)*0.12;
    ctx.translate(x, top); ctx.rotate(sway);
    ctx.strokeStyle = '#4e8a2e'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -200); ctx.lineTo(0, 40); ctx.stroke();
    ctx.translate(0, 34 + h/2); ctx.scale(face, 1); ctx.drawImage(im, -w/2 - w*0.05, -h/2 - h*0.02, w, h);
  } else {
    const hop = near ? -Math.abs(Math.sin(a.t*0.15))*8 : Math.sin(a.t*0.05)*1.5, squash = near ? 1 + Math.sin(a.t*0.3)*0.04 : 1;
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x, ay + 2, w*0.35, 5, 0, 0, 6.29); ctx.fill();
    ctx.translate(x, ay + hop); ctx.scale(face*(a.kind === 'monkey' ? -1 : 1)*squash, 1/squash); ctx.drawImage(im, -w/2, -h, w, h);
  }
  ctx.restore();
  if(a.sayT > 0){ a.sayT--; ctx.save(); ctx.font = `bold 14px ${FONT}`; const tw = ctx.measureText(F.say).width + 20, by = ay - (F.hang ? 230 : h + 40);
    ctx.globalAlpha = Math.min(1, a.sayT/20); ctx.fillStyle = 'rgba(255,255,255,.96)'; rr(x - tw/2, by, tw, 28, 12); ctx.fill(); ctx.strokeStyle = '#e9b949'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#3a2412'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(F.say, x, by + 14); ctx.restore(); }
}
function drawAnimal(a){
  const [ax, ay] = pos(a), x = ax - S.camX;
  if(x < -60 || x > W+60) return;
  if(FRIENDS[a.kind] && FRIEND_ART[a.kind].ok){ drawFriend(a, x, ay); return; }
  ctx.save();
  if(a.kind === 'monkey'){
    const P = S.player, near = Math.abs(P.x - ax) < 160;
    const hop = near ? -Math.abs(Math.sin(a.t*0.15))*10 : 0;
    ctx.translate(x, ay+hop); ctx.scale(near ? (P.x < ax ? -1 : 1) : a.flip, 1);
    ctx.strokeStyle = '#6b3f1f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8,-8); ctx.bezierCurveTo(-26,-6,-26,-34,-14,-32); ctx.stroke();
    ctx.fillStyle = '#7a4a24'; ctx.beginPath(); ctx.ellipse(0,-13,11,13,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#d8a878'; ctx.beginPath(); ctx.ellipse(1,-11,6,8,0,0,6.29); ctx.fill();
    const wave = near ? Math.sin(a.t*0.3)*0.6 : 0.2;
    ctx.save(); ctx.translate(8,-18); ctx.rotate(-1.2 - wave); ctx.fillStyle = '#7a4a24'; ctx.fillRect(-2,0,4,13); ctx.restore();
    ctx.fillStyle = '#7a4a24'; ctx.beginPath(); ctx.arc(0,-32,10,0,6.29); ctx.arc(-10,-32,4,0,6.29); ctx.arc(10,-32,4,0,6.29); ctx.fill();
    ctx.fillStyle = '#e7c095'; ctx.beginPath(); ctx.ellipse(1,-30,7,6,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#2a1a0e'; ctx.beginPath(); ctx.arc(-2,-32,1.6,0,6.29); ctx.arc(4,-32,1.6,0,6.29); ctx.fill();
    ctx.strokeStyle = '#2a1a0e'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(1,-28,2.5,0.2,Math.PI-0.2); ctx.stroke();
  } else if(a.kind === 'toucan'){
    ctx.translate(x, ay); ctx.scale(a.flip, 1);
    const bob = Math.sin(a.t*0.05)*1.5;
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.moveTo(-6,-6); ctx.lineTo(-16,2); ctx.lineTo(-4,-2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-14+bob,9,13,0.15,0,6.29); ctx.fill();
    ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.ellipse(4,-19+bob,5,6,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#ff8c1a'; ctx.beginPath(); ctx.ellipse(14,-23+bob,11,4.5,0.1,0,6.29); ctx.fill();
    ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(24,-22+bob,2.5,0,6.29); ctx.fill();
    ctx.fillStyle = '#4fc3f7'; ctx.beginPath(); ctx.arc(3,-24+bob,3,0,6.29); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(3.5,-24+bob,1.4,0,6.29); ctx.fill();
    ctx.fillStyle = '#ff8c1a'; ctx.fillRect(-3,-2,2,3); ctx.fillRect(2,-2,2,3);
  } else if(a.kind === 'frog'){
    const ph = a.t % 150, hop = ph < 20 ? -Math.sin(ph/20*Math.PI)*18 : 0;
    ctx.translate(x, ay+hop); ctx.scale(a.flip, 1);
    ctx.fillStyle = '#3e9b3f'; ctx.beginPath(); ctx.ellipse(-7,-3,6,3,0,0,6.29); ctx.ellipse(7,-3,6,3,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.ellipse(0,-8,12,8,0,0,6.29); ctx.fill();
    ctx.fillStyle = '#ffe082'; ctx.beginPath(); ctx.ellipse(0,-5,7,4,0,0,6.29); ctx.fill();
    for(const ex of [-5,5]){ ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.arc(ex,-15,4,0,6.29); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex,-15.5,2.6,0,6.29); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex+0.6,-15.5,1.3,0,6.29); ctx.fill(); }
  } else if(a.kind === 'parrot'){
    ctx.translate(x, ay); if(a.spd < 0) ctx.scale(-1, 1);
    drawParrotShape(a.color, a.t);
  } else if(a.kind === 'bat'){
    ctx.translate(x, ay);
    const fl = Math.sin(a.t*0.5);
    ctx.fillStyle = '#231a33';
    for(const d of [-1,1]){ ctx.beginPath(); ctx.moveTo(0,-2); ctx.quadraticCurveTo(d*10,-12*fl-4,d*20,-8*fl); ctx.lineTo(d*16,-2*fl+2); ctx.lineTo(d*11,-3*fl+4); ctx.lineTo(d*6,2); ctx.closePath(); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(0,0,5,7,0,0,6.29); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4,-5); ctx.lineTo(-3,-11); ctx.lineTo(-1,-6); ctx.moveTo(4,-5); ctx.lineTo(3,-11); ctx.lineTo(1,-6); ctx.fill();
    ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.arc(-2,-3,1.2,0,6.29); ctx.arc(2,-3,1.2,0,6.29); ctx.fill();
  } else if(a.kind === 'butterfly'){
    ctx.translate(x, ay);
    const f = Math.abs(Math.sin(a.t*0.3))*0.8 + 0.2;
    ctx.fillStyle = a.color;
    ctx.save(); ctx.scale(f,1);
    ctx.beginPath(); ctx.ellipse(-6,-4,6,7,-0.4,0,6.29); ctx.ellipse(6,-4,6,7,0.4,0,6.29); ctx.fill();
    ctx.globalAlpha = .75; ctx.beginPath(); ctx.ellipse(-4,5,4,5,0.3,0,6.29); ctx.ellipse(4,5,4,5,-0.3,0,6.29); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#2a1a0e'; ctx.fillRect(-1,-7,2,14);
  }
  ctx.restore();
}
function drawParrotShape(color, t){
  const flap = Math.sin(t*0.4);
  ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(34,3); ctx.lineTo(10,4); ctx.fill();
  ctx.fillStyle = '#1e88e5'; ctx.beginPath(); ctx.moveTo(10,-1); ctx.lineTo(32,-2); ctx.lineTo(10,2); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(0,0,14,7,0,0,6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(-12,-3,6.5,0,6.29); ctx.fill();
  ctx.fillStyle = '#f5e6c8'; ctx.beginPath(); ctx.moveTo(-17,-5); ctx.quadraticCurveTo(-24,-3,-18,1); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-13,-4,1.4,0,6.29); ctx.fill();
  ctx.save(); ctx.scale(1, flap); ctx.fillStyle = color === '#e53935' ? '#1e88e5' : '#ffd54f';
  ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(6,-18); ctx.lineTo(10,0); ctx.fill(); ctx.restore();
}

    ctx.fillStyle = '#7a4a24'; ctx.beginPath(); ctx.arc(1,7,9.5,0,6.29); ctx.fill();
    ctx.fillStyle = '#e7c095'; ctx.beginPath(); ctx.ellipse(4.5,9,5.5,5.5,0,0,6.29); ctx.fill();
  } else if(L.head === 'tiger'){
    ctx.fillStyle = '#f08a24'; ctx.beginPath(); ctx.arc(-4,-1,4,0,6.29); ctx.arc(5,-2,4,0,6.29); ctx.fill();
    ctx.fillStyle = '#ffb4a8'; ctx.beginPath(); ctx.arc(-4,-1,2,0,6.29); ctx.arc(5,-2,2,0,6.29); ctx.fill();
    ctx.fillStyle = '#f08a24'; ctx.beginPath(); ctx.arc(1,7,9.5,0,6.29); ctx.fill();
    ctx.fillStyle = '#fff2dc'; ctx.beginPath(); ctx.ellipse(6,11,5,3.8,0,0,6.29); ctx.fill();
    ctx.strokeStyle = '#2a1a0e'; ctx.lineWidth = 1.6; for(const x of [-3,1,5]){ ctx.beginPath(); ctx.moveTo(x,-1.5); ctx.lineTo(x+0.5,2.5); ctx.stroke(); }
    ctx.fillStyle = '#e36f7a'; ctx.beginPath(); ctx.arc(10,9.5,1.4,0,6.29); ctx.fill();

function drawPlayer(){
  const P = S.player;
  ctx.save();
  if(P.inv > 0 && Math.floor(P.inv/5)%2 === 0) ctx.globalAlpha = 0.35;
  const skin = effectiveSkin();
  const imgSkin = skin === 'custom' || (skin === 'explorer' && artRun.ok) || (skin === 'pixel' && artPixelRun.ok);
  if(imgSkin){
    const pic = skin === 'custom' ? ((!P.onGround && heroJump.ok) ? heroJump : hero)
              : skin === 'pixel' ? ((!P.onGround && artPixelJump.ok) ? artPixelJump : artPixelRun)
              : ((!P.onGround && artJump.ok) ? artJump : artRun);
    const img = pic.img, h = heroHeight, w = h * img.naturalWidth / img.naturalHeight;
    const moving = P.onGround && Math.abs(P.vx) > 0.4;
    const bob = moving ? -Math.abs(Math.sin(P.anim))*4 : 0;
    const tilt = moving ? Math.sin(P.anim)*0.06 : (!P.onGround ? -0.08*Math.sign(P.vy) : 0);
    ctx.translate(P.x - S.camX + P.w/2, P.y + P.h + bob);
    ctx.scale(P.face, 1); ctx.rotate(tilt);
    if(P.onGround){ ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, -bob, w*0.35, 3, 0, 0, 6.29); ctx.fill(); }
    ctx.drawImage(img, -w/2, -h, w, h);
    ctx.restore();
    return;
  }
  ctx.translate(P.x - S.camX + P.w/2, P.y); ctx.scale(P.face, 1);
  const run = P.onGround ? Math.sin(P.anim) : 0, air = !P.onGround;
  drawHero(SKIN_LOOK[skin] || SKIN_LOOK.explorer, run, air, P.mood || 'normal');
  ctx.restore();
}

function drawPet(key, x, y, t, face){
  ctx.save(); ctx.translate(x, y); ctx.scale(face, 1);
  const flap = Math.sin(t*0.45);
  if(key === 'bird'){
    ctx.fillStyle = '#1565c0'; ctx.beginPath(); ctx.moveTo(-6,1); ctx.lineTo(-13,-2); ctx.lineTo(-12,4); ctx.fill();

    ctx.fillStyle = '#ff9800'; ctx.beginPath(); ctx.moveTo(6,-1); ctx.lineTo(10,0.5); ctx.lineTo(6,2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(3,-2,1.2,0,6.29); ctx.fill();
    ctx.save(); ctx.scale(1, flap); ctx.fillStyle = '#1e88e5'; ctx.beginPath(); ctx.ellipse(-2,-5,6,3.5,-0.5,0,6.29); ctx.fill(); ctx.restore();
  } else if(key === 'owl'){
    ctx.fillStyle = '#8d6e63'; ctx.beginPath(); ctx.ellipse(0,0,7.5,8.5,0,0,6.29); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6,-5); ctx.lineTo(-5,-11); ctx.lineTo(-2,-6); ctx.moveTo(6,-5); ctx.lineTo(5,-11); ctx.lineTo(2,-6); ctx.fill();
    ctx.fillStyle = '#d7ccc8'; ctx.beginPath(); ctx.ellipse(0,3,4.5,4.5,0,0,6.29); ctx.fill();
    for(const ex of [-3,3]){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex,-2,3,0,6.29); ctx.fill(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex+0.6,-2,1.5,0,6.29); ctx.fill(); }
    ctx.fillStyle = '#ffb300'; ctx.beginPath(); ctx.moveTo(-1.2,0.5); ctx.lineTo(1.2,0.5); ctx.lineTo(0,3); ctx.fill();
    ctx.save(); ctx.scale(1, 0.6 + flap*0.4); ctx.fillStyle = '#6d4c41'; ctx.beginPath(); ctx.ellipse(-7,1,3,6,0.3,0,6.29); ctx.ellipse(7,1,3,6,-0.3,0,6.29); ctx.fill(); ctx.restore();
  } else if(key === 'pixie'){
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0,0,1,0,0,20); g.addColorStop(0,'rgba(190,255,230,.8)'); g.addColorStop(1,'rgba(190,255,230,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,20,0,6.29); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    const f = Math.abs(flap);
    ctx.fillStyle = 'rgba(220,255,245,.75)'; for(const d of [-1,1]){ ctx.beginPath(); ctx.ellipse(d*6*f, -4, 7*f+1, 4.5, d*0.5, 0, 6.29); ctx.fill(); }
    ctx.fillStyle = '#6fe0c0'; ctx.beginPath(); ctx.moveTo(-3.5,7); ctx.lineTo(3.5,7); ctx.lineTo(1.5,-2); ctx.lineTo(-1.5,-2); ctx.fill();
    ctx.fillStyle = '#ffe0c2'; ctx.beginPath(); ctx.arc(0,-5,3.2,0,6.29); ctx.fill();
    ctx.fillStyle = '#8d5cf6'; ctx.beginPath(); ctx.arc(0,-6.5,3.2,Math.PI,0); ctx.fill();
  }
  ctx.restore();

      <h3>로비</h3><p>로비에서 걸어 다니며 방에 들어가요. 정글 점프, 바리스타 체험실(과일 음료 → 활력), 요리 체험실(요리 → 아이템), 동아리실(리듬 게임 → 배경음악·물약)이 있어요. 정글에서 모은 과일과 재료는 로비의 방에서 써요.</p>
      <h3>동아리실 (리듬 스타)</h3><p>쉬움·보통·어려움 10곡씩 리듬 게임을 하고, 정글 배경음악으로 등록하거나 물약으로 바꿔요. '내 음악'에 직접 만든 음악 파일을 올리면 노트를 자동으로 만들어요.</p>
      <h3>파트너</h3><p>파트너가 옆을 따라다니며 높은 곳의 보너스 코인을 알려주고, 물에 빠지기 직전 한 번 구해줘요.</p>
      <h3>이렇게 해봐요</h3><p>독거미는 위에서 밟으면 물리칠 수 있어요. 날아오는 앵무새에 닿으면 잠깐 타고 날아가요(점프하면 내려요). 오른쪽 끝 화살표가 다음 보물상자를 알려줘요.</p>
      <h3>물약 (10초)</h3><p>체공: 천천히 떨어짐 · 빛: 몸이 빛나 어둠을 밝힘 · 요정: 요정이 따라다님 · 자석: 열매가 끌려옴 · 거인: 커지고 한 번 막아줌, 거미를 부딪혀 물리침 · 느림보: 느려짐 · 혼란: 좌우가 바뀜</p>
      <h3>스테이지</h3><p>500m마다 스테이지 1 폭포 정글 → 2 나무 위 마을 → 3 고대 유적 → 4 화산 지대로 바뀌어요. 화산 지대는 물 대신 용암이 흘러요. 달릴수록 낮·노을·밤도 찾아와요.</p>

function wireLearn(){
  const L = LEARN, g = id => document.getElementById(id);
  const on = (id, fn) => { const el = g(id); if(el) el.onclick = fn; };
  const rerender = () => { const sc = card.scrollTop; showScreen('learn'); card.scrollTop = sc; };
  const bad = (el, text) => { L.miss++; tone(220,.2,'sine',.05,160); if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } const m = g('msg'); if(m) m.textContent = text; };
  on('lnSkip', closeLearn);
  card.querySelectorAll('[data-say]').forEach(b => b.onclick = () => sayFruit(b.dataset.say));
  card.querySelectorAll('[data-sayline]').forEach(b => b.onclick = () => say(custLine(L.cust)));
  if(L.kind === 'spell'){
    on('lnUndo', () => { if(!L.filled.length) return; L.filled.pop(); const tl = [...L.tiles].reverse().find(t => t.used && t.ch === L.parts[L.filled.length]); if(tl) tl.used = false; rerender(); });
    card.querySelectorAll('[data-tile]').forEach(b => b.onclick = () => {
      const tl = L.tiles[+b.dataset.tile], need = L.parts[L.filled.length];
      if(tl.ch === need){
        tl.used = true; L.filled.push(tl.ch); tone(660 + L.filled.length*80,.1,'triangle',.05);
        if(L.filled.length === L.parts.length){ sayFruit(L.t); setTimeout(finishLearn, 700); }
        rerender();
      } else bad(b, '다시 해볼까요? 그림 이름의 다음 글자를 찾아요');
    });
  }
  if(L.kind === 'quiz' || L.kind === 'math'){
    const next = () => { L.i++; L.right = false; L.wrong = false; if(L.i >= L.qs.length) finishLearn(); else { rerender(); const q = L.qs[L.i]; say(L.kind === 'quiz' ? q.q + ' 어떻게 할까요?' : mathLine(q), 'ko-KR'); } };
    on('qNext', next);
    card.querySelectorAll('[data-sayq]').forEach(b => b.onclick = () => say(L.qs[L.i].q + ' 어떻게 할까요?', 'ko-KR'));
    card.querySelectorAll('[data-saym]').forEach(b => b.onclick = () => say(mathLine(L.qs[L.i]), 'ko-KR'));
    card.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => {
      const q = L.qs[L.i];
      if(b.dataset.ch === '1'){ L.right = true; seq([784,988,1175], 70, 'triangle', .06); say('맞아요! ' + q.why, 'ko-KR'); rerender(); }
      else { L.wrong = true; bad(b, ''); say('다시 생각해 볼까요?', 'ko-KR'); setTimeout(rerender, 450); }
    });
    card.querySelectorAll('[data-num]').forEach(b => b.onclick = () => {
      const q = L.qs[L.i];
      if(+b.dataset.num === q.ans){ L.right = true; seq([784,988,1175], 70, 'triangle', .06); say(`맞아요! ${q.ans} 코인이에요`, 'ko-KR'); rerender(); }
      else { bad(b, '코인을 하나씩 세어 볼까요?'); say('코인을 하나씩 세어 볼까요?', 'ko-KR'); }
    });
  }
  if(L.kind === 'safe'){
    const tryPair = (a, bb, el) => {
      if(a === bb){
        const it = SAFE.find(x => x.w === a); L.done[a] = true; L.sel = null; L.tip = `${it.e} ${it.w}: ${it.tip}`;
        DEX.safeSeen = Object.assign({}, DEX.safeSeen); DEX.safeSeen[a] = true;
        tone(880,.12,'triangle',.05); say(`${it.w}. ${it.tip}`, 'ko-KR');
        if(Object.keys(L.done).length === L.items.length) setTimeout(finishLearn, 2600);
        rerender();
      } else { L.sel = null; bad(el, '괜찮아요! 다른 낱말을 골라 볼까요?'); setTimeout(rerender, 450); }
    };
    card.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => {
      const w = b.dataset.sp;
      if(L.sel && L.sel.side === 'n') return tryPair(w, L.sel.w, b);
      L.sel = {side:'p', w}; rerender();
    });
    card.querySelectorAll('[data-sn]').forEach(b => b.onclick = () => {
      const w = b.dataset.sn; say(w, 'ko-KR');
      if(L.sel && L.sel.side === 'p') return tryPair(L.sel.w, w, b);
      L.sel = {side:'n', w}; rerender();
    });
  }
  if(L.kind === 'match'){
    const tryPair = (a, bb, el) => {
      if(a === bb){ L.done[a] = true; L.sel = null; tone(880,.12,'triangle',.05); sayFruit(a); if(Object.keys(L.done).length === L.fs.length) setTimeout(finishLearn, 600); rerender(); }
      else { L.sel = null; bad(el, '짝이 아니에요. 다시 골라 볼까요?'); setTimeout(rerender, 450); }
    };
    card.querySelectorAll('[data-mp]').forEach(b => b.onclick = () => {
      const t = b.dataset.mp; sayFruit(t);
      if(L.sel && L.sel.side === 'n') return tryPair(t, L.sel.t, b);
      L.sel = {side:'p', t}; rerender();
    });
    card.querySelectorAll('[data-mn]').forEach(b => b.onclick = () => {
      const t = b.dataset.mn;
      if(L.sel && L.sel.side === 'p') return tryPair(L.sel.t, t, b);
      L.sel = {side:'n', t}; rerender();
    });
  }
  if(L.kind === 'shop'){
    card.querySelectorAll('[data-bk]').forEach(b => b.onclick = () => {
      const t = b.dataset.bk; if(L.basket[t] <= 0) return;
      L.basket[t]--; L.tray.push(t); tone(740,.08,'triangle',.04); sayFruit(t); rerender();
    });
    card.querySelectorAll('[data-tr]').forEach(b => b.onclick = () => { const t = L.tray.splice(+b.dataset.tr, 1)[0]; L.basket[t]++; rerender(); });
    on('lnClear', () => { for(const t of L.tray) L.basket[t]++; L.tray = []; rerender(); });
    on('lnGive', () => {
      const cu = L.cust, ok = L.tray.length === cu.n && L.tray.every(t => t === cu.want);
      if(!L.tray.length){ const m = g('msg'); if(m) m.textContent = '먼저 바구니에서 과일을 골라요'; return; }
      if(ok){
        L.earned += cu.n*5; L.tray = []; seq([784,988,1175], 70, 'triangle', .06);
        say(LANG() === 'en' ? 'Thank you!' : '고마워요!');
        L.round++;
        if(L.round >= L.rounds || !basketTypes(L.basket).length){ setTimeout(finishLearn, 500); }
        else { L.cust = newCustomer(L.basket); setTimeout(() => say(custLine(L.cust)), 700); }
        rerender();
      } else {
        const wrongType = L.tray.some(t => t !== cu.want), text = wrongType ? `${cu.who.n}는 ${josa(fName(cu.want), '을', '를')} 원해요` : `${cu.n}개를 세어서 줘요 (지금 ${L.tray.length}개)`;
        for(const t of L.tray) L.basket[t]++; L.tray = [];
        bad(g('lnGive'), text); setTimeout(rerender, 900);
      }
    });
  }
}

function analyzeSong(buf){   // 소리 크기 변화(저음·중음·고음)로 박자가 나오는 곳을 찾아요

      return `<button class="pst${open ? '' : ' lock'}${s ? ' done' : ''}" data-ps="${n}" ${open ? '' : 'disabled'}><b>${open ? n : '🔒'}</b><small>${'★'.repeat(s)}${'☆'.repeat(3 - s)}</small><i>${open ? goal : ''}</i></button>`; }).join('')}</div></div>`).join('')}
    <button class="go alt" id="goBtn">돌아가기</button>`;
}
function pangResultHTML(){
  const gained = Object.entries(PG.gained || {}), stageTxt = PG.stage ? (PG.win ? `<p class="stars">${'★'.repeat(PG.stars)}${'☆'.repeat(3 - PG.stars)}</p><p>${PG.stage.n}단계 클리어! 남은 횟수 보너스 +${Math.max(0, PG.moves)*300}</p>` : `<p class="big">아쉬워요! 다시 해 볼까요?</p><p class="keys">${PG.stage.goals.map(gl => `${gl.type === 'fruit' ? FRUIT_INFO[gl.t].ko : {ice:'얼음', stone:'돌', seed:'씨앗'}[gl.type]} ${pangGoalProgress(gl)}/${gl.n}`).join(' · ')}</p>`) : '';
  const next = PG.stage && PG.win && PG.stage.n < PANG_STAGES ? `<button class="go" id="pgNext">다음 단계 ▶</button>` : '';
  return `${PANG_LOGO}${stageTxt}<p class="stars" style="font-size:clamp(28px,6vw,44px)">${PG.score.toLocaleString()}점</p>${PG.newBest ? '<p class="rec">🏆 새 최고 기록!</p>' : ''}
    <p>최대 콤보 ${PG.maxCombo} · 팡 ${PG.pangs}번</p>
    <p class="coins">🪙 코인 +${PG.coins}</p>
    ${gained.length ? `<p>창고에 들어간 과일: ${gained.map(([t, n]) => `<img src="${fruitPic(t)}" style="width:26px;height:26px;vertical-align:middle">×${n}`).join(' ')}</p>` : ''}
    ${PG.orderReward ? `<p class="rec">요리체험실 주문 완료! 재료 ${Object.entries(PG.orderReward).map(([t, n]) => `${ING_INFO[t].icon}×${n}`).join(' ')} · 🪙+10</p>` : ''}
    <div class="btnrow">${next}<button class="go${next ? ' alt' : ''}" id="pangAgain">다시 하기</button>${PG.stage ? '<button class="go alt" id="pgMap">🗺️ 지도</button>' : ''}<button class="go alt" id="goBtn">나가기</button></div>`;
}

/* ---- 기록 카드 (이미지로 저장·공유) ---- */
function shareCard(won){
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
  const x = c.getContext('2d'), keep = ctx; ctx = x;
  try{
    const bgImg = artBgs.bg1.ok ? artBgs.bg1.img : null;
    if(bgImg){ const ih = 1350, iw = bgImg.naturalWidth*ih/bgImg.naturalHeight; x.drawImage(bgImg, -iw*0.35, 0, iw, ih); }
    else { x.fillStyle = '#1f5e43'; x.fillRect(0,0,1080,1350); }
    const g = x.createLinearGradient(0,0,0,1350); g.addColorStop(0,'rgba(7,25,15,.35)'); g.addColorStop(1,'rgba(7,25,15,.85)');
    x.fillStyle = g; x.fillRect(0,0,1080,1350);
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `92px ${FONT}`; x.lineWidth = 12; x.strokeStyle = '#4a2a10'; x.strokeText('정글 점프 탐험대', 540, 130); x.fillStyle = '#f2c14e'; x.fillText('정글 점프 탐험대', 540, 130);
    x.font = `54px ${FONT}`; x.fillStyle = '#fff6dc'; x.fillText(won ? '강원특수교육원 강릉분원 완성!' : '탐험 기록', 540, 230);
    const hero = artJump.ok ? artJump.img : artRun.ok ? artRun.img : null;
    if(hero){ const h = 380, w = h*hero.naturalWidth/hero.naturalHeight; x.drawImage(hero, 540 - w/2, 290, w, h); }
    x.save(); x.translate(0, 0);
    for(let i=0;i<GOAL;i++){
      const line2 = i >= LINE1, idx = line2 ? i - LINE1 : i, n = line2 ? GOAL - LINE1 : LINE1, sp = 118;
      const ox = 540 - (n-1)*sp/2 + idx*sp, oy = line2 ? 880 : 760;
      if(S.found[i]) drawOrb(ox, oy, 46, WORD[i], 0, HUES[i]);
      else { x.strokeStyle = 'rgba(255,246,220,.35)'; x.lineWidth = 4; x.setLineDash([10,10]); x.beginPath(); x.arc(ox, oy, 44, 0, 6.29); x.stroke(); x.setLineDash([]); x.font = `44px ${FONT}`; x.fillStyle = 'rgba(255,246,220,.3)'; x.fillText(WORD[i], ox, oy + 2); }
    }
    x.restore();
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `64px ${FONT}`; x.fillStyle = '#f2c14e'; x.fillText(`${S.score + S.dist}점`, 540, 1020);
    x.font = `40px ${FONT}`; x.fillStyle = '#fff6dc';
    x.fillText(`${won ? '완성 시간 ' + fmtTime(S.clearTime) + ' · ' : ''}${S.dist}m · 열매 ${S.fruitCount}개 · 코인 ${S.coinCount}개`, 540, 1100);
    const ttl = titleOf(totalClears()), badges = ACHS.filter(a => DEX.ach[a.id]).map(a => a.icon).join(' ');
    if(ttl){ x.font = `38px ${FONT}`; x.fillStyle = '#f2c14e'; x.fillText(`칭호: ${ttl}`, 540, 1170); }
    if(badges){ x.font = `40px sans-serif`; x.fillText(badges, 540, 1235); }
    const d = new Date(); x.font = `30px ${FONT}`; x.fillStyle = 'rgba(255,246,220,.7)'; x.fillText(`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} · ${S.easy ? '쉬움' : '보통'}`, 540, 1300);
  } finally { ctx = keep; }
  const msg = document.getElementById('msg');
  c.toBlob(async blob => {
    if(!blob) return;
    const file = new File([blob], 'jungle-jump-record.png', {type:'image/png'});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'정글 점프 탐험대 기록'}); if(msg) msg.textContent = '기록 카드를 공유했어요.'; return; }
    }catch(e){}
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'jungle-jump-record.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    if(msg) msg.textContent = '기록 카드를 저장했어요.';
  }, 'image/png');
}
function wireCustom(){
  card.querySelectorAll('[data-img]').forEach(el => el.onclick = () => { pickSlot = el.dataset.img; pickImg.click(); });
  document.getElementById('audBtn').onclick = () => pickAud.click();

}
function wordHTML(){
  const orb = i => `<span class="orb${S.found[i] ? '' : ' empty'}" style="--h:${HUES[i]}">${WORD[i]}</span>`;
  const idx = [...Array(GOAL).keys()];
  return `<div class="word"><div class="line">${idx.slice(0,LINE1).map(orb).join('')}</div><div class="line">${idx.slice(LINE1).map(orb).join('')}</div></div>`;

function itemState(kind, k, it){
  if(equipped(kind) === k) return {label:'착용 중', eq:true};
  if(it.custom) return hero.ok ? {label:'착용하기', act:'equip'} : {label:'꾸미기에서 올리기'};
  if(owns(kind, k)) return {label:'착용하기', act:'equip'};
  if(it.clear) return totalClears() >= it.clear ? {label:'받기', act:'claim'} : {label:`완성 ${it.clear}번 보상`};
  return {label:`🪙 ${it.price}`, act: DEX.coins >= it.price ? 'buy' : null};
}
function wireWardrobe(){
  card.querySelectorAll('.item button[data-act]').forEach(b => b.onclick = () => {
    const kind = b.dataset.kind, k = b.dataset.k, act = b.dataset.act;
    const T = kind === 'skin' ? SKINS : kind === 'trail' ? TRAILS : PETS, it = T[k];
    if(act === 'buy'){ if(DEX.coins < it.price) return; DEX.coins -= it.price; DEX.owned[kind].push(k); seq([784,988,1319], 70, 'triangle', .06); }
    if(act === 'claim'){ DEX.owned[kind].push(k); seq([784,988,1319], 70, 'triangle', .06); }
    if(act) { DEX.equip[kind] = k; saveDex(); }
    const sc = card.scrollTop; showScreen('wardrobe'); card.scrollTop = sc;
  });
}
function hideScreen(){
  if(typeof xClose !== 'undefined') xClose.style.display = 'none';
  if(villageOpen && S && S.state === 'lobby' && VILLAGE_ROOMS.includes(screen)){ showScreen('village'); return; }
  overlay.classList.remove('show'); document.body.classList.remove('menuopen'); screen = ''; if(typeof doorBtnUpdate === 'function') doorBtnUpdate(); }
function startGame(opts = {}){
  if(overLimit()){ restFrom = null; showScreen('limit'); return; }
  if(typeof PG !== 'undefined' && PG && !PG.stopped) pangStop();
  if(typeof RH !== 'undefined' && RH && !RH.stopped) rhyStop();
  if(isTouch && SET.autoFull !== false) goFull();
  bgmStop(); screen = '';
  stopRainSound();
  if(!DEX.tutorialDone && !opts.daily && !opts.duo && !opts.resume && !opts.testItem && !opts.startStage) opts.tutorial = true;   // 처음이면 연습부터
  if(opts.stageRun !== undefined){ opts.startStage = opts.stageRun; if(opts.stageRun > 0) delete opts.tutorial; }
  if(opts.bossRun) opts.startStage = 7;
  if(!opts.resume) clearSave();
  newGame(opts); S.state = 'play'; hideScreen();
  if(opts.stageRun !== undefined) stageSetup(opts.stageRun);
  if(opts.bossRun){ S.found = DEX.counts.map(c => c > 0); S.bossPending = 40; S.nextChase = 1e9; }
  S.banner = {text:opts.testItem ? '아이템 시험 중: ' + ((CUSTOM.find(c => c.id === opts.testItem) || {}).name || '') : S.tutorial ? '연습 구간' : opts.resume ? '이어서 탐험!' : opts.daily ? '오늘의 도전!' : ZONES[S.zoneIdx % ZONES.length].name, t:0};
  if(S.duo) S.toast = {text:`${S.duo.names[S.duo.idx]} 차례예요!`, t:0};
  else if(vit() > 0) S.toast = {text:`⚡ 활력 ${vit()}: 글라이딩 +${vit()*5}% · 점프 조금 더 높이`, t:0};
  if(!S.duo && !opts.resume && (DEX.bonusLives || 0) > 0){
    const n = DEX.bonusLives; S.lives = Math.min(MAX_LIVES, S.lives + n); S.bonusLifeRun = n;
    DEX.bonusLives = 0; saveDex();
    S.toast = {text:`❤️ 안전체험관 보너스! 이번 판만 생명 +${n}`, t:0};
  }
  jumpQueued = 0; Object.keys(keys).forEach(k => keys[k] = false); jumpPointers.clear();
  if(isTouch){ if(!DEX.ctlHintSeen || S.tutorial || ACCS.symbols || ACCS.oneHand){ showCtlHint(); DEX.ctlHintSeen = true; saveDex(); } if(joyId !== null) joyEnd(); }
  tone(1,0.01,'sine',0.0001); // 모바일 오디오 잠금 해제
  bgmPlay(true);
}
function togglePause(){
  if(S.state !== 'play' || screen === 'learn' || screen === 'bag') return;
  S.paused = !S.paused;
  S.paused ? (showScreen('pause'), bgmStop(), stopRainSound()) : (hideScreen(), bgmPlay(false), S.rain && startRainSound());
}
document.getElementById('btnPause').onclick = e => { e.currentTarget.blur(); if(S.state === 'lobby'){ showScreen('title'); return; } togglePause(); };
document.getElementById('btnBag').onclick = e => { e.currentTarget.blur(); if(screen === 'bag') closeBag(); else if(S.state === 'play') openBag(); else if(S.state === 'lobby') showScreen('bag'); };
const btnSound = document.getElementById('btnSound');
btnSound.onclick = e => {
  soundOn = !soundOn; btnSound.style.opacity = soundOn ? 1 : 0.4; e.currentTarget.blur();
  if(!soundOn) bgmStop(); else if(S.state === 'play' && !S.paused) bgmPlay(false);
};
addEventListener('pagehide', () => { if(S) saveProgress(); });
document.addEventListener('visibilitychange', () => { if(document.hidden && S) saveProgress(); if(document.hidden && S.state === 'play' && !S.paused) togglePause(); });

/* ================= 루프 ================= */
let last = performance.now();
let perfN = 0, perfSum = 0, errCount = 0, errShown = 0;
let spokenToast = null, spokenBanner = null, spokenTut = -1, spokenDoor = null;
function symbolsTick(){
  if(!ACCS.symbols || !S) return;
  const clean = t => String(t).replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F]/gu, '').trim();
  if(S.toast && S.toast !== spokenToast){ spokenToast = S.toast; say(clean(S.toast.text), 'ko-KR'); }
  else if(S.banner && S.banner !== spokenBanner){ spokenBanner = S.banner; say(clean(S.banner.text), 'ko-KR'); }
  if(S.tutorial && S.state === 'play' && S.tutStep !== spokenTut && S.tutStep < TUT_N){ spokenTut = S.tutStep; setTimeout(() => say(clean(tutSteps()[S.tutStep].text), 'ko-KR'), 600); }
  if(S.state === 'lobby'){ const d = S.lobby.near; if(d && d !== spokenDoor){ spokenDoor = d; say(d.name, 'ko-KR'); } if(!d) spokenDoor = null; }
}
function reportError(err){   // 오류가 나도 화면이 멈추지 않게: 기록하고, 위험하면 안전하게 되돌리기
  errCount++; console.error(err);
  if(Date.now() - errShown > 5000){ errShown = Date.now(); if(S) S.toast = {text:'잠깐 문제가 생겨서 바로잡았어요', t:0}; }
  try{ if(S && S.state === 'play' && S.player && !S.bonus && !S.boss){ const P = S.player; if(!Number.isFinite(P.x) || !Number.isFinite(P.y)) respawn(); } }catch(e){}
}
addEventListener('error', e => { try{ if(S) S.toast = {text:'잠깐 문제가 생겼어요. 계속 안 되면 새로고침해 주세요', t:0}; }catch(_){} });
let lastDraw = 0, drawnFor = null;
function loop(now){
  const active = S.state === 'play' && !S.paused && !screen;
  if(now - lastDraw < (active ? 15.5 : 32)){ requestAnimationFrame(loop); return; }   // 게임 60번 · 로비·메뉴 30번 (120Hz 폰도 같게)
  lastDraw = now;
  const raw = now - last;
  try{ tickTime(Math.min(raw, 1000)/1000); symbolsTick(); }catch(e){}
  const dt = Math.min(50, raw); last = now;
  const perfOn = (S.state === 'play' && !S.paused) || (S.state === 'lobby' && !screen);
  if(SET.perf === 'auto' && !LIGHT && perfOn && raw < 200){
    perfN++; perfSum += raw;
    if(perfN >= (S.state === 'lobby' ? 90 : 180)){
      if(perfSum/perfN > (S.state === 'lobby' ? 45 : 26)){ LIGHT = true; resize(); S.toast = {text:'화면이 버벅여서 가벼운 모드로 바꿨어요', t:0}; }
      perfN = 0; perfSum = 0;
    }
  }
  const k = dt / 16.667;
  try{
  if(S.state === 'play' && !S.paused) update(k);
  else if(S.state === 'ending') updateEnding(k);
  else if(S.state === 'over' || S.state === 'win') updateFx(k);
  else if(S.state === 'title') S.time += k;
  else if(S.state === 'lobby' && !screen) updateLobby(k);
  const covered = screen && screen !== 'title';   // 메뉴가 덮고 있으면 한 번만 그리고 멈춰요
  if(!covered || drawnFor !== screen) render();
  drawnFor = covered ? screen : null;
  }catch(err){ reportError(err); }
  requestAnimationFrame(loop);
}
newGame(); showScreen(PROF.list.length > 1 ? 'profiles' : 'title'); loadSaved();
requestAnimationFrame(loop);
})();
